<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado da loja - Sistema Drogarema</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="acesso.js"></script>
  <script src="metas_core.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .num { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sec { background: #fef3c7; border: 1px solid #1e293b; font-weight: 700; text-align: center; padding: 3px 8px; font-size: 13px; letter-spacing: .02em; }
    .sec.verde { background: #bbf7d0; }
    .cx { border: 1px solid #cbd5e1; border-radius: 3px; padding: 1px 6px; display: inline-block; min-width: 64px; text-align: center; }
    .up { color: #047857; } .down { color: #be123c; }
    @media print { .noprint { display: none !important; } body { background: #fff !important; } .folha { box-shadow: none !important; border: 0 !important; } .bloco { break-inside: avoid; } }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">
  <div class="sticky top-0 z-40 bg-white border-b border-slate-200 noprint">
    <div class="max-w-[1100px] mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h1 class="text-lg font-bold text-slate-900">Resultado da loja</h1>
        <p class="text-[11px] text-slate-500">Indicadores de venda do mês e meta do mês seguinte</p>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <label class="text-slate-500">Loja <select id="selLoja" class="border border-slate-200 rounded px-2 py-1.5" onchange="trocar()"></select></label>
        <label class="text-slate-500">Mês de resultado <select id="selMes" class="border border-slate-200 rounded px-2 py-1.5 font-mono" onchange="trocar()"></select></label>
        <a id="lnkConsole" href="metas_console.html" class="px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50 text-slate-600">Metas</a>
        <a href="index.html" class="px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50 text-slate-600">← Painel</a>
      </div>
    </div>
  </div>

  <div class="max-w-[1100px] mx-auto px-4 py-4">
    <div id="aviso" class="text-sm"></div>
    <div id="folha" class="folha hidden bg-white border border-slate-200 rounded-lg shadow-sm p-6 space-y-5 text-[13px]"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jmetpmdnaxwabeccimgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------------------------------------------------------------------
    // RESULTADO DA LOJA (modelo "Apresentação de resultados").
    // Lê loja_resultados (publicado quando o Gestor salva o fechamento) e loja_metas.
    // Líder vê só a loja dele (a regra está no banco); Supervisor e Gestor escolhem a loja.
    // Só indicadores de venda e metas.
    // ---------------------------------------------------------------------
    const $ = id => document.getElementById(id);
    const M = MetasCore;
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const rs = v => v == null || !isFinite(v) ? '-' : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const n0 = v => v == null || !isFinite(v) ? '-' : Math.round(v).toLocaleString('pt-BR');
    const n2 = v => v == null || !isFinite(v) ? '-' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pc = v => v == null || !isFinite(v) ? '-' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
    const vr = (a, b) => a == null || b == null || !b ? null : a / b - 1;
    const cor = v => v == null ? 'text-slate-400' : v >= 0 ? 'up' : 'down';
    let dados = [], metas = [], perfil = '', lojaSel = null, mesSel = '';

    async function inicializar() {
      const { data: u } = await _supabase.rpc('fn_meu_usuario');
      perfil = u ? u.perfil : '';
      if (perfil !== 'GESTOR') $('lnkConsole').classList.add('hidden');
      const [rr, rm] = await Promise.all([_supabase.from('loja_resultados').select('competencia, loja_num, dados'), _supabase.from('loja_metas').select('*')]);
      if (rr.error || rm.error) { $('aviso').innerHTML = `<div class="bg-rose-50 border border-rose-300 text-rose-800 rounded-lg p-4 font-bold">Tela ainda não configurada no banco (SQL AZ). ${esc((rr.error || rm.error).message)}</div>`; return; }
      dados = rr.data || []; metas = rm.data || [];
      const lojas = [...new Set(dados.map(d => d.loja_num))].sort((a, b) => a - b);
      if (!lojas.length) { $('aviso').innerHTML = '<div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-4">Ainda não há resultado publicado para a sua loja. Ele aparece aqui quando o mês é fechado pela gestão.</div>'; return; }
      $('selLoja').innerHTML = lojas.map(l => `<option value="${l}">Loja ${l}</option>`).join('');
      if (lojas.length === 1) $('selLoja').disabled = true;
      lojaSel = lojas[0];
      preencherMeses(); render();
    }
    function preencherMeses() {
      const ms = dados.filter(d => d.loja_num === lojaSel).map(d => d.competencia).sort((a, b) => M.ordem(b) - M.ordem(a));
      $('selMes').innerHTML = ms.map(c => `<option value="${c}">${M.nomeMes(c)}</option>`).join('');
      if (!ms.includes(mesSel)) mesSel = ms[0];
      $('selMes').value = mesSel;
    }
    function trocar() {
      const l = parseInt($('selLoja').value, 10);
      if (l !== lojaSel) { lojaSel = l; preencherMeses(); } else mesSel = $('selMes').value;
      render();
    }

    function render() {
      const hist = {}; dados.filter(d => d.loja_num === lojaSel).forEach(d => { hist[d.competencia] = d.dados; });
      // até 5 meses terminando no mês escolhido (só os que têm resultado)
      const meses = Object.keys(hist).filter(c => M.ordem(c) <= M.ordem(mesSel)).sort((a, b) => M.ordem(a) - M.ordem(b)).slice(-5);
      const atual = hist[mesSel], antC = meses.length > 1 ? meses[meses.length - 2] : null, ant = antC ? hist[antC] : null;
      const nm = M.nomeMes, colunas = meses.length, grade = `grid-template-columns: 150px repeat(${colunas}, minmax(0, 1fr))`;
      const cab = `<div class="grid text-center text-slate-600 text-[12px]" style="${grade}"><div></div>${meses.map(c => `<div class="${c === mesSel ? 'font-bold text-slate-900' : ''}">${nm(c)}</div>`).join('')}</div>`;
      const linha = (rot, celulas, cls) => `<div class="grid items-center text-center ${cls || ''}" style="${grade}"><div class="text-left text-[11px] text-slate-500">${rot}</div>${celulas.map(x => `<div>${x}</div>`).join('')}</div>`;
      const serie = k => meses.map(c => hist[c][k]);
      const variacoes = k => meses.map((c, i) => i === 0 ? null : vr(hist[c][k], hist[meses[i - 1]][k]));
      const partes = k => meses.map(c => hist[c].fat ? (hist[c][k] ?? null) == null ? null : hist[c][k] / hist[c].fat : null);
      const cxVar = v => v == null ? '' : `<span class="cx mono ${cor(v)}">${pc(v)}</span>`;
      const cxPct = v => v == null ? '' : `<span class="cx mono">${pc(v)}</span>`;
      const maiorMenor = v => v == null ? '' : v >= 0 ? 'maior' : 'menor';
      const frase = t => `<p class="mt-2 leading-relaxed">${t}</p>`;
      const b = t => `<b class="mono">${t}</b>`;

      // bloco padrão: valores, variação mensal, % sobre a venda e a frase
      const bloco = (titulo, k, textoFn, opcoes = {}) => {
        const vals = serie(k); if (vals.every(v => v == null)) return '';
        const vv = variacoes(k), pp = partes(k), ult = vv[vv.length - 1], part = pp[pp.length - 1];
        return `<div class="bloco"><div class="sec">${titulo}</div><div class="mt-2 space-y-1">${cab}
          ${opcoes.semValor ? '' : linha('', vals.map(v => `<span class="mono font-semibold">${opcoes.inteiro ? n0(v) : rs(v)}</span>`))}
          ${linha('Variação mensal', vv.map(cxVar))}
          ${opcoes.semParte ? '' : linha('% sobre a venda', pp.map(cxPct))}</div>
          ${ant && ult != null ? frase(textoFn({ v: atual[k], var: ult, parte: part })) : ''}</div>`;
      };

      // gráfico de barras do faturamento (uma série, altura proporcional ao valor)
      const fats = serie('fat'), maxF = Math.max(...fats.filter(v => v != null), 1);
      const grafico = `<div class="grid items-end mt-3" style="${grade}; height: 120px"><div></div>${fats.map((v, i) => `<div class="flex flex-col items-center justify-end h-full">
          <div class="mono text-[11px] text-slate-700 mb-1">${n0(v)}</div>
          <div class="w-10 rounded-t ${meses[i] === mesSel ? 'bg-blue-700' : 'bg-blue-400'}" style="height: ${Math.max(2, (v || 0) / maxF * 78)}px"></div></div>`).join('')}</div>
        <div class="grid text-center text-[11px] text-slate-500 border-t border-slate-300 pt-1" style="${grade}"><div></div>${meses.map(c => `<div>${nm(c)}</div>`).join('')}</div>`;
      const varFat = vr(atual.fat, ant && ant.fat);

      // lucro: variação e % sobre a venda (sem o valor, como no modelo)
      const tabela3 = (titulo, campo, formato, verde) => {
        const ks = [['etico', 'ÉTICO'], ['similar', 'SIMILAR'], ['generico', 'GENÉRICO']];
        if (!meses.some(c => hist[c][campo])) return '';
        return `<div class="bloco"><div class="sec ${verde ? 'verde' : ''}">${titulo}</div><div class="mt-2 space-y-1">${cab}
          ${ks.map(([k, r]) => linha(`<span class="text-slate-700 font-semibold">${r}</span>`, meses.map(c => `<span class="mono">${formato((hist[c][campo] || {})[k])}</span>`))).join('')}</div></div>`;
      };
      const historicoPct = `<div class="bloco"><div class="sec verde">PARTICIPAÇÃO NO FATURAMENTO DA LOJA EM %</div><div class="mt-2 space-y-1">${cab}
        ${[['etico', 'ÉTICO'], ['simgen', 'SIM / GEN'], ['perf', 'PERFUMARIA']].map(([k, r]) => linha(`<span class="text-slate-700 font-semibold">${r}</span>`, partes(k).map(v => `<span class="mono">${pc(v)}</span>`))).join('')}</div></div>`;

      // metas: alcance do mês escolhido e meta do mês seguinte
      const mMes = metas.find(m => m.competencia === mesSel && m.loja_num === lojaSel);
      const prox = M.somaMes(mesSel, 1), mProx = metas.find(m => m.competencia === prox && m.loja_num === lojaSel);
      const alc = (real, meta) => { if (real == null || !meta) return '-'; const a = real / meta; return `<span class="mono font-semibold ${a >= 1 ? 'up' : 'down'}">${pc(a)}</span>`; };
      const quadroAlcance = !mMes ? '' : `<div class="bloco"><div class="sec">ALCANCE DA META DE ${nm(mesSel).toUpperCase()}</div>
        <table class="w-full mt-2 text-[12px]"><thead class="text-slate-500"><tr><th class="text-left font-semibold py-1"></th><th class="num font-semibold">Meta</th><th class="num font-semibold">Realizado</th><th class="num font-semibold">Alcance</th></tr></thead><tbody>
        ${[['Faturamento total', mMes.fat, atual.fat], ['Similar e genérico', mMes.simgen, atual.simgen], ['Perfumaria + fitoterápico', mMes.perf, atual.perf], ['Linha Sidney', mMes.sidney, atual.sidney]]
          .map(([r, me, re]) => `<tr class="border-t border-slate-100"><td class="py-1">${r}</td><td class="num">${rs(Number(me))}</td><td class="num">${rs(re)}</td><td class="num">${alc(re, Number(me))}</td></tr>`).join('')}
        <tr class="border-t border-slate-100"><td class="py-1">Similar e genérico em % do faturamento</td><td class="num">${pc(Number(mMes.pct_simgen))}</td><td class="num">${pc(atual.fat ? atual.simgen / atual.fat : null)}</td><td class="num"></td></tr>
        </tbody></table></div>`;
      const quadroMeta = !mProx ? `<div class="bloco"><div class="sec">META DO MÊS</div><p class="mt-2 text-slate-500">A meta de ${nm(prox)} ainda não foi definida.</p></div>`
        : `<div class="bloco"><div class="sec">META PARA ${nm(prox).toUpperCase()}</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
          ${[['Faturamento total', rs(Number(mProx.fat)), `média diária de ${rs(Number(mProx.fat) / mProx.dias)} em ${mProx.dias} dias`],
             ['Similar e genérico', rs(Number(mProx.simgen)), `${pc(Number(mProx.pct_simgen))} do faturamento · ${rs(Number(mProx.simgen) / mProx.dias)} por dia`],
             ['Perfumaria + fitoterápico', rs(Number(mProx.perf)), `${rs(Number(mProx.perf) / mProx.dias)} por dia`],
             ['Linha Sidney', rs(Number(mProx.sidney)), `${rs(Number(mProx.sidney) / mProx.dias)} por dia`]]
            .map(([t, v, d]) => `<div class="border border-slate-200 rounded-lg p-3"><div class="text-[11px] text-slate-500">${t}</div><div class="mono font-bold text-[15px] mt-0.5">${v}</div><div class="text-[10px] text-slate-500 mt-0.5">${d}</div></div>`).join('')}
        </div>
        <p class="mt-3 text-center font-semibold">Toda a equipe de vendas deve acompanhar diariamente as metas para alcançar este objetivo.</p></div>`;

      $('folha').innerHTML = `
        <div class="bloco"><div class="sec" style="background:#fde047;font-size:15px">APRESENTAÇÃO DE RESULTADOS</div>
          <div class="flex justify-between mt-2"><div>Loja: <b>${lojaSel}</b></div><div>Mês de resultado: <b>${nm(mesSel)}</b></div></div></div>
        <div class="bloco"><div class="sec">FATURAMENTO TOTAL</div>${grafico}
          <div class="mt-2 space-y-1">${linha('Variação mensal', variacoes('fat').map(cxVar))}</div>
          ${ant ? frase(`O faturamento do mês de ${b(nm(mesSel))} foi ${b(maiorMenor(varFat))} em ${b(pc(varFat))} comparando com o mês anterior.`) : ''}</div>
        <div class="bloco"><div class="sec">LUCRO DO MÊS</div><div class="mt-2 space-y-1">${cab}
          ${linha('Variação mensal', variacoes('lucro').map(cxVar))}${linha('% sobre a venda', partes('lucro').map(cxPct))}</div></div>
        ${bloco('SIMILAR E GENÉRICO', 'simgen', x => `A venda de SIMILAR e GENÉRICO no mês de ${b(nm(mesSel))} foi ${b(maiorMenor(x.var))} em ${b(pc(x.var))} comparado com o mês de ${b(nm(antC))} e representou ${b(pc(x.parte))} do faturamento total.` + (mProx || mMes ? ` O ideal para a loja ${lojaSel} é chegar em ${b(pc(Number((mProx || mMes).pct_simgen)))} do faturamento total.` : ''))}
        ${bloco('PERFUMARIA + FITOTERÁPICO', 'perf', x => `A venda de PERFUMARIA + FITO foi de ${b(rs(x.v))} no mês de ${b(nm(mesSel))}; o resultado foi ${b(maiorMenor(x.var))} em ${b(pc(x.var))} em comparação com o mês anterior e representou ${b(pc(x.parte))} do total vendido.`)}
        ${bloco('SIDNEY OLIVEIRA + RAHDA', 'sidney', x => `A venda da linha SIDNEY OLIVEIRA + RAHDA foi ${b(maiorMenor(x.var))} em ${b(pc(x.var))} comparado com o mês anterior.`)}
        ${bloco('ÉTICO', 'etico', x => `Para os produtos na categoria ÉTICO o valor da venda foi de ${b(rs(x.v))}, com variação ${b(maiorMenor(x.var))} em comparação com o mês anterior, representando ${b(pc(x.parte))} do faturamento total da loja.`)}
        ${bloco('DERMO + OUTROS', 'dermo_outros', x => `Na categoria DERMO e outros, o faturamento chegou em ${b(rs(x.v))}, com variação ${b(maiorMenor(x.var))} de ${b(pc(x.var))} comparando com o mês anterior, e alcançou ${b(pc(x.parte))} do faturamento total.`)}
        ${bloco('DELIVERY', 'delivery', x => `A venda por DELIVERY está ${b(x.var >= 0 ? 'mais alta' : 'mais baixa')} em ${b(pc(x.var))} comparando com o mês anterior e representou ${b(pc(x.parte))} do faturamento total.`)}
        ${bloco('QUANTIDADE DE ENTREGAS', 'entregas', x => `A quantidade de entregas ${b(x.var >= 0 ? 'aumentou' : 'reduziu')} em ${b(pc(x.var))} no mês de ${b(nm(mesSel))} comparando com o mês anterior.`, { inteiro: true, semParte: true })}
        ${tabela3('% DE DESCONTO DA LOJA', 'descp', pc)}
        ${tabela3('TICKET MÉDIO', 'ticket', n2)}
        ${historicoPct}
        ${quadroAlcance}
        ${quadroMeta}
        <div class="bloco"><div class="font-semibold">ANOTAÇÕES GERAIS:</div><div class="h-24 border-b border-slate-300"></div>
          <div class="grid grid-cols-2 gap-16 mt-12 text-center text-[12px]"><div class="border-t border-slate-500 pt-1">Líder da loja</div><div class="border-t border-slate-500 pt-1">Supervisão</div></div></div>`;
      $('folha').classList.remove('hidden');
    }

    inicializar();
  </script>
</body>
</html>
