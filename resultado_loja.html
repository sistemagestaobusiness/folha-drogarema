<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado da loja</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="acesso.js"></script>
  <script src="metas_core.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .num { text-align: right; white-space: nowrap; }
    .item { padding: 7px 14px; border-radius: 999px; font-size: 13px; color: #475569; cursor: pointer; }
    .item:hover { background: #e2e8f0; }
    .item.on { background: #0f172a; color: #fff; font-weight: 600; }
    .cartao { background: #fff; border-radius: 12px; padding: 18px 20px; }
    .rot { font-size: 11px; color: #64748b; }
    .barra { background: #2563eb; border-radius: 4px 4px 0 0; }
    .barra.apagada { background: #93c5fd; }
    .barraH { background: #2563eb; border-radius: 0 4px 4px 0; height: 10px; }
    .dica { position: relative; }
    .dica:hover::after { content: attr(data-dica); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: #0f172a; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 20; pointer-events: none; }
    table.t th { font-weight: 600; font-size: 11px; color: #64748b; padding: 6px 8px; }
    table.t td { padding: 7px 8px; border-top: 1px solid #f1f5f9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">
  <main class="p-6">
    <div class="max-w-[1100px] space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-xl font-bold text-slate-900">Resultado da loja</h1>
          <p id="sub" class="text-[12px] text-slate-500">Indicadores de venda do mês e meta do mês seguinte</p>
        </div>
        <div id="filtros" class="hidden flex items-center gap-2 text-sm">
          <select id="selLoja" class="bg-white rounded-lg px-3 py-2 text-sm text-slate-700 cursor-pointer" onchange="trocar()" aria-label="Loja"></select>
          <select id="selMes" class="bg-white rounded-lg px-3 py-2 text-sm text-slate-700 cursor-pointer" onchange="trocar()" aria-label="Mês de resultado"></select>
        </div>
      </div>
      <nav id="menu" class="hidden flex flex-wrap gap-1"></nav>
      <div id="aviso" class="text-sm"></div>
      <div id="conteudo" class="space-y-4"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://jmetpmdnaxwabeccimgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------------------------------------------------------------------
    // RESULTADO DA LOJA (base: modelo "Apresentação de resultados").
    // Lê loja_resultados (publicado quando a gestão fecha o mês) e loja_metas.
    // Líder vê só a loja dele (regra no banco); Supervisor e Gestor escolhem a loja.
    // Só indicadores de venda e metas. Menu lateral, uma seção por vez.
    // ---------------------------------------------------------------------
    const $ = id => document.getElementById(id);
    const M = MetasCore;
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const rs = v => v == null || !isFinite(v) ? '–' : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const n0 = v => v == null || !isFinite(v) ? '–' : Math.round(v).toLocaleString('pt-BR');
    const n2 = v => v == null || !isFinite(v) ? '–' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pc = v => v == null || !isFinite(v) ? '–' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
    const vr = (a, b) => a == null || b == null || !b ? null : a / b - 1;
    // variação: seta + texto (não depende só da cor)
    const selo = (v, pp) => v == null || !isFinite(v) ? '<span class="text-slate-300">–</span>'
      : `<span class="mono text-[12px] ${v >= 0 ? 'text-emerald-700' : 'text-rose-700'}">${v >= 0 ? '▲' : '▼'} ${pp ? Math.abs(v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' pp' : pc(Math.abs(v))}</span>`;
    const SECOES = [['geral', 'Visão geral', '◧'], ['categorias', 'Categorias', '▤'], ['precos', 'Desconto e ticket', '％'], ['delivery', 'Delivery', '➜'], ['equipe', 'Equipe', '◔'], ['individual', 'Individual', '☺'], ['metas', 'Metas', '◎']];
    let dados = [], metas = [], perfil = '', lojaSel = null, mesSel = '', secao = 'geral';

    // ficha individual: valores de premiação por venda já lançados na folha do mês fechado (SQL BD). Uma pessoa por vez.
    let indCache = {}, indSel = '';
    // "Todas as lojas" (loja 0): soma das lojas em cada mês. Valores e metas são somados;
    // % de desconto e ticket médio por classificação são a média das lojas ponderada pelo faturamento.
    function consolidar(lojas) {
      const SOMA = ['fat', 'lucro', 'simgen', 'perf', 'sidney', 'etico', 'dermo_outros', 'bruto', 'desconto', 'delivery', 'entregas'];
      [...new Set(dados.map(d => d.competencia))].forEach(c => { const linhas = dados.filter(d => d.competencia === c && d.loja_num > 0), t = { equipe: [] };
        SOMA.forEach(k => { const v = linhas.map(l => l.dados[k]).filter(x => x != null); if (v.length) t[k] = v.reduce((a, b) => a + Number(b), 0); });
        ['descp', 'ticket'].forEach(g => { const acc = {}; linhas.forEach(l => { const o = l.dados[g], p = Number(l.dados.fat) || 0; if (!o || !p) return;
            Object.keys(o).forEach(k => { if (o[k] == null || !isFinite(o[k])) return; const a = (acc[k] = acc[k] || { s: 0, p: 0 }); a.s += o[k] * p; a.p += p; }); });
          if (Object.keys(acc).length) { t[g] = {}; Object.keys(acc).forEach(k => t[g][k] = acc[k].s / acc[k].p); } });
        linhas.forEach(l => (l.dados.equipe || []).forEach(p => t.equipe.push(Object.assign({}, p, { nome: p.nome + ' · L' + l.loja_num }))));
        if (!t.equipe.length) delete t.equipe;
        dados.push({ competencia: c, loja_num: 0, dados: t, lojas: linhas.length }); });
      [...new Set(metas.map(m => m.competencia))].forEach(c => { const ms = metas.filter(m => m.competencia === c && m.loja_num > 0); if (ms.length < lojas.length) return;
        const s = k => ms.reduce((a, m) => a + Number(m[k] || 0), 0), fat = s('fat');
        metas.push({ competencia: c, loja_num: 0, dias: ms[0].dias, fat, simgen: s('simgen'), perf: s('perf'), sidney: s('sidney'), pct_simgen: fat ? s('simgen') / fat : null }); });
    }
    async function carregarIndividual() {
      if (lojaSel === 0) { $('indiv').innerHTML = 'A ficha individual é por loja. Escolha uma loja no filtro acima.'; return; }
      const chave = mesSel + '|' + lojaSel;
      if (!indCache[chave]) { const { data, error } = await _supabase.rpc('fn_valores_individuais_loja', { p_competencia: mesSel, p_loja: lojaSel });
        if (error) { $('indiv').innerHTML = `<span class="text-rose-800 font-semibold">Ficha individual ainda não configurada no banco (SQL BD). ${esc(error.message)}</span>`; return; }
        indCache[chave] = data || []; }
      desenharIndividual();
    }
    function escolherIndividual(v) { indSel = v; desenharIndividual(); }
    function desenharIndividual() {
      const box = $('indiv'); if (!box || secao !== 'individual') return;
      const linhas = indCache[mesSel + '|' + lojaSel] || [], pessoas = {}; linhas.forEach(x => (pessoas[x.funcionario] = pessoas[x.funcionario] || { nome: x.nome, itens: [] }).itens.push(x));
      // venda do mês de cada atendente (publicada no fechamento): entra mesmo para quem não teve valor lançado
      const reg = dados.find(d => d.competencia === mesSel && d.loja_num === lojaSel), tk = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().split(/\s+/).filter(x => x.length > 2);
      ((reg && reg.dados.equipe) || []).forEach(e => { let id = e.fid && pessoas[e.fid] ? e.fid : null;
        if (!id) { const t = tk(e.nome); id = Object.keys(pessoas).find(k => { const n = tk(pessoas[k].nome); return t.length >= 2 && t[0] === n[0] && t.every(p => n.includes(p)); }) || null; }
        if (!id) { id = e.fid || 'v:' + e.nome; pessoas[id] = { nome: e.nome, itens: [] }; }
        pessoas[id].venda = e; });
      const ids = Object.keys(pessoas).sort((a, b) => pessoas[a].nome.localeCompare(pessoas[b].nome));
      if (!ids.length) { box.innerHTML = `Não há venda nem valores lançados para a Loja ${lojaSel} em ${M.nomeMes(mesSel)}.`; return; }
      const VEND = [['simgen', 'Similar e genérico'], ['perf', 'Perfumaria'], ['sidney', 'Linha Sidney'], ['vit', 'Vitaminas']];
      if (!pessoas[indSel]) indSel = '';
      const p = pessoas[indSel], v2 = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const tot = p ? p.itens.reduce((a, i) => a + Number(i.valor || 0), 0) : 0;
      box.className = 'cartao';
      box.innerHTML = `<div class="flex flex-wrap items-center gap-3"><label class="text-[13px] text-slate-600">Funcionário</label>
          <select onchange="escolherIndividual(this.value)" class="bg-slate-100 rounded-lg px-3 py-2 text-sm cursor-pointer"><option value="">selecione…</option>${ids.map(i => `<option value="${i}" ${i === indSel ? 'selected' : ''}>${esc(pessoas[i].nome)}</option>`).join('')}</select>
          ${p ? `<button onclick="escolherIndividual('')" class="text-[12px] text-slate-500 underline cursor-pointer">fechar</button>` : ''}</div>
        ${p ? `<div class="mt-4"><div class="text-lg font-bold text-slate-900">${esc(p.nome)}</div><div class="rot">${M.nomeMes(mesSel)} · Loja ${lojaSel}</div>
          <div class="rot mt-4 mb-1 font-semibold">Venda no mês</div>
          ${p.venda ? `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3" style="max-width:760px">${VEND.map(([k, t]) => `<div class="bg-slate-50 rounded-lg px-3 py-2"><div class="rot">${t}</div><div class="mono font-semibold text-slate-900">${v2(p.venda[k] || 0)}</div></div>`).join('')}</div>` : '<div class="rot">Sem venda por atendente publicada para este mês.</div>'}
          <div class="rot mt-4 mb-1 font-semibold">Valores do mês</div>
          ${!p.itens.length ? '<div class="text-[13px] text-slate-600">Sem valor lançado neste mês.</div>' : `<table class="t w-full text-[13px]" style="max-width:760px"><thead><tr><th class="text-left">Item</th><th class="num">Venda que gerou o valor</th><th class="num">%</th><th class="num">Valor</th></tr></thead><tbody>
          ${p.itens.map(i => `<tr><td>${esc(i.descricao || i.codigo)}</td><td class="num mono text-slate-600">${i.venda_base != null ? v2(i.venda_base) : '–'}</td><td class="num mono text-slate-500">${i.venda_base > 0 ? pc(i.valor / i.venda_base) : '–'}</td><td class="num mono font-semibold">${v2(i.valor)}</td></tr>`).join('')}
          <tr><td class="font-semibold">Total</td><td></td><td></td><td class="num mono font-bold text-slate-900">${v2(tot)}</td></tr></tbody></table>`}
          <p class="rot mt-3">Venda no mês: tudo o que a pessoa vendeu em cada linha, em qualquer loja. "Venda que gerou o valor": só a parte feita em loja que atingiu a faixa do plano; por isso pode ser menor que a venda do mês. Valores lançados na folha de ${M.nomeMes(mesSel)}, calculados pelo Alpha7.</p></div>`
        : '<p class="rot mt-3">Escolha um funcionário para ver os valores dele. A tela mostra uma pessoa por vez.</p>'}`;
    }
    let faixasLoja = [];
    // faixas de premiação de similar e genérico (espelho do Alpha7; quem altera é o Gestor, em Metas das lojas)
    // total real das premiações por venda lançadas na folha para a equipe da loja (mesma origem da aba Individual)
    async function preencherReal() {
      const el = $('realEquipe'); if (!el) return; const comp = mesSel, loja = lojaSel, lojas = loja === 0 ? M.LOJAS : [loja]; let tot = 0; const gente = new Set();
      for (const l of lojas) { const ch = comp + '|' + l;
        if (!indCache[ch]) { const { data, error } = await _supabase.rpc('fn_valores_individuais_loja', { p_competencia: comp, p_loja: l }); if (error) { el.textContent = ''; return; } indCache[ch] = data || []; }
        indCache[ch].forEach(x => { tot += Number(x.valor || 0); gente.add(x.funcionario); }); }
      const e2 = $('realEquipe'); if (!e2 || comp !== mesSel || loja !== lojaSel) return;
      e2.innerHTML = gente.size ? `<div class="cartao"><div class="font-semibold text-slate-900">Valor real da equipe em ${M.nomeMes(comp)}</div><div class="text-2xl font-bold text-slate-900 mono mt-1">R$ ${tot.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
        <p class="rot mt-1">Soma do que foi lançado na folha para ${gente.size} pessoa(s) ${loja === 0 ? 'das lojas' : 'da loja'}, em todas as linhas (similar e genérico, perfumaria, Sidney, valor fixo, vitaminas e quarentena). O detalhe por pessoa está na aba Individual.</p></div>` : '';
    }
    function cartaoFaixas(venda) {
      const reg = faixasLoja.find(f => f.loja_num === lojaSel); const fx = ((reg && reg.faixas) || []).map(f => ({ de: Number(f.ini) * 1000, pct: Number(f.pct) / 100 })).filter(f => f.de > 0).sort((a, b) => a.de - b.de);
      if (!fx.length || !(venda > 0)) return '';
      let i = -1; fx.forEach((f, k) => { if (venda >= f.de) i = k; });
      const at = i >= 0 ? fx[i] : null, px = fx[i + 1] || null, ganho = at ? venda * at.pct : 0;
      const p1 = v => (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
      let txt = at ? `A loja vendeu <b>${rs(venda)}</b> em similar e genérico e ficou na faixa de <b>${p1(at.pct)}</b>: premiação estimada da loja de <b>${rs(ganho)}</b>.`
        : `A loja vendeu <b>${rs(venda)}</b> em similar e genérico e não chegou à primeira faixa (${rs(fx[0].de)}).`;
      if (px) txt += ` Com mais <b>${rs(px.de - venda)}</b> de venda chegaria a ${rs(px.de)}, faixa de <b>${p1(px.pct)}</b>: a estimativa passaria para <b>${rs(px.de * px.pct)}</b>${at ? ` (${rs(px.de * px.pct - ganho)} a mais)` : ''}.`;
      else txt += ' É a faixa mais alta da loja.';
      const tab = fx.map((f, k) => `<tr class="${k === i ? 'font-semibold text-slate-900' : 'text-slate-500'}"><td class="py-0.5 pr-6">${rs(f.de)}${fx[k + 1] ? ' até ' + rs(fx[k + 1].de) : ' ou mais'}</td><td class="num mono">${p1(f.pct)}</td><td class="pl-3">${k === i ? '← faixa do mês' : ''}</td></tr>`).join('');
      return `<div class="cartao"><div class="font-semibold text-slate-900">Similar e genérico: faixa de premiação</div><p class="text-[13px] text-slate-700 mt-2 leading-relaxed">${txt}</p>
        <p class="rot mt-1">Estimativa da loja; o valor de cada pessoa é calculado individualmente.</p><details class="mt-1"><summary class="rot cursor-pointer">ver as faixas da loja</summary><table class="text-[12px] mt-2">${tab}</table>
        <p class="rot mt-1">Estimativa para a loja inteira, pela venda do mês. O valor de cada pessoa é calculado individualmente no Alpha7 e a soma pode ser menor (nem toda venda entra na premiação).</p></details></div>`;
    }
    async function inicializar() {
      const { data: u } = await _supabase.rpc('fn_meu_usuario');
      perfil = u ? u.perfil : '';
      const [rr, rm] = await Promise.all([_supabase.from('loja_resultados').select('competencia, loja_num, dados'), _supabase.from('loja_metas').select('*')]);
      if (rr.error || rm.error) { $('aviso').innerHTML = `<div class="cartao text-rose-800 font-semibold">Tela ainda não configurada no banco (SQL AZ). ${esc((rr.error || rm.error).message)}</div>`; return; }
      dados = rr.data || []; metas = rm.data || [];
      try { const rf = await _supabase.from('loja_faixas').select('loja_num, faixas').eq('categoria', 'SIMGEN'); faixasLoja = rf.error ? [] : (rf.data || []); } catch (e) { faixasLoja = []; }
      const lojas = [...new Set(dados.map(d => d.loja_num))].sort((a, b) => a - b);
      if (lojas.length > 1) consolidar(lojas);
      if (!lojas.length) { $('aviso').innerHTML = '<div class="cartao text-slate-600">Ainda não há resultado publicado para a sua loja. Ele aparece aqui quando o mês é fechado pela gestão.</div>'; return; }
      $('selLoja').innerHTML = (lojas.length > 1 ? '<option value="0">Todas as lojas</option>' : '') + lojas.map(l => `<option value="${l}">Loja ${l}</option>`).join('');
      if (lojas.length === 1) $('selLoja').classList.add('hidden');
      $('filtros').classList.remove('hidden'); $('menu').classList.remove('hidden');
      lojaSel = lojas[0]; $('selLoja').value = lojaSel;
      preencherMeses(); render();
    }
    function preencherMeses() {
      const ms = dados.filter(d => d.loja_num === lojaSel).map(d => d.competencia).sort((a, b) => M.ordem(b) - M.ordem(a));
      $('selMes').innerHTML = ms.map(c => `<option value="${c}">${M.nomeMes(c)}</option>`).join('');
      if (!ms.includes(mesSel)) mesSel = ms[0];
      $('selMes').value = mesSel;
    }
    function trocar() {
      const l = parseInt($('selLoja').value, 10);
      if (l !== lojaSel) { lojaSel = l; preencherMeses(); } else mesSel = $('selMes').value;
      render();
    }
    function irPara(s) { secao = s; render(); }

    function render() {
      const hist = {}; dados.filter(d => d.loja_num === lojaSel).forEach(d => { hist[d.competencia] = d.dados; });
      const meses = Object.keys(hist).filter(c => M.ordem(c) <= M.ordem(mesSel)).sort((a, b) => M.ordem(a) - M.ordem(b)).slice(-5);
      const A = hist[mesSel], antC = meses.length > 1 ? meses[meses.length - 2] : null, B = antC ? hist[antC] : null, nm = M.nomeMes;
      $('sub').innerText = `${lojaSel === 0 ? 'Todas as lojas (rede)' : 'Loja ' + lojaSel} · ${nm(mesSel)}`;
      $('menu').innerHTML = SECOES.map(([k, t, i]) => `<button class="item ${k === secao ? 'on' : ''}" onclick="irPara('${k}')">${t}</button>`).join('');
      const parte = (d, k) => d && d.fat && d[k] != null ? d[k] / d.fat : null;
      const titulo = (t, sub) => `<div><h2 class="text-lg font-bold text-slate-900">${t}</h2>${sub ? `<p class="text-[12px] text-slate-500">${sub}</p>` : ''}</div>`;
      const vsAnt = antC ? `comparado com ${nm(antC)}` : 'sem mês anterior para comparar';
      const maiorMenor = v => v >= 0 ? 'maior' : 'menor';

      // barras: uma série (o indicador), mês escolhido em destaque; valor em cima e dica ao passar o mouse
      const barras = (k, fmtV) => { const vs = meses.map(c => hist[c][k]), mx = Math.max(...vs.filter(v => v != null), 1);
        return `<div class="flex items-end gap-[2px] h-40 mt-3">${meses.map((c, i) => { const v = vs[i];
          return `<div class="flex-1 flex flex-col items-center justify-end h-full dica" data-dica="${nm(c)}: ${fmtV(v)}">
            <div class="mono text-[11px] text-slate-600 mb-1">${v == null ? '–' : n0(v)}</div>
            <div class="barra ${c === mesSel ? '' : 'apagada'} w-3/5 max-w-[56px]" style="height:${v == null ? 0 : Math.max(2, v / mx * 112)}px"></div></div>`; }).join('')}</div>
          <div class="flex gap-[2px] border-t border-slate-200 pt-1">${meses.map(c => `<div class="flex-1 text-center text-[11px] ${c === mesSel ? 'text-slate-900 font-semibold' : 'text-slate-500'}">${nm(c)}</div>`).join('')}</div>`; };
      // tabela mês a mês de um indicador: valor, variação, % da venda
      const tabelaMeses = (linhas) => `<div class="overflow-x-auto"><table class="t w-full text-[13px]"><thead><tr><th class="text-left">Indicador</th>${meses.map(c => `<th class="num">${nm(c)}</th>`).join('')}<th class="num">Variação</th></tr></thead><tbody>
        ${linhas.map(([rot, fn, fmtV, pp]) => { const vs = meses.map(c => fn(hist[c])); const u = vs[vs.length - 1], p = vs.length > 1 ? vs[vs.length - 2] : null;
          return `<tr><td>${rot}</td>${vs.map((v, i) => `<td class="num mono ${i === vs.length - 1 ? 'font-semibold text-slate-900' : 'text-slate-600'}">${fmtV(v)}</td>`).join('')}<td class="num">${selo(pp ? (u != null && p != null ? u - p : null) : vr(u, p), pp)}</td></tr>`; }).join('')}</tbody></table></div>`;
      const cartaoKpi = (rot, valor, variacao, extra, pp) => `<div class="cartao"><div class="rot">${rot}</div><div class="mono text-[20px] font-bold text-slate-900 mt-1">${valor}</div><div class="mt-1 flex items-center gap-2">${selo(variacao, pp)}<span class="text-[11px] text-slate-400">${extra || ''}</span></div></div>`;
      const texto = t => `<p class="text-[13px] text-slate-600 leading-relaxed mt-3">${t}</p>`;
      const b = t => `<b class="text-slate-900">${t}</b>`;
      let h = '';

      if (secao === 'geral') {
        const vf = vr(A.fat, B && B.fat);
        h = titulo('Visão geral', `${nm(mesSel)} · ${vsAnt}`) + `
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
          ${cartaoKpi('Faturamento total', rs(A.fat), vf)}
          ${cartaoKpi('Lucro sobre a venda', pc(parte(A, 'lucro')), B ? parte(A, 'lucro') - parte(B, 'lucro') : null, `lucro ${selo(vr(A.lucro, B && B.lucro))}`, true)}
          ${cartaoKpi('Similar e genérico', rs(A.simgen), vr(A.simgen, B && B.simgen), pc(parte(A, 'simgen')) + ' da venda')}
          ${cartaoKpi('Perfumaria + fito', rs(A.perf), vr(A.perf, B && B.perf), pc(parte(A, 'perf')) + ' da venda')}
        </div>
        <div class="cartao"><div class="font-semibold text-slate-900">Faturamento total por mês</div>${barras('fat', rs)}
          ${B ? texto(`O faturamento de ${b(nm(mesSel))} foi ${b(maiorMenor(vf))} em ${b(pc(Math.abs(vf)))} comparando com o mês anterior.`) : ''}</div>
        <div class="cartao"><div class="font-semibold text-slate-900 mb-2">Participação no faturamento da loja</div>
          ${tabelaMeses([['Ético', d => parte(d, 'etico'), pc, true], ['Similar e genérico', d => parte(d, 'simgen'), pc, true], ['Perfumaria + fito', d => parte(d, 'perf'), pc, true], ['Lucro sobre a venda', d => parte(d, 'lucro'), pc, true]])}</div>`;
      }

      if (secao === 'categorias') {
        const cats = [['simgen', 'Similar e genérico'], ['perf', 'Perfumaria + fitoterápico'], ['sidney', 'Sidney Oliveira + Rahda'], ['etico', 'Ético'], ['dermo_outros', 'Dermo + outros']];
        const meta = metas.find(m => m.loja_num === lojaSel && (m.competencia === M.somaMes(mesSel, 1) || m.competencia === mesSel));
        const frases = { simgen: v => `A venda de similar e genérico foi ${b(maiorMenor(v))} em ${b(pc(Math.abs(v)))} e representou ${b(pc(parte(A, 'simgen')))} do faturamento.` + (meta ? ` O ideal para a loja é chegar em ${b(pc(Number(meta.pct_simgen)))}.` : ''),
          perf: v => `Perfumaria + fito somou ${b(rs(A.perf))}, ${b(maiorMenor(v))} em ${b(pc(Math.abs(v)))}, e representou ${b(pc(parte(A, 'perf')))} do total vendido.`,
          sidney: v => `A linha Sidney Oliveira + Rahda foi ${b(maiorMenor(v))} em ${b(pc(Math.abs(v)))}.`,
          etico: v => `Ético vendeu ${b(rs(A.etico))}, variação ${b(maiorMenor(v))} de ${b(pc(Math.abs(v)))}, com ${b(pc(parte(A, 'etico')))} do faturamento.`,
          dermo_outros: v => `Dermo e outros chegou em ${b(rs(A.dermo_outros))}, ${b(maiorMenor(v))} em ${b(pc(Math.abs(v)))}, com ${b(pc(parte(A, 'dermo_outros')))} do faturamento.` };
        h = titulo('Categorias', `venda por categoria · ${vsAnt}`) + cats.map(([k, t]) => { const v = vr(A[k], B && B[k]);
          return `<div class="cartao"><div class="flex justify-between items-baseline"><div class="font-semibold text-slate-900">${t}</div><div class="flex items-center gap-3"><span class="mono font-bold">${rs(A[k])}</span>${selo(v)}</div></div>
            ${tabelaMeses([['Venda', d => d[k], rs], ['% sobre a venda', d => parte(d, k), pc, true]])}${v != null ? texto(frases[k](v)) : ''}</div>`; }).join('');
      }

      if (secao === 'precos') {
        const ks = [['etico', 'Ético'], ['similar', 'Similar'], ['generico', 'Genérico']];
        const tem = campo => meses.some(c => hist[c][campo]);
        h = titulo('Desconto e ticket', 'por classificação · ' + vsAnt) +
          (tem('descp') ? `<div class="cartao"><div class="font-semibold text-slate-900 mb-2">% de desconto da loja</div>${tabelaMeses(ks.map(([k, t]) => [t, d => (d.descp || {})[k], pc, true]))}
            <p class="rot mt-2">Desconto concedido sobre o preço cheio. Subir significa vender com mais desconto.</p></div>` : '') +
          (tem('ticket') ? `<div class="cartao"><div class="font-semibold text-slate-900 mb-2">Ticket médio (R$ por item)</div>${tabelaMeses(ks.map(([k, t]) => [t, d => (d.ticket || {})[k], n2]))}</div>` : '') +
          (lojaSel === 0 && (tem('descp') || tem('ticket')) ? '<p class="rot">Na visão de todas as lojas, o % de desconto e o ticket são a média das lojas ponderada pelo faturamento.</p>' : '') +
          (!tem('descp') && !tem('ticket') ? '<div class="cartao text-slate-500">Sem dados de desconto e ticket para os meses desta loja.</div>' : '');
      }

      if (secao === 'delivery') {
        const tem = meses.some(c => hist[c].delivery != null);
        h = titulo('Delivery', vsAnt) + (!tem ? '<div class="cartao text-slate-500">O relatório de entregas ainda não foi incluído no fechamento destes meses.</div>' : `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            ${cartaoKpi('Venda por delivery', rs(A.delivery), vr(A.delivery, B && B.delivery), pc(parte(A, 'delivery')) + ' da venda')}
            ${cartaoKpi('Entregas', n0(A.entregas), vr(A.entregas, B && B.entregas))}
            ${cartaoKpi('Valor médio por entrega', rs(A.entregas ? A.delivery / A.entregas : null), B && B.entregas ? vr(A.delivery / A.entregas, B.delivery / B.entregas) : null)}
          </div>
          <div class="cartao"><div class="font-semibold text-slate-900">Venda por delivery por mês</div>${barras('delivery', rs)}</div>
          <div class="cartao">${tabelaMeses([['Venda por delivery', d => d.delivery, rs], ['% sobre a venda', d => parte(d, 'delivery'), pc, true], ['Quantidade de entregas', d => d.entregas, n0]])}</div>`);
      }

      if (secao === 'individual') {
        h = titulo('Individual', 'valores de cada pessoa em ' + nm(mesSel) + ', uma por vez') + '<div id="indiv" class="cartao text-slate-500">Carregando…</div>';
        $('conteudo').innerHTML = h; carregarIndividual(); return;
      }
      if (secao === 'equipe') {
        const eq = A.equipe || [], eqB = (B && B.equipe) || [];
        const cols = [['simgen', 'Similar e genérico'], ['perf', 'Perfumaria'], ['sidney', 'Linha Sidney'], ['vit', 'Vitaminas']];
        const ord = window._ordEq || 'simgen';
        const lista = eq.slice().sort((x, y) => (y[ord] || 0) - (x[ord] || 0)), mx = Math.max(...lista.map(p => p[ord] || 0), 1), tot = lista.reduce((a, p) => a + (p[ord] || 0), 0);
        h = titulo('Equipe', 'venda de cada atendente no mês · ' + vsAnt) + (!eq.length ? '<div class="cartao text-slate-500">As vendas por atendente aparecem a partir dos meses fechados com os relatórios por usuário do Alpha7.</div>' : `
          <div class="cartao"><div class="flex flex-wrap items-center justify-between gap-2"><div class="font-semibold text-slate-900">${cols.find(c => c[0] === ord)[1]} por atendente</div>
            <div class="flex gap-1 text-[12px]">${cols.map(([k, t]) => `<button onclick="window._ordEq='${k}';render()" class="px-2.5 py-1 rounded-lg ${k === ord ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'} cursor-pointer">${t}</button>`).join('')}</div></div>
            <div class="mt-3 space-y-2">${lista.filter(p => p[ord] > 0).map(p => { const ant = eqB.find(x => x.nome === p.nome);
              return `<div class="grid items-center gap-3 dica" style="grid-template-columns: 210px 1fr 110px 70px 80px" data-dica="${esc(p.nome)}: ${rs(p[ord])}${ant ? ' · mês anterior ' + rs(ant[ord]) : ''}">
                <div class="truncate text-[13px] text-slate-700">${esc(p.nome)}</div><div><div class="barraH" style="width:${Math.max(1, p[ord] / mx * 100)}%"></div></div>
                <div class="num mono text-[13px] font-semibold">${rs(p[ord])}</div><div class="num mono text-[12px] text-slate-500">${pc(tot ? p[ord] / tot : null)}</div><div class="num">${selo(ant ? vr(p[ord], ant[ord]) : null)}</div></div>`; }).join('')}</div>
            <p class="rot mt-3">Barra = venda do atendente · % = participação na soma da equipe · variação sobre o mês anterior. Venda do atendente em cada linha, somando todas as lojas em que vendeu, com ou sem premiação.</p></div>
          <div class="cartao"><div class="font-semibold text-slate-900 mb-2">Todos os indicadores</div><div class="overflow-x-auto"><table class="t w-full text-[13px]"><thead><tr><th class="text-left">Atendente</th>${cols.map(c => `<th class="num">${c[1]}</th>`).join('')}</tr></thead><tbody>
            ${eq.map(p => `<tr><td>${esc(p.nome)}</td>${cols.map(([k]) => `<td class="num mono">${p[k] ? rs(p[k]) : '<span class="text-slate-300">–</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`);
      }

      if (secao === 'metas') {
        const mMes = metas.find(m => m.competencia === mesSel && m.loja_num === lojaSel), prox = M.somaMes(mesSel, 1), mProx = metas.find(m => m.competencia === prox && m.loja_num === lojaSel);
        const linhaAlc = (rot, me, re) => { const a = me ? re / me : null;
          return `<div class="grid items-center gap-3 py-2 border-t border-slate-100" style="grid-template-columns: 200px 1fr 120px 120px 80px"><div class="text-[13px]">${rot}</div>
            <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden dica" data-dica="${pc(a)} da meta"><div class="h-full ${a >= 1 ? 'bg-emerald-600' : 'bg-blue-600'}" style="width:${Math.min(100, (a || 0) * 100)}%"></div></div>
            <div class="num mono text-[12px] text-slate-500">${rs(me)}</div><div class="num mono text-[13px] font-semibold">${rs(re)}</div><div class="num mono text-[13px] ${a >= 1 ? 'text-emerald-700' : 'text-slate-700'}">${a >= 1 ? '✓ ' : ''}${pc(a)}</div></div>`; };
        h = titulo('Metas', `alcance de ${nm(mesSel)} e meta de ${nm(prox)}`) +
          (mMes ? `<div class="cartao"><div class="font-semibold text-slate-900">Alcance da meta de ${nm(mesSel)}</div>
            <div class="grid gap-3 mt-2 rot" style="grid-template-columns: 200px 1fr 120px 120px 80px"><div></div><div></div><div class="num">Meta</div><div class="num">Realizado</div><div class="num">Alcance</div></div>
            ${linhaAlc('Faturamento total', Number(mMes.fat), A.fat)}${linhaAlc('Similar e genérico', Number(mMes.simgen), A.simgen)}${linhaAlc('Perfumaria + fito', Number(mMes.perf), A.perf)}${linhaAlc('Linha Sidney', Number(mMes.sidney), A.sidney)}
            <p class="rot mt-2">Similar e genérico: meta de ${pc(Number(mMes.pct_simgen))} do faturamento, realizado ${pc(parte(A, 'simgen'))}.</p></div>` : `<div class="cartao text-slate-500">Não havia meta registrada para ${nm(mesSel)}.</div>`) + cartaoFaixas(A.simgen) + '<div id="realEquipe"></div>' +
          (mProx ? `<div class="cartao"><div class="font-semibold text-slate-900">Meta para ${nm(prox)} <span class="rot font-normal">· ${mProx.dias} dias</span></div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-3">${[['Faturamento total', mProx.fat, ''], ['Similar e genérico', mProx.simgen, pc(Number(mProx.pct_simgen)) + ' do faturamento'], ['Perfumaria + fito', mProx.perf, ''], ['Linha Sidney', mProx.sidney, '']]
              .map(([t, v, d]) => `<div class="bg-slate-50 rounded-lg p-3"><div class="rot">${t}</div><div class="mono font-bold text-[16px] text-slate-900 mt-0.5">${rs(Number(v))}</div><div class="rot mt-0.5">${rs(Number(v) / mProx.dias)} por dia${d ? ' · ' + d : ''}</div></div>`).join('')}</div>
            <p class="text-[13px] text-slate-600 mt-3">Toda a equipe de vendas deve acompanhar diariamente as metas para alcançar este objetivo.</p></div>` : `<div class="cartao text-slate-500">A meta de ${nm(prox)} ainda não foi definida.</div>`);
      }
      $('conteudo').innerHTML = h; if (secao === 'metas') preencherReal();
    }

    inicializar();
  </script>
</body>
</html>
