<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos - Business</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="acesso.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F5F7] text-slate-800 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-[1300px] mx-auto space-y-4">

    <div class="cab-sis flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 py-3 border-b border-slate-200">
      <div>
        <h1 class="tit-sis text-xl font-bold text-slate-900">✚ Planos · odontológico, saúde e Mogi Care</h1>
        <p class="text-xs text-slate-500">Desconto mensal dos planos, contábil ou não contábil por pessoa. Incluir é livre; mudar o valor, mudar contábil/não contábil ou tirar o desconto precisa de justificativa e passa pelo Gestor.</p>
      </div>
      <div class="text-right"><span id="lblUsuario" class="block text-[11px] font-bold text-slate-700">-</span><span id="lblPerfil" class="block text-[10px] text-slate-400 font-mono">-</span></div>
    </div>

    <div id="aviso" class="hidden bg-rose-50 border border-rose-300 text-rose-800 rounded-xl p-4 text-sm font-bold"></div>

    <div id="conteudo" class="hidden space-y-3">
      <div class="flex gap-1 border-b border-slate-300">
        <button id="tabLanc" onclick="trocarAba('lanc')" class="aba px-4 py-2 text-xs font-bold rounded-t-lg cursor-pointer">Lançamento do mês</button>
        <button id="tabApr" onclick="trocarAba('aprovacao')" class="aba px-4 py-2 text-xs font-bold rounded-t-lg cursor-pointer">Aprovação do Gestor <span id="qtdApr" class="hidden ml-1 bg-red-600 text-white rounded-full px-2 py-0.5 text-[10px]"></span></button>
      </div>

      <div class="flex flex-wrap items-end gap-3 text-xs">
        <div><label class="lbl">Competência</label><input id="fMes" type="month" class="inp !py-1.5 font-mono" onchange="carregar()"></div>
        <div class="flex-1 min-w-[160px]"><label class="lbl">Buscar nome</label><input id="fNome" oninput="render()" class="inp !py-1.5" placeholder="nome do funcionário"></div>
      </div>

      <div id="boxRascunho" style="display:none"></div>
      <div id="pLanc" class="space-y-3">
        <div id="resumo" class="flex flex-wrap gap-x-5 gap-y-1 text-[11px] text-slate-600 bg-white rounded-lg px-3 py-2"></div>
        <div id="blocos" class="space-y-4"></div>
        <div class="sticky bottom-0 bg-white/95 rounded-lg px-3 py-2 flex flex-wrap items-center gap-3 shadow-sm">
          <span id="lblConfirma" class="text-[12px] font-bold text-slate-700 flex-1"></span>
          <button id="btnConfirmar" onclick="confirmar()" class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-2 px-5 rounded-lg text-xs uppercase tracking-wider cursor-pointer">✓ Confirmar planos</button>
        </div>
      </div>

      <div id="pApr" class="hidden space-y-3">
        <div id="aprInfo" class="text-[12px] text-slate-600"></div>
        <div id="aprLista" class="space-y-2"></div>
        <div id="aprHist" class="space-y-1"></div>
      </div>
    </div>
  </div>

  <style>
    .lbl { display: block; font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 3px; }
    .inp { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 12px; }
    .val { width: 96px; text-align: right; font-family: ui-monospace, monospace; }
    .aba { color: #64748b; } .aba.on { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; border-bottom-color: #fff; margin-bottom: -1px; }
    .grade thead th { position: sticky; top: 0; background: #fff; z-index: 2; padding-top: 6px; padding-bottom: 6px; }
    .grade tr.lin td { border-bottom: 1px solid #f1f5f9; }
    tr.tirado td { color: #94a3b8; }
  </style>

  <script>
    const _supabase = window.supabase.createClient('https://jmetpmdnaxwabeccimgg.supabase.co', 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k');
    const $ = id => document.getElementById(id);
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const num = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const r2 = v => Math.round(Number(v || 0) * 100) / 100;
    const dh = v => v ? new Date(v).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
    const lerNum = t => { t = String(t ?? '').trim(); if (!t) return 0; t = t.replace(/\s|R\$/g, ''); if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return isNaN(n) ? NaN : r2(n); };

    // evento de cada plano: contábil / não contábil (SQL CA)
    const PLANOS = [
      { k: 'ODONTO', nome: 'Odontológico', cor: 'sky', ev: { CONTABIL: 3000, NAO_CONTABIL: 2033 }, padrao: 'CONTABIL' },
      { k: 'SAUDE', nome: 'Plano de saúde', cor: 'emerald', ev: { CONTABIL: 3041, NAO_CONTABIL: 3012 }, padrao: 'NAO_CONTABIL' },
      { k: 'MOGI', nome: 'Mogi Care', cor: 'violet', ev: { CONTABIL: 3025, NAO_CONTABIL: 3042 }, padrao: 'CONTABIL' }
    ];
    const NAT = { CONTABIL: 'Contábil', NAO_CONTABIL: 'Não contábil' };

    let perfil = null, lista = [], ed = {}, aba = 'lanc', funcionarios = [];
    const comp = () => { const [a, m] = $('fMes').value.split('-'); return `${m}/${a}`; };
    const chave = f => `${f.funcionario_id}|${f.plano}`;

    async function inicializar() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) { location.href = 'login.html'; return; }
      const { data: u } = await rpcRetentar(_supabase, 'fn_meu_usuario');
      perfil = u ? u.perfil : null;
      $('lblUsuario').innerText = (user.email || '').toLowerCase(); $('lblPerfil').innerText = perfil || 'SEM PERFIL';
      if (!['RH', 'GESTOR'].includes(perfil)) { $('aviso').innerText = perfil ? 'Seu perfil não tem acesso a esta tela.' : 'Não foi possível conferir o seu acesso agora (internet lenta ou instável). Recarregue a página; se continuar, avise o administrador.'; $('aviso').classList.remove('hidden'); return; }
      const d = new Date();
      $('fMes').value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      aba = new URLSearchParams(location.search).get('aba') === 'aprovacao' ? 'aprovacao' : 'lanc';
      if (aba === 'aprovacao') {
        const { data: p } = await _supabase.rpc('fn_plano_pendentes');
        const c = p && p[0] && p[0].mes; if (c) { const [m, a] = c.split('/'); $('fMes').value = `${a}-${m}`; }
      }
      const { data: fs } = await _supabase.from('funcionarios').select('id, nome_registro, status').order('nome_registro');
      funcionarios = (fs || []).filter(f => String(f.status || 'ATIVO').toUpperCase() === 'ATIVO');
      $('conteudo').classList.remove('hidden');
      await carregar();
    }

    async function carregar() {
      const { data, error } = await _supabase.rpc('fn_planos_lista', { p_comp: comp() });
      if (error) { $('aviso').innerText = 'Não foi possível carregar. Recarregue a página; se continuar, avise o administrador. Detalhe: ' + traduzirErro(error.message); $('aviso').classList.remove('hidden'); return; }
      $('aviso').classList.add('hidden');
      lista = (data || []).map(f => ({ ...f, novo: false }));
      ed = {};
      lista.forEach(f => {
        f.fora = !f.reg_id && Number(f.lanc_valor) > 0;   // lançado no mês antes da tela
        // valor do mês: o gravado na tela; se não, o já lançado; se não, repete o mês anterior
        const b = f.reg_id ? { v: r2(f.valor), n: f.natureza }
          : f.fora ? { v: r2(f.lanc_valor), n: f.lanc_natureza }
          : { v: r2(f.ant_valor), n: f.ant_natureza };
        const p = PLANOS.find(x => x.k === f.plano);
        ed[chave(f)] = { v: b.v, n: b.n || p.padrao, motivo: f.reg_id && f.status !== 'LANCADO' ? (f.motivo || '') : '' };
      });
      // rascunho guardado neste computador (regra de 28/10/2026)
      const rasc = Rascunho.ler(chaveRasc()); let nR = 0;
      if (rasc && rasc.itens) Object.entries(rasc.itens).forEach(([k, r]) => {
        let f = lista.find(x => chave(x) === k);
        if (!f && r.novo) { f = { funcionario_id: r.funcionario_id, nome: r.nome, plano: r.plano, ant_valor: 0, ant_natureza: null, lanc_valor: 0, novo: true, status_func: 'ATIVO' }; lista.push(f); }
        if (!f || f.status === 'AGUARDANDO_GESTOR' || (f.reg_id && f.status === 'LANCADO' && !r.novo && r2(f.valor) === r2(r.v))) return;
        ed[chave(f)] = { v: r.v, n: r.n, motivo: r.motivo || '' }; nR++; });
      Rascunho.faixa($('boxRascunho'), nR, rasc && rasc.em, 'descartarRasc()');
      trocarAba(aba);
    }

    function trocarAba(a) {
      aba = a;
      $('tabLanc').classList.toggle('on', a === 'lanc'); $('tabApr').classList.toggle('on', a === 'aprovacao');
      $('pLanc').classList.toggle('hidden', a !== 'lanc'); $('pApr').classList.toggle('hidden', a !== 'aprovacao');
      const q = lista.filter(f => f.status === 'AGUARDANDO_GESTOR').length;
      $('qtdApr').innerText = q; $('qtdApr').classList.toggle('hidden', !q); $('qtdApr').classList.toggle('bg-red-600', perfil === 'GESTOR'); $('qtdApr').classList.toggle('bg-slate-400', perfil !== 'GESTOR');   // para o RH é só informativo: quem aprova é o Gestor
      if (a === 'lanc') render(); else renderAprovacao();
    }

    // ------------------------------------------------------------------ regras
    // mudou em relação ao mês anterior (valor, natureza ou tirou) → justificativa + Gestor; incluir é livre
    const difere = f => { const e = ed[chave(f)]; return Number(f.ant_valor) > 0 && (r2(e.v) !== r2(f.ant_valor) || e.n !== f.ant_natureza); };
    const mudou = f => { const e = ed[chave(f)];
      if (!f.reg_id) return true;
      return r2(e.v) !== r2(f.valor) || e.n !== f.natureza || f.status === 'RECUSADO'; };

    function situacao(f) {
      if (f.novo) return '<span class="px-2 py-0.5 rounded bg-sky-100 text-sky-800 font-bold">+ inclusão</span>';
      if (f.fora) return '<span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-bold" title="Ao confirmar, a tela assume este lançamento">Lançado antes da tela</span>';
      const s = { LANCADO: '<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">✓ Lançado</span>',
        SEM_DESCONTO: '<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-bold">Sem desconto</span>',
        AGUARDANDO_GESTOR: '<span class="px-2 py-0.5 rounded bg-red-100 text-red-700 font-bold">⏳ Aguardando Gestor</span>',
        RECUSADO: `<span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800 font-bold">✕ Recusado pelo Gestor</span>${f.gestor_obs ? `<div class="text-[10px] text-rose-700 mt-0.5">${esc(f.gestor_obs)}</div>` : ''}` }[f.status];
      return s || '<span class="text-slate-400">a confirmar</span>';
    }
    const badgeNat = n => n ? `<span class="text-[9px] font-bold px-1 rounded ${n === 'NAO_CONTABIL' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-500'}">${NAT[n]}</span>` : '';

    function render() {
      const fn = $('fNome').value.trim().toUpperCase();
      $('blocos').innerHTML = PLANOS.map(p => {
        const itens = lista.filter(f => f.plano === p.k && (!fn || String(f.nome).toUpperCase().includes(fn)));
        const totAnt = lista.filter(f => f.plano === p.k).reduce((s, f) => s + Number(f.ant_valor || 0), 0);
        const totAgora = lista.filter(f => f.plano === p.k).reduce((s, f) => s + Number(ed[chave(f)].v || 0), 0);
        const linhas = itens.map(f => {
          const e = ed[chave(f)], k = chave(f), dif = difere(f), tirou = Number(f.ant_valor) > 0 && !(e.v > 0);
          const ev = p.ev[e.n];
          let obs = '';
          if (dif) obs = `<div class="text-[10px] font-bold text-red-700 mb-0.5">${tirou ? 'Tirou o desconto' : `${e.n !== f.ant_natureza ? 'Mudou para ' + NAT[e.n] + ' · ' : ''}${r2(e.v) !== r2(f.ant_valor) ? (e.v - f.ant_valor > 0 ? '+' : '') + brl(e.v - f.ant_valor) + ' vs mês anterior' : ''}`} → ${perfil === 'GESTOR' ? 'você é Gestor: lança direto' : 'Gestor'}</div>`
            + `<input class="inp !py-1 text-[11px]" placeholder="Justificativa * (mínimo 10 letras)" value="${esc(e.motivo)}" oninput="ed['${k}'].motivo=this.value; salvarRasc(); resumo()">`;
          else if (!Number(f.ant_valor) && e.v > 0) obs = '<span class="text-[10px] font-bold text-sky-700">Inclusão: lança direto</span>';
          return `<tr class="lin ${tirou ? 'tirado' : ''} ${dif ? 'bg-red-50/40' : ''}">
            <td class="px-3 py-1.5"><div class="font-bold ${tirou ? 'line-through' : 'text-slate-900'}">${esc(f.nome)}</div><div class="text-[10px] text-slate-500">${esc(f.nome_loja || '')}${f.cargo ? ' · ' + esc(f.cargo) : ''}${String(f.status_func || 'ATIVO').toUpperCase() !== 'ATIVO' ? ' · <b class="text-rose-600">' + esc(f.status_func) + '</b>' : ''}</div></td>
            <td class="px-2 py-1.5 text-right font-mono text-[11px] text-slate-600 bg-slate-50 whitespace-nowrap">${Number(f.ant_valor) > 0 ? num(f.ant_valor) + ' ' + badgeNat(f.ant_natureza) : '<span class="text-slate-300">-</span>'}</td>
            <td class="px-2 py-1.5 whitespace-nowrap">
              <select class="inp !py-1 !w-auto text-[11px] ${e.n === 'NAO_CONTABIL' ? '!bg-amber-50' : ''}" onchange="ed['${k}'].n=this.value; salvarRasc(); render()">
                <option value="CONTABIL" ${e.n === 'CONTABIL' ? 'selected' : ''}>Contábil · ${p.ev.CONTABIL}</option>
                <option value="NAO_CONTABIL" ${e.n === 'NAO_CONTABIL' ? 'selected' : ''}>Não contábil · ${p.ev.NAO_CONTABIL}</option></select></td>
            <td class="px-2 py-1.5 whitespace-nowrap"><input class="inp val !py-1" value="${e.v > 0 ? num(e.v) : ''}" placeholder="0,00" onchange="setVal('${k}', this)">
              ${e.v > 0 ? `<button onclick="setZero('${k}')" class="ml-1 text-[10px] font-bold text-rose-600 hover:underline cursor-pointer" title="Tirar o desconto deste mês">tirar</button>`
                : Number(f.ant_valor) > 0 ? `<button onclick="repetir('${k}')" class="ml-1 text-[10px] font-bold text-sky-700 hover:underline cursor-pointer">↺ repetir</button>` : ''}</td>
            <td class="px-2 py-1.5 w-[280px]">${obs}</td>
            <td class="px-3 py-1.5">${situacao(f)}${f.gestor_por && f.status === 'LANCADO' && f.gestor_obs !== 'Lançado pelo Gestor' ? `<div class="text-[10px] text-slate-400 mt-0.5">aprovado por ${esc(f.gestor_por)}</div>` : ''}</td></tr>`;
        }).join('');
        const opcoes = funcionarios.filter(fu => !lista.some(f => f.plano === p.k && f.funcionario_id === fu.id)).map(fu => `<option value="${fu.id}">${esc(fu.nome_registro)}</option>`).join('');
        return `<div class="bg-white rounded-xl overflow-hidden border-t-4 border-${p.cor}-500">
          <div class="flex flex-wrap items-center gap-3 px-3 py-2 bg-${p.cor}-50">
            <h2 class="font-black text-sm text-slate-900 flex-1">${p.nome} <span class="text-[10px] font-normal text-slate-500">· eventos ${p.ev.CONTABIL} contábil / ${p.ev.NAO_CONTABIL} não contábil</span></h2>
            <span class="text-[11px] text-slate-600">Mês anterior <b>${brl(totAnt)}</b> · Este mês <b class="${r2(totAgora) !== r2(totAnt) ? 'text-red-700' : 'text-emerald-700'}">${brl(totAgora)}</b></span>
            <select class="inp !py-1 !w-auto text-[11px]" onchange="incluir('${p.k}', this.value); this.value=''"><option value="">+ incluir pessoa…</option>${opcoes}</select>
          </div>
          <div class="overflow-auto grade" style="max-height: 60vh"><table class="w-full text-xs">
            <thead class="text-[10px] uppercase text-slate-500 text-left"><tr>
              <th class="px-3">Funcionário</th><th class="px-2 text-right bg-slate-100">Mês anterior</th><th class="px-2">Contábil / não contábil</th><th class="px-2">Valor este mês</th><th class="px-2">Observação</th><th class="px-3">Situação</th></tr></thead>
            <tbody>${linhas || '<tr><td colspan="6" class="p-5 text-center text-slate-400">Ninguém com este plano.</td></tr>'}</tbody></table></div></div>`;
      }).join('');
      resumo();
    }

    const chaveRasc = () => 'drogarema_planos_rascunho_' + comp();
    let tRasc = null;
    function salvarRasc() { clearTimeout(tRasc); tRasc = setTimeout(() => {
      const itens = {}; lista.forEach(f => { if (f.status === 'AGUARDANDO_GESTOR' || !mudou(f)) return; const e = ed[chave(f)];
        itens[chave(f)] = { v: e.v, n: e.n, motivo: e.motivo, novo: !!f.novo, funcionario_id: f.funcionario_id, plano: f.plano, nome: f.nome }; });
      Rascunho.gravar(chaveRasc(), itens); const r = Rascunho.ler(chaveRasc()); Rascunho.faixa($('boxRascunho'), Object.keys(itens).length, r && r.em, 'descartarRasc()'); }, 300); }
    async function descartarRasc() { if (!confirm('Descartar tudo o que foi digitado e não confirmado nesta competência?')) return; Rascunho.apagar(chaveRasc()); await carregar(); }
    function setVal(k, el) {
      const n = lerNum(el.value);
      if (isNaN(n) || n < 0) { alert('Valor inválido. Informe o valor do desconto (ex.: 25,71). Para tirar o desconto, use "tirar".'); render(); return; }
      ed[k].v = n; salvarRasc(); render();
    }
    function setZero(k) { ed[k].v = 0; salvarRasc(); render(); }
    function repetir(k) { const f = lista.find(x => chave(x) === k); ed[k].v = r2(f.ant_valor); ed[k].n = f.ant_natureza || ed[k].n; salvarRasc(); render(); }
    function incluir(plano, id) {
      if (!id) return;
      const fu = funcionarios.find(x => x.id === id), p = PLANOS.find(x => x.k === plano);
      const f = { funcionario_id: id, nome: fu.nome_registro, plano, ant_valor: 0, ant_natureza: null, lanc_valor: 0, novo: true, status_func: 'ATIVO' };
      lista.push(f); ed[chave(f)] = { v: 0, n: p.padrao, motivo: '' };
      salvarRasc(); render();
      setTimeout(() => { const ins = [...document.querySelectorAll('.val')].find(i => i.closest('tr').innerHTML.includes(esc(fu.nome_registro))); if (ins) ins.focus(); }, 50);
    }

    function pendentes() { return lista.filter(f => f.status !== 'AGUARDANDO_GESTOR' && mudou(f) && !(f.novo && !(ed[chave(f)].v > 0)) && !(!f.reg_id && !Number(f.ant_valor) && !(ed[chave(f)].v > 0))); }

    const semMotivoP = f => perfil !== 'GESTOR' && difere(f) && String(ed[chave(f)].motivo || '').trim().length < 10;
    function resumo() {
      const pend = pendentes(), difs = pend.filter(f => difere(f));
      const it = (t, v, c = 'text-slate-900') => `<span>${t} <b class="${c}">${v}</b></span>`;
      const totAnt = lista.reduce((s, f) => s + Number(f.ant_valor || 0), 0), totAgora = lista.reduce((s, f) => s + Number(ed[chave(f)].v || 0), 0);
      const aguard = lista.filter(f => f.status === 'AGUARDANDO_GESTOR').length;
      $('resumo').innerHTML = it('Com plano este mês', lista.filter(f => ed[chave(f)].v > 0).length) + it('Total este mês', brl(totAgora), 'text-emerald-700')
        + it('Mês anterior', brl(totAnt), 'text-slate-500') + it('Diferença', brl(totAgora - totAnt), r2(totAgora) !== r2(totAnt) ? 'text-red-600' : 'text-slate-400')
        + it('Mudanças para o Gestor', difs.length, difs.length ? 'text-red-600' : 'text-slate-400') + it('Aguardando Gestor', aguard, aguard ? 'text-red-600' : 'text-slate-400');
      const prontos = pend.filter(f => !semMotivoP(f)), semMot = pend.filter(semMotivoP), dp = prontos.filter(difere).length;
      const nomes = ls => ls.slice(0, 4).map(f => String(f.nome).split(' ').slice(0, 2).join(' ')).join(', ') + (ls.length > 4 ? ` e mais ${ls.length - 4}` : '');
      $('lblConfirma').innerHTML = (prontos.length ? `<span class="text-emerald-700">${prontos.length} item(ns) pronto(s) · ${prontos.length - dp} lançam direto${dp ? ` · ${dp} ${perfil === 'GESTOR' ? 'com mudança (você é Gestor: lança direto)' : 'vão para o Gestor aprovar'}` : ''}.</span>` : pend.length ? '' : 'Nada a confirmar: tudo já está lançado.')
        + (semMot.length ? ` <span class="text-amber-700">Ficam para depois: ${semMot.length} sem justificativa de 10 letras (${nomes(semMot)}).</span>` : '');
      $('btnConfirmar').disabled = !prontos.length;
      $('btnConfirmar').innerText = prontos.length ? `✓ Confirmar ${prontos.length} item(ns)` : '✓ Confirmar planos';
    }

    async function confirmar() {
      const todos = pendentes(), pend = todos.filter(f => !semMotivoP(f));
      if (!pend.length) return alert('Nenhum item completo para confirmar: falta a justificativa (mínimo 10 letras) de quem mudou em relação ao mês anterior.');
      if (!confirm(`Confirmar ${pend.length} item(ns) dos planos de ${comp()}?${todos.length > pend.length ? `\n\n${todos.length - pend.length} ficam para depois (sem justificativa): o que foi digitado continua guardado.` : ''}`)) return;
      const itens = pend.map(f => { const e = ed[chave(f)]; return { funcionario_id: f.funcionario_id, plano: f.plano, valor: e.v || 0, natureza: e.n, motivo: (e.motivo || '').trim() || null }; });
      const b = $('btnConfirmar'); b.disabled = true; b.innerText = 'Gravando...';
      const { data, error } = await _supabase.rpc('fn_planos_confirmar', { p_comp: comp(), p_itens: itens });
      b.innerText = '✓ Confirmar planos';
      if (error) { b.disabled = false; return alert('Não foi gravado: ' + error.message); }
      const comErro = new Set((data.erros || []).map(x => x.nome));
      Rascunho.tirar(chaveRasc(), pend.filter(f => !comErro.has(f.nome)).map(chave));
      let msg = `Lançados: ${data.lancados}\nAguardando o Gestor: ${data.aguardando_gestor}`;
      if ((data.erros || []).length) msg += '\n\nNão gravados:\n' + data.erros.map(x => `• ${x.nome}: ${x.erro}`).join('\n');
      alert(msg);
      await carregar();
    }

    // ------------------------------------------------------------------ aprovação do Gestor
    function renderAprovacao() {
      const pend = lista.filter(f => f.status === 'AGUARDANDO_GESTOR');
      const g = perfil === 'GESTOR';
      $('aprInfo').innerHTML = pend.length
        ? `<div class="bg-red-50 border border-red-300 text-red-800 rounded-xl p-3 font-bold flex flex-wrap items-center gap-3"><span class="flex-1">⚠️ ${pend.length} plano(s) de ${comp()} mudaram em relação ao mês anterior. O desconto só muda na folha depois da aprovação.</span>
           ${g ? `<button onclick="aprovarTodos()" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-4 py-2 text-xs cursor-pointer">✓ Aprovar todos (${pend.length})</button>` : '<span class="text-[11px] font-normal">Só o Gestor aprova.</span>'}</div>`
        : `<div class="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-3 font-bold">✓ Nenhum plano aguardando aprovação em ${comp()}.</div>`;
      $('aprLista').innerHTML = pend.map(f => {
        const p = PLANOS.find(x => x.k === f.plano), d = Number(f.valor) - Number(f.ant_valor);
        return `<div class="bg-white border border-slate-200 rounded-xl p-3 text-xs flex flex-wrap gap-4 items-center">
          <div class="min-w-[220px] flex-1"><div class="font-bold text-slate-900 text-sm">${esc(f.nome)} <span class="text-[10px] font-bold text-${p.cor}-700">· ${p.nome}</span></div><div class="text-[10px] text-slate-500">${esc(f.nome_loja || '')}${f.cargo ? ' · ' + esc(f.cargo) : ''}</div>
            <div class="mt-1 text-[11px] text-slate-700"><b>Justificativa do RH:</b> ${esc(f.motivo || '-')}</div><div class="text-[10px] text-slate-400">${esc(f.enviado_por || '')} · ${dh(f.enviado_em)}</div></div>
          <table class="text-[11px] font-mono"><tr class="text-[9px] uppercase text-slate-400 font-sans"><td class="px-2 text-right">mês anterior</td><td class="px-2 text-right">agora</td></tr>
            <tr><td class="px-2 text-right">${num(f.ant_valor)} ${badgeNat(f.ant_natureza)}</td><td class="px-2 text-right font-bold">${Number(f.valor) > 0 ? num(f.valor) + ' ' + badgeNat(f.natureza) : '<span class="text-rose-700">sem desconto</span>'}</td></tr></table>
          <div class="text-center min-w-[90px]"><div class="text-[9px] uppercase text-slate-400">diferença</div><div class="text-base font-black ${d < 0 ? 'text-red-600' : 'text-slate-700'}">${d > 0 ? '+' : ''}${brl(d)}</div>${Number(f.valor) === 0 ? '<div class="text-[10px] font-bold text-red-600">tira o desconto</div>' : ''}</div>
          ${g ? `<div class="flex flex-col gap-1.5 min-w-[200px]">
            <button onclick="decidir('${f.reg_id}', true)" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-3 py-2 font-bold cursor-pointer">✓ Aprovar</button>
            <div class="flex gap-1"><input id="rec_${f.reg_id}" class="inp !py-1 text-[11px]" placeholder="motivo da recusa"><button onclick="decidir('${f.reg_id}', false)" class="bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg px-3 font-bold cursor-pointer">Recusar</button></div></div>` : ''}
        </div>`; }).join('');
      const dec = lista.filter(f => f.gestor_em && f.status !== 'AGUARDANDO_GESTOR' && f.gestor_obs !== 'Lançado pelo Gestor').sort((a, b) => String(b.gestor_em).localeCompare(String(a.gestor_em)));
      $('aprHist').innerHTML = dec.length ? `<div class="text-[10px] font-bold uppercase text-slate-500 mt-3">Decididos em ${comp()}</div>` + dec.map(f =>
        `<div class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-[11px] flex gap-3"><b class="flex-1">${esc(f.nome)} · ${PLANOS.find(p => p.k === f.plano).nome}</b><span>${brl(f.valor)}</span>
          <span class="${f.status === 'RECUSADO' ? 'text-rose-700' : 'text-emerald-700'} font-bold">${f.status === 'RECUSADO' ? '✕ recusado' : '✓ aprovado'}</span><span class="text-slate-400">${esc(f.gestor_por || '')} · ${dh(f.gestor_em)}</span></div>`).join('') : '';
    }

    async function decidir(id, aprovar) {
      const obs = aprovar ? null : ($('rec_' + id).value || '').trim();
      if (!aprovar && obs.length < 5) return alert('Escreva o motivo da recusa (mínimo 5 letras).');
      const { error } = await _supabase.rpc('fn_plano_decidir', { p_id: id, p_aprovar: aprovar, p_obs: obs });
      if (error) return alert(error.message);
      await carregar();
    }
    async function aprovarTodos() {
      const pend = lista.filter(f => f.status === 'AGUARDANDO_GESTOR');
      if (!confirm(`Aprovar as ${pend.length} mudança(s) de plano?`)) return;
      const falhas = [];
      for (const f of pend) { const { error } = await _supabase.rpc('fn_plano_decidir', { p_id: f.reg_id, p_aprovar: true, p_obs: null }); if (error) falhas.push(`${f.nome}: ${error.message}`); }
      if (falhas.length) alert('Não aprovados:\n' + falhas.join('\n'));
      await carregar();
    }

    inicializar();
  </script>
</body>
</html>
