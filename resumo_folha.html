  <script>
    const SUPABASE_URL = 'https://jmetpmdnaxwabeccimgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // O Supabase devolve no máximo 1000 linhas por consulta: busca em páginas até trazer tudo.
    async function buscarTudo(montar) {
      const tudo = [];
      for (let de = 0; ; de += 1000) {
        const { data, error } = await montar().order('id').range(de, de + 999);
        if (error) return { data: null, error };
        tudo.push(...(data || []));
        if (!data || data.length < 1000) break;
      }
      return { data: tudo, error: null };
    }

    let competenciaAtivaTexto = localStorage.getItem('competencia_ativa') || 'AGOSTO / 2026';
    let competenciaRegra = '';
    
    let glob_colunas = { cc: [], cd: [], ncc: [], ncd: [] };
    let glob_dadosFunc = [];
    let glob_grandTotals = { cc: {}, cd: {}, ncc: {}, ncd: {}, tot_cc: 0, tot_cd: 0, tot_ncc: 0, tot_ncd: 0 };
    
    // Agora o objeto valoresDinheiro espelhará os dados reais do banco
    let valoresDinheiro = {};

    function converterCompetenciaParaMMYYYY(texto) {
      const mesesMap = {
        'JANEIRO': '01', 'FEVEREIRO': '02', 'MARÇO': '03', 'MARCO': '03',
        'ABRIL': '04', 'MAIO': '05', 'JUNHO': '06', 'JULHO': '07',
        'AGOSTO': '08', 'SETEMBRO': '09', 'OUTUBRO': '10', 'NOVEMBRO': '11', 'DEZEMBRO': '12'
      };
      const partes = texto.split('/');
      if (partes.length >= 2) {
        const mesNome = partes[0].trim().toUpperCase();
        const ano = partes[1].trim();
        const mesNum = mesesMap[mesNome] || '08';
        return `${mesNum}/${ano}`;
      }
      return '08/2026';
    }

    function formatarMoeda(valor) {
      if (!valor || parseFloat(valor) === 0) return '<span class="text-slate-300">-</span>';
      return parseFloat(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatarMoedaSimples(valor) {
      return parseFloat(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function initTotals() {
      return { cc: {}, cd: {}, ncc: {}, ncd: {}, tot_cc: 0, tot_cd: 0, tot_ncc: 0, tot_ncd: 0 };
    }

    function accumulate(totObj, f) {
      glob_colunas.cc.forEach(c => totObj.cc[c] = (totObj.cc[c] || 0) + (f.cc[c] || 0));
      totObj.tot_cc += f.tot_cc;
      
      glob_colunas.cd.forEach(c => totObj.cd[c] = (totObj.cd[c] || 0) + (f.cd[c] || 0));
      totObj.tot_cd += f.tot_cd;
      
      glob_colunas.ncc.forEach(c => totObj.ncc[c] = (totObj.ncc[c] || 0) + (f.ncc[c] || 0));
      totObj.tot_ncc += f.tot_ncc;
      
      glob_colunas.ncd.forEach(c => totObj.ncd[c] = (totObj.ncd[c] || 0) + (f.ncd[c] || 0));
      totObj.tot_ncd += f.tot_ncd;
    }

    async function processarDadosBanco() {
      competenciaRegra = converterCompetenciaParaMMYYYY(competenciaAtivaTexto);
      document.getElementById('labelCompetencia').innerText = competenciaRegra;

      try {
        // Nova consulta: Busca pagamentos_dinheiro filtrados pela competência atual
        const [resFunc, resFolha, resEventos, resLojas, resEmpresas, resPgtoDinheiro] = await Promise.all([
          _supabase.from('funcionarios').select('*'),
          buscarTudo(() => _supabase.from('folha_itens').select('*').eq('competencia', competenciaRegra)),
          _supabase.from('tipos_eventos').select('*'),
          _supabase.from('lojas').select('*'),
          _supabase.from('empresas').select('*'),
          _supabase.from('pagamentos_dinheiro').select('*').eq('competencia', competenciaRegra)
        ]);

        const funcionarios = resFunc.data || [];
        const itensFolha = resFolha.data || [];
        const eventos = resEventos.data || [];
        const lojas = resLojas.data || [];
        const empresas = resEmpresas.data || [];
        const pagamentosDb = resPgtoDinheiro.data || [];

        // Inicializa o objeto com os dados permanentes vindos do banco
        valoresDinheiro = {};
        pagamentosDb.forEach(pd => {
          valoresDinheiro[pd.funcionario_id] = parseFloat(pd.valor || 0);
        });

        const mapaEventos = {};
        eventos.forEach(e => {
          mapaEventos[String(e.codigo_evento)] = e.natureza_do_evento || 'CONTABIL';
          mapaEventos[String(e.descricao_do_evento || '').toUpperCase()] = e.natureza_do_evento || 'CONTABIL';
        });

        const colunasSet = { cc: new Set(), cd: new Set(), ncc: new Set(), ncd: new Set() };
        const dadosFuncMap = {};

        // 13º, férias, rescisão e VT são pagos FORA do holerite: não entram neste cálculo
        const codigosForaHolerite = new Set(eventos.filter(e => e.pagamento_extra_tipo && e.pagamento_extra_tipo !== 'ADIANTAMENTO').map(e => String(e.codigo_evento)));
        const foraDoHolerite = it => codigosForaHolerite.has((String(it.rubrica || '').match(/^\s*(\d+)/) || [])[1]);
        itensFolha.forEach(item => {
          if (foraDoHolerite(item)) return;
          const fId = item.funcionario_id;
          
          if (!dadosFuncMap[fId]) {
            const f = funcionarios.find(x => String(x.id) === String(fId));
            if (!f) return;

            let nomeLoja = f.loja_trabalha || '-';
            const numLojaStr = String(f.loja_trabalha).trim();
            const lojaEncontrada = lojas.find(l => {
              const lNome = String(l.nome_loja || l.loja || '').trim();
              return lNome.includes(numLojaStr) || lNome.endsWith(numLojaStr);
            });
            if (lojaEncontrada) nomeLoja = lojaEncontrada.nome_loja || lojaEncontrada.loja;

            let empresaMatch = null;
            if (f.empresa_id) {
              empresaMatch = empresas.find(e => String(e.id) === String(f.empresa_id));
            }
            if (!empresaMatch && f.cnpj) {
              const funcCnpjNum = String(f.cnpj).replace(/\D/g, '');
              empresaMatch = empresas.find(e => (e.cnpj || '').replace(/\D/g, '') === funcCnpjNum);
            }
            if (!empresaMatch && f.empresa_registro) {
              empresaMatch = empresas.find(e => e.cnpj && f.empresa_registro.includes(e.cnpj));
            }
            if (!empresaMatch && f.empresa_registro) {
              empresaMatch = empresas.find(e => f.empresa_registro.includes(e.razao_social));
            }

            let nomeEmpresa = f.empresa_registro || '-';
            if (empresaMatch) {
              nomeEmpresa = empresaMatch.nome_fantasia || empresaMatch.razao_social || nomeEmpresa;
            }

            dadosFuncMap[fId] = {
              id: f.id,
              nome: f.nome_registro,
              loja: nomeLoja.toUpperCase(),
              empresa: nomeEmpresa.toUpperCase(),
              cc: {}, cd: {}, ncc: {}, ncd: {},
              tot_cc: 0, tot_cd: 0, tot_ncc: 0, tot_ncd: 0
            };
          }

          const val = parseFloat(item.valor || 0);
          const rubrica = String(item.rubrica || '').toUpperCase();
          const tipo = (item.tipo || 'PROVENTO').toUpperCase();
          
          let natureza = 'CONTABIL';
          for (let key in mapaEventos) {
            if (rubrica.includes(key)) {
              natureza = mapaEventos[key];
              break;
            }
          }
          if (natureza === 'NAO_CONTABIL' || rubrica.includes('FORA')) natureza = 'NAO_CONTABIL';

          let cat = '';
          if (tipo === 'PROVENTO' && natureza === 'CONTABIL') cat = 'cc';
          else if (tipo === 'DESCONTO' && natureza === 'CONTABIL') cat = 'cd';
          else if (tipo === 'PROVENTO' && natureza === 'NAO_CONTABIL') cat = 'ncc';
          else if (tipo === 'DESCONTO' && natureza === 'NAO_CONTABIL') cat = 'ncd';

          if (cat) {
            colunasSet[cat].add(rubrica);
            if (!dadosFuncMap[fId][cat][rubrica]) dadosFuncMap[fId][cat][rubrica] = 0;
            dadosFuncMap[fId][cat][rubrica] += val;
            dadosFuncMap[fId]['tot_'+cat] += val;
          }
        });

        if (Object.keys(dadosFuncMap).length === 0) {
          document.getElementById('tabelaCorpo').innerHTML = `<tr><td class="p-8 text-center text-slate-400">Nenhum lançamento processado para ${competenciaRegra}.</td></tr>`;
          document.getElementById('tabelaCabecalho').innerHTML = '';
          return;
        }

        glob_colunas = {
          cc: Array.from(colunasSet.cc).sort(),
          cd: Array.from(colunasSet.cd).sort(),
          ncc: Array.from(colunasSet.ncc).sort(),
          ncd: Array.from(colunasSet.ncd).sort()
        };

        glob_dadosFunc = Object.values(dadosFuncMap);
        glob_grandTotals = initTotals();
        glob_dadosFunc.forEach(f => accumulate(glob_grandTotals, f));

        renderizarCabecalho();
        renderizarTabelaCorpo();
        carregarEnvio();

      } catch (err) {
        console.error(err);
        document.getElementById('tabelaCorpo').innerHTML = `<tr><td class="p-8 text-center text-rose-600 font-bold">Erro crítico: ${err.message}</td></tr>`;
      }
    }

    function renderizarCabecalho() {
      let tr1 = `<tr class="text-[9px] uppercase tracking-wider text-slate-500">`;
      let tr2 = `<tr class="text-[9px] uppercase tracking-wider text-slate-500 border-b border-slate-300">`;
      let tr3 = `<tr class="text-[10px] bg-slate-100 font-bold text-slate-800 border-b-2 border-slate-300 shadow-sm">`;

      const styC1 = `sticky z-canto bg-slate-50 border-r border-slate-200 shadow-fixa align-bottom`; 
      const widthC1 = `left: 0; min-width: 180px; max-width: 180px;`;
      const styC2 = `sticky z-canto bg-slate-50 border-r border-slate-200 shadow-fixa align-bottom`; 
      const widthC2 = `left: 180px; min-width: 120px; max-width: 120px;`;
      const styC3 = `sticky z-canto bg-slate-50 border-r border-slate-300 shadow-fixa align-bottom`; 
      const widthC3 = `left: 300px; min-width: 120px; max-width: 120px;`;

      tr1 += `<th class="${styC1} py-2 px-3" style="${widthC1}" rowspan="2">Colaborador</th>`;
      tr1 += `<th class="${styC2} py-2 px-3" style="${widthC2}" rowspan="2">Empresa</th>`;
      tr1 += `<th class="${styC3} py-2 px-3" style="${widthC3}" rowspan="2">Loja</th>`;

      tr3 += `<th class="py-2 px-3 sticky z-canto bg-slate-200 border-r border-slate-300 shadow-fixa" style="${widthC1}">TOTAL GERAL</th>`;
      tr3 += `<th class="py-2 px-3 sticky z-canto bg-slate-200 border-r border-slate-300 shadow-fixa" style="${widthC2}">-</th>`;
      tr3 += `<th class="py-2 px-3 sticky z-canto bg-slate-200 border-r border-slate-400 shadow-fixa" style="${widthC3}">-</th>`;

      if (glob_colunas.cc.length > 0) {
        tr1 += `<th class="py-2 px-2 text-center font-bold text-emerald-700 bg-emerald-50/80 border-b border-emerald-100" colspan="${glob_colunas.cc.length}">Proventos Contábeis (+)</th>`;
        glob_colunas.cc.forEach(c => {
          tr2 += `<th class="py-1 px-3 text-right bg-emerald-50/50 font-medium">${c}</th>`;
          tr3 += `<th class="py-2 px-3 text-right text-emerald-800 bg-emerald-100/50">${formatarMoeda(glob_grandTotals.cc[c])}</th>`;
        });
      }
      tr1 += `<th class="py-2 px-3 text-right font-black text-emerald-800 bg-emerald-100/80 border-l border-emerald-200 align-bottom" rowspan="2">Subt. Créd.</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-emerald-900 bg-emerald-200 border-l border-emerald-300">${formatarMoeda(glob_grandTotals.tot_cc)}</th>`;

      if (glob_colunas.cd.length > 0) {
        tr1 += `<th class="py-2 px-2 text-center font-bold text-rose-700 bg-rose-50/80 border-b border-rose-100 border-l border-slate-200" colspan="${glob_colunas.cd.length}">Descontos Contábeis (-)</th>`;
        glob_colunas.cd.forEach(c => {
          const shortName = c.replace('DESCONTO', 'DESC.').replace('CONTRIBUICAO', 'CONTRIB.');
          tr2 += `<th class="py-1 px-3 text-right bg-rose-50/50 font-medium border-l border-slate-100">${shortName}</th>`;
          tr3 += `<th class="py-2 px-3 text-right text-rose-800 bg-rose-100/50 border-l border-slate-200">${formatarMoeda(glob_grandTotals.cd[c])}</th>`;
        });
      }
      tr1 += `<th class="py-2 px-3 text-right font-black text-rose-800 bg-rose-100/80 border-l border-rose-200 align-bottom" rowspan="2">Subt. Déb.</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-rose-900 bg-rose-200 border-l border-rose-300">${formatarMoeda(glob_grandTotals.tot_cd)}</th>`;

      const liqContTotal = glob_grandTotals.tot_cc - glob_grandTotals.tot_cd;
      tr1 += `<th class="py-2 px-3 text-right font-black text-slate-800 bg-slate-200/90 border-l border-r border-slate-300 align-bottom" rowspan="2">LÍQ. CONTÁBIL</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-slate-900 bg-slate-300/80 border-l border-r border-slate-400">${formatarMoeda(liqContTotal)}</th>`;

      if (glob_colunas.ncc.length > 0) {
        tr1 += `<th class="py-2 px-2 text-center font-bold text-indigo-700 bg-indigo-50/80 border-b border-indigo-100" colspan="${glob_colunas.ncc.length}">Proventos N. Cont. (+)</th>`;

    // NOVA FUNÇÃO: Atualiza a interface, verifica alterações reais e envia para o banco
    async function salvarFinanceiroBanco(fId, inputElement, liqGeral) {
      let valorDigitado = parseFloat(inputElement.value) || 0;
      let valorOriginal = parseFloat(inputElement.getAttribute('data-original')) || 0;

      // TRAVA LÓGICA: Se o usuário só clicou e saiu sem alterar o valor, cancela a operação!
      if (valorDigitado === valorOriginal) return;

      // 1. Atualiza visualmente na hora (Memória)
      valoresDinheiro[fId] = valorDigitado;
      let valorBanco = liqGeral - valorDigitado;
      document.getElementById(`banco-${fId}`).innerHTML = formatarMoeda(valorBanco);
      inputElement.setAttribute('data-original', valorDigitado); // Atualiza o novo original na tela
      recalcularTotaisInterface();
      if (meuPerfil !== null) renderEnvio();   // dinheiro mudou depois do envio? avisa no topo

      // 2. Gravação Crítica (Banco de Dados)
      try {
        const { data: existente, error: errBusca } = await _supabase
          .from('pagamentos_dinheiro')
          .select('id')
          .eq('funcionario_id', fId)
          .eq('competencia', competenciaRegra);

        if (errBusca) throw errBusca;

        if (existente && existente.length > 0) {
          // Atualiza se já existir
          const { error: errUpd } = await _supabase
            .from('pagamentos_dinheiro')
            .update({ valor: valorDigitado })
            .eq('id', existente[0].id);
          if (errUpd) throw errUpd;
        } else {
          // Insere se for a primeira vez
          if (valorDigitado > 0) {
            const { error: errIns } = await _supabase
              .from('pagamentos_dinheiro')
              .insert([{
                funcionario_id: fId,
                competencia: competenciaRegra,
                valor: valorDigitado
              }]);
            if (errIns) throw errIns;
          }
        }
      } catch (err) {
        // Agora mostra o erro REAL do banco de dados para facilitar a auditoria
        alert("Erro no Banco de Dados: " + (err.message || "Desconhecido."));
        console.error(err);
      }
    }

    function recalcularTotaisInterface() {
      let grandDinheiro = 0;
      let grandBanco = 0;
      
      let subTotsDinheiro = {};
      let subTotsBanco = {};
      const groupBy = document.getElementById('agruparPor').value;

      glob_dadosFunc.forEach(f => {
        let grp = groupBy === 'loja' ? f.loja : f.empresa;
        if (!subTotsDinheiro[grp]) subTotsDinheiro[grp] = 0;
        if (!subTotsBanco[grp]) subTotsBanco[grp] = 0;

        let din = valoresDinheiro[f.id] || 0;
        let liqGeral = (f.tot_cc - f.tot_cd) + (f.tot_ncc - f.tot_ncd);
        let bc = liqGeral - din;

        grandDinheiro += din;
        grandBanco += bc;

        subTotsDinheiro[grp] += din;
        subTotsBanco[grp] += bc;
      });

      const elTotDin = document.getElementById('totGeralDinheiro');
      const elTotBan = document.getElementById('totGeralBanco');
      if(elTotDin) elTotDin.innerHTML = formatarMoeda(grandDinheiro);
      if(elTotBan) elTotBan.innerHTML = formatarMoeda(grandBanco);

      for (const [grpName, val] of Object.entries(subTotsDinheiro)) {
        const safeName = grpName.replace(/[^a-zA-Z0-9]/g, '_');
        const el = document.getElementById(`subDinheiro-${safeName}`);
        if(el) el.innerHTML = formatarMoeda(val);
      }
      for (const [grpName, val] of Object.entries(subTotsBanco)) {
        const safeName = grpName.replace(/[^a-zA-Z0-9]/g, '_');
        const el = document.getElementById(`subBanco-${safeName}`);
        if(el) el.innerHTML = formatarMoeda(val);
      }
    }

    function abrirRelatorioBanco() {
      let txtBanco = "";
      let totalGeralBanco = 0;
      let subtotalEmpresa = 0;
      let empresaAtual = "";

      const funcOrdenados = [...glob_dadosFunc].sort((a, b) => {
        if (a.empresa < b.empresa) return -1;
        if (a.empresa > b.empresa) return 1;
        return a.nome.localeCompare(b.nome);
      });

      funcOrdenados.forEach((f, idx) => {

          if (empresaAtual !== f.empresa) {

               txtBanco += `----------------------------------------\n`;
               txtBanco += `SUBTOTAL ${empresaAtual}: R$ ${formatarMoedaSimples(subtotalEmpresa)}\n`;
               txtBanco += `========================================\n\n`;

            empresaAtual = f.empresa;
            subtotalEmpresa = 0;
            txtBanco += `EMPRESA: ${empresaAtual}\n`;
            txtBanco += `----------------------------------------\n`;
          }

          txtBanco += `${f.nome} | R$ ${formatarMoedaSimples(banco)}\n`;
          subtotalEmpresa += banco;
          totalGeralBanco += banco;

           txtBanco += `----------------------------------------\n`;
           txtBanco += `SUBTOTAL ${empresaAtual}: R$ ${formatarMoedaSimples(subtotalEmpresa)}\n`;
           txtBanco += `========================================\n\n`;

    // =================================================================
    // CONFERÊNCIA FINAL -> FINANCEIRO (salário do 5º dia útil)
    // Enquanto o RH não envia, o Financeiro não vê o pagamento. Depois do envio,
    // ajustes são feitos em Lançamentos e reenviados aqui (com motivo): o que não
    // foi pago é substituído; o que já foi pago vira complemento ou alerta.
    // =================================================================
    let meuPerfil = null, ultimoEnvio = null, pagosQuinto = [], difsEnvio = [];
    const r2 = v => Math.round((parseFloat(v) || 0) * 100) / 100;
    const escH = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const dbrH = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '-';
    const podeEnviar = () => ['RH', 'GESTOR'].includes(meuPerfil);

    function fotoAtual() {
      return glob_dadosFunc.map(f => ({ funcionario_id: f.id, nome: f.nome,
        liquido: r2((f.tot_cc - f.tot_cd) + (f.tot_ncc - f.tot_ncd)), dinheiro: r2(valoresDinheiro[f.id] || 0) }))
        .filter(x => x.liquido !== 0 || x.dinheiro !== 0);
    }
    function compararComEnvio() {
      if (!ultimoEnvio) return [];
      const antes = new Map((ultimoEnvio.itens || []).map(i => [i.funcionario_id, i]));
      const agora = new Map(fotoAtual().map(i => [i.funcionario_id, i]));
      const ids = new Set([...antes.keys(), ...agora.keys()]);
      const difs = [];
      ids.forEach(id => {
        const a = antes.get(id) || { liquido: 0, dinheiro: 0 }, n = agora.get(id) || { liquido: 0, dinheiro: 0 };
        if (Math.abs(r2(a.liquido) - n.liquido) >= 0.01 || Math.abs(r2(a.dinheiro) - n.dinheiro) >= 0.01)
          difs.push({ nome: n.nome || a.nome || (glob_dadosFunc.find(f => f.id === id) || {}).nome || '?', antes: r2(a.liquido), agora: n.liquido, dinA: r2(a.dinheiro), dinN: n.dinheiro });
      });
      return difs.sort((x, y) => x.nome.localeCompare(y.nome));
    }

    async function carregarEnvio() {
      try {
        if (meuPerfil === null) { const { data: u } = await _supabase.rpc('fn_meu_usuario'); meuPerfil = (Array.isArray(u) ? u[0] : u)?.perfil || ''; }
        const [rE, rP] = await Promise.all([
          _supabase.from('folha_envios').select('*').eq('competencia', competenciaRegra).order('versao', { ascending: false }).limit(1),
          _supabase.from('pagamentos_extras').select('id, status, valor, funcionario_id').eq('tipo', 'QUINTO_DIA').eq('competencia', competenciaRegra)
        ]);
        if (rE.error) { document.getElementById('barraEnvio').innerHTML = `<div class="bg-slate-100 border border-slate-300 rounded-xl p-3 text-xs text-slate-600">Envio ao Financeiro ainda não instalado no banco (rode o SQL AN). ${escH(rE.error.message)}</div>`; return; }
        ultimoEnvio = (rE.data || [])[0] || null;
        pagosQuinto = (rP.data || []);
      } catch (e) { return; }
      renderEnvio();
    }

    function renderEnvio() {
      const box = document.getElementById('barraEnvio');
      const foto = fotoAtual();
      const tot = foto.reduce((a, i) => a + i.liquido, 0);
      if (!ultimoEnvio) {
        box.innerHTML = `<div class="bg-amber-50 border-2 border-amber-300 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div class="text-xs text-amber-900"><div class="font-black text-sm">⏳ Folha ${escH(competenciaRegra)} ainda NÃO foi enviada ao Financeiro</div>
            Faça a conferência final aqui (funcionários, valores, ajustes e dinheiro/banco). Enquanto não enviar, <b>o Financeiro não vê o pagamento do 5º dia útil</b>.
            <div class="mt-1 font-mono">${foto.length} funcionário(s) · líquido ${formatarMoeda(tot)}</div></div>
          ${podeEnviar() ? `<button onclick="abrirEnvio()" class="px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-black text-xs cursor-pointer whitespace-nowrap shadow">✅ CONFERÊNCIA FINALIZADA · ENVIAR AO FINANCEIRO</button>` : '<span class="text-[11px] text-amber-800">Somente RH ou Gestão enviam.</span>'}
        </div>`;
        return;
      }
      difsEnvio = compararComEnvio();
      const abertos = pagosQuinto.filter(p => ['PENDENTE', 'PROBLEMA'].includes(p.status)).length;
      const pagos = pagosQuinto.filter(p => p.status === 'PAGO').length;
      const probs = pagosQuinto.filter(p => p.status === 'PROBLEMA').length;
      const alertas = (ultimoEnvio.alertas || []);
      const cab = `✅ Enviada ao Financeiro${ultimoEnvio.versao > 1 ? ` (${ultimoEnvio.versao}º envio)` : ''} em <b>${new Date(ultimoEnvio.enviado_em).toLocaleString('pt-BR')}</b> por ${escH(ultimoEnvio.enviado_por || '')} · pagar em <b>${dbrH(ultimoEnvio.data_pagamento)}</b>`;
      const sit = `<div class="mt-1 font-mono">${ultimoEnvio.qtd} funcionário(s) · líquido ${formatarMoeda(ultimoEnvio.total_liquido)} (banco ${formatarMoeda(ultimoEnvio.total_banco)} · dinheiro ${formatarMoeda(ultimoEnvio.total_dinheiro)}) · Financeiro: <b>${pagos}</b> pago(s), <b>${abertos}</b> a pagar${probs ? ` · <b class="text-rose-700">${probs} com problema</b>` : ''}</div>
        ${ultimoEnvio.motivo ? `<div class="text-[11px] mt-0.5">Último ajuste: ${escH(ultimoEnvio.motivo)}</div>` : ''}`;
      const alertHtml = alertas.length ? `<div class="mt-2 bg-rose-50 border border-rose-300 rounded-lg p-2 text-[11px] text-rose-900"><b>⚠ Atenção:</b> ${alertas.map(a => a.tipo === 'PAGO_A_MAIOR'
          ? `${escH(a.nome)} já recebeu ${formatarMoedaSimples(a.pago)} (${a.meio === 'DINHEIRO' ? 'dinheiro' : 'banco'}), o correto é ${formatarMoedaSimples(a.correto)} — <b>pago a maior R$ ${formatarMoedaSimples(a.valor)}</b> (descontar na próxima competência)`
          : `${escH(a.nome)} com líquido negativo (R$ ${formatarMoedaSimples(a.valor)}) — não foi enviado`).join(' · ')}</div>` : '';
      if (!difsEnvio.length) {
        box.innerHTML = `<div class="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-4 text-xs text-emerald-900"><div class="text-sm">${cab}</div>${sit}
          <div class="text-[11px] text-emerald-700 mt-1">Nenhuma alteração desde o envio. Se precisar ajustar: corrija em Lançamentos e volte aqui para reenviar.</div>${alertHtml}</div>`;
        return;
      }
      const dif = difsEnvio.reduce((a, d) => a + (d.agora - d.antes), 0);
      box.innerHTML = `<div class="bg-rose-50 border-2 border-rose-400 rounded-xl p-4 text-xs text-rose-900">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div><div class="text-sm text-slate-700">${cab}</div>${sit}
            <div class="font-black text-sm mt-2">⚠ ${difsEnvio.length} funcionário(s) mudaram DEPOIS do envio (diferença ${dif >= 0 ? '+' : '−'} R$ ${formatarMoedaSimples(Math.abs(dif))}). O Financeiro ainda está com os valores antigos.</div></div>
          ${podeEnviar() ? `<button onclick="abrirEnvio()" class="px-4 py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-black text-xs cursor-pointer whitespace-nowrap shadow">🔁 REENVIAR AJUSTES AO FINANCEIRO</button>` : ''}
        </div>
        <details class="mt-2"><summary class="cursor-pointer font-bold">ver o que mudou</summary>${tabelaDifs(difsEnvio)}</details>${alertHtml}</div>`;
    }

    function tabelaDifs(difs) {
      return `<table class="mt-2 w-full text-[11px] bg-white rounded"><tr class="text-slate-500 text-left"><th class="p-1">Funcionário</th><th class="p-1 text-right">Enviado</th><th class="p-1 text-right">Agora</th><th class="p-1 text-right">Diferença</th></tr>
        ${difs.map(d => `<tr class="border-t"><td class="p-1">${escH(d.nome)}${Math.abs(d.dinA - d.dinN) >= 0.01 ? ` <span class="text-amber-700">(dinheiro ${formatarMoedaSimples(d.dinA)} → ${formatarMoedaSimples(d.dinN)})</span>` : ''}</td>
          <td class="p-1 text-right font-mono">${formatarMoedaSimples(d.antes)}</td><td class="p-1 text-right font-mono">${formatarMoedaSimples(d.agora)}</td>
          <td class="p-1 text-right font-mono font-bold ${d.agora - d.antes < 0 ? 'text-rose-700' : 'text-emerald-700'}">${d.agora - d.antes >= 0 ? '+' : '−'}${formatarMoedaSimples(Math.abs(d.agora - d.antes))}</td></tr>`).join('')}</table>`;
    }

    async function abrirEnvio() {
      const foto = fotoAtual();
      const neg = foto.filter(i => i.liquido < 0), dinMaior = foto.filter(i => i.dinheiro > i.liquido && i.liquido >= 0);
      if (dinMaior.length) return alert('Dinheiro maior que o líquido para: ' + dinMaior.map(i => i.nome).join(', ') + '. Corrija a coluna Dinheiro antes de enviar.');
      const ok = foto.filter(i => i.liquido > 0);
      const banco = ok.reduce((a, i) => a + i.liquido - i.dinheiro, 0), din = ok.reduce((a, i) => a + i.dinheiro, 0);
      const reenvio = !!ultimoEnvio;
      document.getElementById('envTitulo').innerText = reenvio ? 'REENVIAR AJUSTES AO FINANCEIRO' : 'CONFERÊNCIA FINALIZADA · ENVIAR AO FINANCEIRO';
      document.getElementById('envBoxMotivo').classList.toggle('hidden', !reenvio);
      document.getElementById('envMotivo').value = '';
      document.getElementById('envCiente').checked = false;
      document.getElementById('envResumo').innerHTML = `<div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-slate-50 border rounded-lg p-2"><div class="text-[10px] text-slate-500 font-bold">FUNCIONÁRIOS</div><div class="text-lg font-black">${ok.length}</div></div>
          <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-2"><div class="text-[10px] text-indigo-700 font-bold">BANCO / PIX</div><div class="text-lg font-black font-mono">${formatarMoedaSimples(banco)}</div></div>
          <div class="bg-amber-50 border border-amber-200 rounded-lg p-2"><div class="text-[10px] text-amber-700 font-bold">DINHEIRO</div><div class="text-lg font-black font-mono">${formatarMoedaSimples(din)}</div></div></div>
        ${neg.length ? `<div class="mt-2 bg-rose-50 border border-rose-300 rounded p-2 text-rose-800">⚠ Líquido negativo (não será enviado): ${neg.map(i => escH(i.nome) + ' ' + formatarMoedaSimples(i.liquido)).join(' · ')}</div>` : ''}
        ${reenvio ? (difsEnvio.length ? `<div class="mt-2 font-bold">Mudanças desde o envio anterior:</div>${tabelaDifs(difsEnvio)}
          <div class="mt-2 text-[11px] text-slate-600">O que o Financeiro ainda não pagou é substituído pelo valor novo. O que já foi pago vira <b>complemento</b> (se aumentou) ou <b>alerta de pago a maior</b> (se diminuiu).</div>`
          : '<div class="mt-2 text-slate-600">Nenhuma diferença de valor — o reenvio só atualiza a data, se você mudar.</div>') : ''}`;
      let data = ultimoEnvio?.data_pagamento || '';
      if (!data) { try { const { data: d } = await _supabase.rpc('fn_quinto_dia_util', { p_competencia: competenciaRegra }); data = d || ''; } catch (e) {} }
      document.getElementById('envData').value = data;
      document.getElementById('modalEnvio').classList.remove('hidden');
    }

    async function confirmarEnvio() {
      const data = document.getElementById('envData').value, motivo = document.getElementById('envMotivo').value.trim();
      if (!data) return alert('Informe a data de pagamento.');
      if (ultimoEnvio && motivo.length < 5) return alert('Informe o motivo do reenvio.');
      if (!document.getElementById('envCiente').checked) return alert('Marque a confirmação de que a conferência foi finalizada.');
      const btn = document.getElementById('envBtn'); btn.disabled = true; btn.innerText = 'ENVIANDO...';
      const itens = fotoAtual().map(({ funcionario_id, nome, liquido, dinheiro }) => ({ funcionario_id, nome, liquido, dinheiro }));
      const { data: r, error } = await _supabase.rpc('fn_folha_enviar_financeiro', { p_competencia: competenciaRegra, p_data: data, p_itens: itens, p_motivo: motivo || null });
      btn.disabled = false; btn.innerText = 'ENVIAR';
      if (error) return alert('Não foi possível enviar: ' + error.message);
      fecharModal('modalEnvio');
      alert(`Enviado ao Financeiro (${r.versao}º envio).\n${r.criados} pagamento(s) novo(s), ${r.cancelados} substituído(s), ${r.mantidos} sem mudança.` + ((r.alertas || []).length ? `\n\n⚠ ${(r.alertas || []).length} alerta(s) — veja no quadro do topo.` : ''));
      carregarEnvio();
    }

    processarDadosBanco();
  </script>
</body>
</html>
