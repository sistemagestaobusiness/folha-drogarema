<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumo Geral da Folha - Sistema Drogarema</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Esconde barra de rolagem mas mantém a funcionalidade para visual clean */
    .no-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .no-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .no-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    /* Efeito de sombra interna para rolagem fixa */
    .shadow-fixa { box-shadow: 4px 0 6px -2px rgba(0, 0, 0, 0.05); }
    /* Elevação de prioridade para a interseção (Canto superior esquerdo) */
    .z-canto { z-index: 60 !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">

  <!-- Proteção de Acesso -->
  <script>
    if (!localStorage.getItem('usuario_drogarema')) {
      alert('Acesso negado! Faça login primeiro.');
      window.location.href = 'login.html';
    }
  </script>

  <!-- Cabeçalho Principal -->
  <div class="sticky top-0 z-[70] bg-white/95 backdrop-blur-sm py-4 px-6 border-b border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xs">
    <div>
      <h1 class="text-xl font-black text-slate-900 tracking-wide uppercase">Resumo Geral de Lançamentos</h1>
      <p class="text-xs text-slate-500 font-medium">Competência Ativa: <span id="labelCompetencia" class="text-emerald-600 font-bold font-mono">...</span></p>
    </div>
    
    <div class="flex items-center gap-3 w-full md:w-auto">
      <!-- Seletor de Agrupamento -->
      <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg p-1">
        <span class="text-[10px] text-slate-500 font-bold uppercase px-2">Agrupar:</span>
        <select id="agruparPor" onchange="renderizarTabelaCorpo()" class="bg-transparent text-xs font-bold text-slate-800 focus:outline-none cursor-pointer">
          <option value="loja">POR LOJA</option>
          <option value="empresa">POR EMPRESA</option>
        </select>
      </div>

      <button onclick="window.print()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-bold text-xs transition shadow-sm cursor-pointer whitespace-nowrap">
        🖨️ IMPRIMIR
      </button>
      <a href="index.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-bold text-xs transition border border-slate-300 shadow-2xs whitespace-nowrap">
        ← PAINEL
      </a>
    </div>
  </div>

  <!-- Container da Tabela Dinâmica -->
  <div class="p-4 sm:p-6">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
      <div class="overflow-x-auto overflow-y-auto w-full no-scrollbar" style="max-height: calc(100vh - 120px);">
        <table class="w-full text-left text-xs border-collapse">
          <thead id="tabelaCabecalho" class="sticky top-0 z-50 bg-slate-50 shadow-sm">
            <!-- Gerado via JS (Categorias, Nomes dos Eventos e TOTAL GERAL) -->
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-slate-100">
            <tr><td class="p-8 text-center text-slate-400 font-mono">Sincronizando base de dados e cruzando eventos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Script de Inteligência da Tabela -->
  <script>
    const SUPABASE_URL = 'https://jmetpmdnaxwabeccimgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let competenciaAtivaTexto = localStorage.getItem('competencia_ativa') || 'AGOSTO / 2026';
    let competenciaRegra = '';
    
    // Variáveis Globais para não recarregar do banco ao trocar o agrupamento
    let glob_colunas = { cc: [], cd: [], ncc: [], ncd: [] };
    let glob_dadosFunc = [];
    let glob_grandTotals = { cc: {}, cd: {}, ncc: {}, ncd: {}, tot_cc: 0, tot_cd: 0, tot_ncc: 0, tot_ncd: 0 };

    function converterCompetenciaParaMMYYYY(texto) {
      const mesesMap = {
        'JANEIRO': '01', 'FEVEREIRO': '02', 'MARÇO': '03', 'MARCO': '03',
        'ABRIL': '04', 'MAIO': '05', 'JUNHO': '06', 'JULHO': '07',
        'AGOSTO': '08', 'SETEMBRO': '09', 'OUTUBRO': '10', 'NOVEMBRO': '11', 'DEZEMBRO': '12'
      };
      const partes = texto.split('/');
      if (partes.length >= 2) {
        const mesNome = partes[0].trim().toUpperCase();
        const ano = partes[1].trim();
        const mesNum = mesesMap[mesNome] || '08';
        return `${mesNum}/${ano}`;
      }
      return '08/2026';
    }

    function formatarMoeda(valor) {
      if (!valor || parseFloat(valor) === 0) return '<span class="text-slate-300">-</span>';
      return parseFloat(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Inicializa estrutura zerada de totais
    function initTotals() {
      return { cc: {}, cd: {}, ncc: {}, ncd: {}, tot_cc: 0, tot_cd: 0, tot_ncc: 0, tot_ncd: 0 };
    }

    // Acumula valores na variável de totais
    function accumulate(totObj, f) {
      glob_colunas.cc.forEach(c => totObj.cc[c] = (totObj.cc[c] || 0) + (f.cc[c] || 0));
      totObj.tot_cc += f.tot_cc;
      
      glob_colunas.cd.forEach(c => totObj.cd[c] = (totObj.cd[c] || 0) + (f.cd[c] || 0));
      totObj.tot_cd += f.tot_cd;
      
      glob_colunas.ncc.forEach(c => totObj.ncc[c] = (totObj.ncc[c] || 0) + (f.ncc[c] || 0));
      totObj.tot_ncc += f.tot_ncc;
      
      glob_colunas.ncd.forEach(c => totObj.ncd[c] = (totObj.ncd[c] || 0) + (f.ncd[c] || 0));
      totObj.tot_ncd += f.tot_ncd;
    }

    async function processarDadosBanco() {
      competenciaRegra = converterCompetenciaParaMMYYYY(competenciaAtivaTexto);
      document.getElementById('labelCompetencia').innerText = competenciaRegra;

      try {
        const [resFunc, resFolha, resEventos, resLojas, resEmpresas] = await Promise.all([
          _supabase.from('funcionarios').select('*'),
          _supabase.from('folha_itens').select('*').eq('competencia', competenciaRegra),
          _supabase.from('tipos_eventos').select('*'),
          _supabase.from('lojas').select('*'),
          _supabase.from('empresas').select('*')
        ]);

        const funcionarios = resFunc.data || [];
        const itensFolha = resFolha.data || [];
        const eventos = resEventos.data || [];
        const lojas = resLojas.data || [];
        const empresas = resEmpresas.data || [];

        const mapaEventos = {};
        eventos.forEach(e => {
          mapaEventos[String(e.codigo_evento)] = e.natureza_do_evento || 'CONTABIL';
          mapaEventos[String(e.descricao_do_evento || '').toUpperCase()] = e.natureza_do_evento || 'CONTABIL';
        });

        const colunasSet = { cc: new Set(), cd: new Set(), ncc: new Set(), ncd: new Set() };
        const dadosFuncMap = {};

        itensFolha.forEach(item => {
          const fId = item.funcionario_id;
          
          if (!dadosFuncMap[fId]) {
            const f = funcionarios.find(x => String(x.id) === String(fId));
            if (!f) return;

            // Define LOJA
            let nomeLoja = f.loja_trabalha || '-';
            const numLojaStr = String(f.loja_trabalha).trim();
            const lojaEncontrada = lojas.find(l => {
              const lNome = String(l.nome_loja || l.loja || '').trim();
              return lNome.includes(numLojaStr) || lNome.endsWith(numLojaStr);
            });
            if (lojaEncontrada) nomeLoja = lojaEncontrada.nome_loja || lojaEncontrada.loja;

            // Define EMPRESA
            let empresaMatch = null;
            if (f.empresa_id) {
              empresaMatch = empresas.find(e => String(e.id) === String(f.empresa_id));
            }
            if (!empresaMatch && f.cnpj) {
              const funcCnpjNum = String(f.cnpj).replace(/\D/g, '');
              empresaMatch = empresas.find(e => (e.cnpj || '').replace(/\D/g, '') === funcCnpjNum);
            }
            if (!empresaMatch && f.empresa_registro) {
              empresaMatch = empresas.find(e => e.cnpj && f.empresa_registro.includes(e.cnpj));
            }
            if (!empresaMatch && f.empresa_registro) {
              empresaMatch = empresas.find(e => f.empresa_registro.includes(e.razao_social));
            }

            let nomeEmpresa = f.empresa_registro || '-';
            if (empresaMatch) {
              nomeEmpresa = empresaMatch.nome_fantasia || empresaMatch.razao_social || nomeEmpresa;
            }

            dadosFuncMap[fId] = {
              nome: f.nome_registro,
              loja: nomeLoja.toUpperCase(),
              empresa: nomeEmpresa.toUpperCase(),
              cc: {}, cd: {}, ncc: {}, ncd: {},
              tot_cc: 0, tot_cd: 0, tot_ncc: 0, tot_ncd: 0
            };
          }

          const val = parseFloat(item.valor || 0);
          const rubrica = String(item.rubrica || '').toUpperCase();
          const tipo = (item.tipo || 'PROVENTO').toUpperCase();
          
          let natureza = 'CONTABIL';
          for (let key in mapaEventos) {
            if (rubrica.includes(key)) {
              natureza = mapaEventos[key];
              break;
            }
          }
          if (natureza === 'NAO_CONTABIL' || rubrica.includes('FORA')) natureza = 'NAO_CONTABIL';

          let cat = '';
          if (tipo === 'PROVENTO' && natureza === 'CONTABIL') cat = 'cc';
          else if (tipo === 'DESCONTO' && natureza === 'CONTABIL') cat = 'cd';
          else if (tipo === 'PROVENTO' && natureza === 'NAO_CONTABIL') cat = 'ncc';
          else if (tipo === 'DESCONTO' && natureza === 'NAO_CONTABIL') cat = 'ncd';

          if (cat) {
            colunasSet[cat].add(rubrica);
            if (!dadosFuncMap[fId][cat][rubrica]) dadosFuncMap[fId][cat][rubrica] = 0;
            dadosFuncMap[fId][cat][rubrica] += val;
            dadosFuncMap[fId]['tot_'+cat] += val;
          }
        });

        if (Object.keys(dadosFuncMap).length === 0) {
          document.getElementById('tabelaCorpo').innerHTML = `<tr><td class="p-8 text-center text-slate-400">Nenhum lançamento processado para ${competenciaRegra}.</td></tr>`;
          document.getElementById('tabelaCabecalho').innerHTML = '';
          return;
        }

        glob_colunas = {
          cc: Array.from(colunasSet.cc).sort(),
          cd: Array.from(colunasSet.cd).sort(),
          ncc: Array.from(colunasSet.ncc).sort(),
          ncd: Array.from(colunasSet.ncd).sort()
        };

        glob_dadosFunc = Object.values(dadosFuncMap);

        // Calcula o TOTAL GERAL
        glob_grandTotals = initTotals();
        glob_dadosFunc.forEach(f => accumulate(glob_grandTotals, f));

        renderizarCabecalho();
        renderizarTabelaCorpo();

      } catch (err) {
        console.error(err);
        document.getElementById('tabelaCorpo').innerHTML = `<tr><td class="p-8 text-center text-rose-600 font-bold">Erro crítico: ${err.message}</td></tr>`;
      }
    }

    function renderizarCabecalho() {
      // Linha 1: Super Categorias
      let tr1 = `<tr class="text-[9px] uppercase tracking-wider text-slate-500">`;
      // Linha 2: Nomes dos Eventos
      let tr2 = `<tr class="text-[9px] uppercase tracking-wider text-slate-500 border-b border-slate-300">`;
      // Linha 3: TOTAL GERAL (A CEREJA DO BOLO)
      let tr3 = `<tr class="text-[10px] bg-slate-100 font-bold text-slate-800 border-b-2 border-slate-300 shadow-sm">`;

      // Colunas Congeladas (Larguras exatas) -> Totalizando 420px de congelamento (180 + 120 + 120)
      const styC1 = `sticky z-canto bg-slate-50 border-r border-slate-200 shadow-fixa align-bottom`; 
      const widthC1 = `left: 0; min-width: 180px; max-width: 180px;`;
      const styC2 = `sticky z-canto bg-slate-50 border-r border-slate-200 shadow-fixa align-bottom`; 
      const widthC2 = `left: 180px; min-width: 120px; max-width: 120px;`;
      const styC3 = `sticky z-canto bg-slate-50 border-r border-slate-300 shadow-fixa align-bottom`; 
      const widthC3 = `left: 300px; min-width: 120px; max-width: 120px;`;

      tr1 += `<th class="${styC1} py-2 px-3" style="${widthC1}" rowspan="2">Colaborador</th>`;
      tr1 += `<th class="${styC2} py-2 px-3" style="${widthC2}" rowspan="2">Empresa</th>`;
      tr1 += `<th class="${styC3} py-2 px-3" style="${widthC3}" rowspan="2">Loja</th>`;

      // Células do TOTAL GERAL nas colunas fixas
      tr3 += `<th class="py-2 px-3 sticky z-canto bg-slate-200 border-r border-slate-300 shadow-fixa" style="${widthC1}">TOTAL GERAL</th>`;
      tr3 += `<th class="py-2 px-3 sticky z-canto bg-slate-200 border-r border-slate-300 shadow-fixa" style="${widthC2}">-</th>`;
      tr3 += `<th class="py-2 px-3 sticky z-canto bg-slate-200 border-r border-slate-400 shadow-fixa" style="${widthC3}">-</th>`;

      // --- CRÉDITOS CONTÁBEIS ---
      if (glob_colunas.cc.length > 0) {
        tr1 += `<th class="py-2 px-2 text-center font-bold text-emerald-700 bg-emerald-50/80 border-b border-emerald-100" colspan="${glob_colunas.cc.length}">Proventos Contábeis (+)</th>`;
        glob_colunas.cc.forEach(c => {
          tr2 += `<th class="py-1 px-3 text-right bg-emerald-50/50 font-medium">${c}</th>`;
          tr3 += `<th class="py-2 px-3 text-right text-emerald-800 bg-emerald-100/50">${formatarMoeda(glob_grandTotals.cc[c])}</th>`;
        });
      }
      tr1 += `<th class="py-2 px-3 text-right font-black text-emerald-800 bg-emerald-100/80 border-l border-emerald-200 align-bottom" rowspan="2">Subt. Créd.</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-emerald-900 bg-emerald-200 border-l border-emerald-300">${formatarMoeda(glob_grandTotals.tot_cc)}</th>`;

      // --- DÉBITOS CONTÁBEIS ---
      if (glob_colunas.cd.length > 0) {
        tr1 += `<th class="py-2 px-2 text-center font-bold text-rose-700 bg-rose-50/80 border-b border-rose-100 border-l border-slate-200" colspan="${glob_colunas.cd.length}">Descontos Contábeis (-)</th>`;
        glob_colunas.cd.forEach(c => {
          const shortName = c.replace('DESCONTO', 'DESC.').replace('CONTRIBUICAO', 'CONTRIB.');
          tr2 += `<th class="py-1 px-3 text-right bg-rose-50/50 font-medium border-l border-slate-100">${shortName}</th>`;
          tr3 += `<th class="py-2 px-3 text-right text-rose-800 bg-rose-100/50 border-l border-slate-200">${formatarMoeda(glob_grandTotals.cd[c])}</th>`;
        });
      }
      tr1 += `<th class="py-2 px-3 text-right font-black text-rose-800 bg-rose-100/80 border-l border-rose-200 align-bottom" rowspan="2">Subt. Déb.</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-rose-900 bg-rose-200 border-l border-rose-300">${formatarMoeda(glob_grandTotals.tot_cd)}</th>`;

      // TOTAL LÍQ CONTÁBIL
      tr1 += `<th class="py-2 px-3 text-right font-black text-slate-800 bg-slate-200/90 border-l border-r border-slate-300 align-bottom" rowspan="2">LÍQ. CONTÁBIL</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-slate-900 bg-slate-300/80 border-l border-r border-slate-400">${formatarMoeda(glob_grandTotals.tot_cc - glob_grandTotals.tot_cd)}</th>`;

      // --- CRÉDITOS NÃO CONTÁBEIS ---
      if (glob_colunas.ncc.length > 0) {
        tr1 += `<th class="py-2 px-2 text-center font-bold text-indigo-700 bg-indigo-50/80 border-b border-indigo-100" colspan="${glob_colunas.ncc.length}">Proventos N. Cont. (+)</th>`;
        glob_colunas.ncc.forEach(c => {
          tr2 += `<th class="py-1 px-3 text-right bg-indigo-50/50 font-medium">${c}</th>`;
          tr3 += `<th class="py-2 px-3 text-right text-indigo-800 bg-indigo-100/50">${formatarMoeda(glob_grandTotals.ncc[c])}</th>`;
        });
      }
      tr1 += `<th class="py-2 px-3 text-right font-black text-indigo-800 bg-indigo-100/80 border-l border-indigo-200 align-bottom" rowspan="2">Subt. Créd. NC</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-indigo-900 bg-indigo-200 border-l border-indigo-300">${formatarMoeda(glob_grandTotals.tot_ncc)}</th>`;

      // --- DÉBITOS NÃO CONTÁBEIS ---
      if (glob_colunas.ncd.length > 0) {
        tr1 += `<th class="py-2 px-2 text-center font-bold text-orange-700 bg-orange-50/80 border-b border-orange-100 border-l border-slate-200" colspan="${glob_colunas.ncd.length}">Descontos N. Cont. (-)</th>`;
        glob_colunas.ncd.forEach(c => {
          tr2 += `<th class="py-1 px-3 text-right bg-orange-50/50 font-medium border-l border-slate-100">${c}</th>`;
          tr3 += `<th class="py-2 px-3 text-right text-orange-800 bg-orange-100/50 border-l border-slate-200">${formatarMoeda(glob_grandTotals.ncd[c])}</th>`;
        });
      }
      tr1 += `<th class="py-2 px-3 text-right font-black text-orange-800 bg-orange-100/80 border-l border-orange-200 align-bottom" rowspan="2">Subt. Déb. NC</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-orange-900 bg-orange-200 border-l border-orange-300">${formatarMoeda(glob_grandTotals.tot_ncd)}</th>`;

      // TOTAL LÍQ NÃO CONTÁBIL
      tr1 += `<th class="py-2 px-3 text-right font-black text-slate-800 bg-slate-200/90 border-l border-r border-slate-300 align-bottom" rowspan="2">LÍQ. NÃO CONT.</th>`;
      tr3 += `<th class="py-2 px-3 text-right text-slate-900 bg-slate-300/80 border-l border-r border-slate-400">${formatarMoeda(glob_grandTotals.tot_ncc - glob_grandTotals.tot_ncd)}</th>`;

      // LÍQUIDO GERAL
      tr1 += `<th class="py-2 px-4 text-right font-black text-emerald-900 bg-emerald-200 tracking-widest text-[11px] align-bottom shadow-sm" rowspan="2">LÍQUIDO GERAL</th>`;
      const liqGerTotal = (glob_grandTotals.tot_cc - glob_grandTotals.tot_cd) + (glob_grandTotals.tot_ncc - glob_grandTotals.tot_ncd);
      tr3 += `<th class="py-2 px-4 text-right text-emerald-950 font-black bg-emerald-300 text-[12px] shadow-sm">${formatarMoeda(liqGerTotal)}</th>`;

      tr1 += `</tr>`; tr2 += `</tr>`; tr3 += `</tr>`;
      document.getElementById('tabelaCabecalho').innerHTML = tr1 + tr2 + tr3;
    }

    function renderizarTabelaCorpo() {
      const groupBy = document.getElementById('agruparPor').value; // 'loja' ou 'empresa'
      
      // Ordenação: 1º Pelo Grupo, 2º Pelo Nome
      glob_dadosFunc.sort((a, b) => {
        const ga = groupBy === 'loja' ? a.loja : a.empresa;
        const gb = groupBy === 'loja' ? b.loja : b.empresa;
        if (ga < gb) return -1;
        if (ga > gb) return 1;
        return a.nome.localeCompare(b.nome);
      });

      let tbodyHtml = '';
      let currentGroup = null;
      let groupTotals = initTotals();

      const styLeft1 = `sticky z-20 bg-white border-r border-slate-100 shadow-fixa`;
      const styLeft2 = `sticky z-20 bg-white border-r border-slate-100 shadow-fixa`;
      const styLeft3 = `sticky z-20 bg-white border-r border-slate-300 shadow-fixa`;
      const wC1 = `left: 0; min-width: 180px; max-width: 180px;`;
      const wC2 = `left: 180px; min-width: 120px; max-width: 120px;`;
      const wC3 = `left: 300px; min-width: 120px; max-width: 120px;`;

      glob_dadosFunc.forEach((f, idx) => {
        const groupVal = groupBy === 'loja' ? f.loja : f.empresa;

        // Imprime Subtotal do Grupo Anterior se o grupo mudou
        if (currentGroup !== null && currentGroup !== groupVal) {
          tbodyHtml += gerarHTMLSubtotal(currentGroup, groupTotals, wC1, wC2, wC3);
          groupTotals = initTotals(); // reseta contadores
        }
        currentGroup = groupVal;
        accumulate(groupTotals, f); // Acumula no grupo atual

        let tr = `<tr class="hover:bg-slate-50 text-[10px] text-slate-700 font-mono transition">`;
        
        tr += `<td class="py-2 px-3 whitespace-nowrap font-sans font-bold text-slate-800 truncate ${styLeft1}" style="${wC1}" title="${f.nome}">${f.nome}</td>`;
        tr += `<td class="py-2 px-3 whitespace-nowrap font-sans text-slate-500 truncate ${styLeft2}" style="${wC2}" title="${f.empresa}">${f.empresa}</td>`;
        tr += `<td class="py-2 px-3 whitespace-nowrap font-sans text-slate-500 truncate ${styLeft3}" style="${wC3}" title="${f.loja}">${f.loja}</td>`;

        // CC
        glob_colunas.cc.forEach(c => tr += `<td class="py-2 px-3 text-right whitespace-nowrap bg-emerald-50/20">${formatarMoeda(f.cc[c])}</td>`);
        tr += `<td class="py-2 px-3 text-right whitespace-nowrap font-bold text-emerald-700 bg-emerald-50/80 border-l border-emerald-100">${formatarMoeda(f.tot_cc)}</td>`;
        // CD
        glob_colunas.cd.forEach(c => tr += `<td class="py-2 px-3 text-right whitespace-nowrap text-rose-600 bg-rose-50/20 border-l border-slate-100">${formatarMoeda(f.cd[c])}</td>`);
        tr += `<td class="py-2 px-3 text-right whitespace-nowrap font-bold text-rose-700 bg-rose-50/80 border-l border-rose-100">${formatarMoeda(f.tot_cd)}</td>`;
        // Liq Cont
        const liqCont = f.tot_cc - f.tot_cd;
        tr += `<td class="py-2 px-3 text-right whitespace-nowrap font-bold text-slate-800 bg-slate-100 border-l-2 border-r border-slate-200">${formatarMoeda(liqCont)}</td>`;
        // NCC
        glob_colunas.ncc.forEach(c => tr += `<td class="py-2 px-3 text-right whitespace-nowrap bg-indigo-50/20">${formatarMoeda(f.ncc[c])}</td>`);
        tr += `<td class="py-2 px-3 text-right whitespace-nowrap font-bold text-indigo-700 bg-indigo-50/80 border-l border-indigo-100">${formatarMoeda(f.tot_ncc)}</td>`;
        // NCD
        glob_colunas.ncd.forEach(c => tr += `<td class="py-2 px-3 text-right whitespace-nowrap text-orange-600 bg-orange-50/20 border-l border-slate-100">${formatarMoeda(f.ncd[c])}</td>`);
        tr += `<td class="py-2 px-3 text-right whitespace-nowrap font-bold text-orange-700 bg-orange-50/80 border-l border-orange-100">${formatarMoeda(f.tot_ncd)}</td>`;
        // Liq NC
        const liqNaoCont = f.tot_ncc - f.tot_ncd;
        tr += `<td class="py-2 px-3 text-right whitespace-nowrap font-bold text-slate-800 bg-slate-100 border-l-2 border-r border-slate-200">${formatarMoeda(liqNaoCont)}</td>`;
        // Geral
        const liqGeral = liqCont + liqNaoCont;
        tr += `<td class="py-2 px-4 text-right whitespace-nowrap font-black text-emerald-900 bg-emerald-100/70 text-[11px] shadow-sm">${formatarMoeda(liqGeral)}</td>`;

        tr += `</tr>`;
        tbodyHtml += tr;

        // Imprime Subtotal do Último Grupo
        if (idx === glob_dadosFunc.length - 1) {
          tbodyHtml += gerarHTMLSubtotal(currentGroup, groupTotals, wC1, wC2, wC3);
        }
      });

      document.getElementById('tabelaCorpo').innerHTML = tbodyHtml;
    }

    function gerarHTMLSubtotal(groupName, t, wC1, wC2, wC3) {
      let html = `<tr class="bg-slate-100 font-bold text-[10px] text-slate-800 border-y-2 border-slate-300 shadow-sm">`;
      html += `<td class="py-2 px-3 sticky z-20 bg-slate-100 border-r border-slate-200 shadow-fixa" style="${wC1}">SUBTOTAL:</td>`;
      
      const groupBy = document.getElementById('agruparPor').value;
      if (groupBy === 'empresa') {
        html += `<td class="py-2 px-3 sticky z-20 bg-slate-100 border-r border-slate-200 shadow-fixa text-slate-900 uppercase truncate" style="${wC2}">${groupName}</td>`;
        html += `<td class="py-2 px-3 sticky z-20 bg-slate-100 border-r border-slate-400 shadow-fixa" style="${wC3}">-</td>`;
      } else {
        html += `<td class="py-2 px-3 sticky z-20 bg-slate-100 border-r border-slate-200 shadow-fixa" style="${wC2}">-</td>`;
        html += `<td class="py-2 px-3 sticky z-20 bg-slate-100 border-r border-slate-400 shadow-fixa text-slate-900 uppercase truncate" style="${wC3}">${groupName}</td>`;
      }

      glob_colunas.cc.forEach(c => html += `<td class="py-2 px-3 text-right text-emerald-800 bg-emerald-50">${formatarMoeda(t.cc[c])}</td>`);
      html += `<td class="py-2 px-3 text-right text-emerald-900 bg-emerald-100/80 border-l border-emerald-200">${formatarMoeda(t.tot_cc)}</td>`;
      
      glob_colunas.cd.forEach(c => html += `<td class="py-2 px-3 text-right text-rose-800 bg-rose-50 border-l border-slate-200">${formatarMoeda(t.cd[c])}</td>`);
      html += `<td class="py-2 px-3 text-right text-rose-900 bg-rose-100/80 border-l border-rose-200">${formatarMoeda(t.tot_cd)}</td>`;
      
      html += `<td class="py-2 px-3 text-right text-slate-900 bg-slate-200/90 border-l-2 border-r border-slate-400">${formatarMoeda(t.tot_cc - t.tot_cd)}</td>`;
      
      glob_colunas.ncc.forEach(c => html += `<td class="py-2 px-3 text-right text-indigo-800 bg-indigo-50">${formatarMoeda(t.ncc[c])}</td>`);
      html += `<td class="py-2 px-3 text-right text-indigo-900 bg-indigo-100/80 border-l border-indigo-200">${formatarMoeda(t.tot_ncc)}</td>`;
      
      glob_colunas.ncd.forEach(c => html += `<td class="py-2 px-3 text-right text-orange-800 bg-orange-50 border-l border-slate-200">${formatarMoeda(t.ncd[c])}</td>`);
      html += `<td class="py-2 px-3 text-right text-orange-900 bg-orange-100/80 border-l border-orange-200">${formatarMoeda(t.tot_ncd)}</td>`;
      
      html += `<td class="py-2 px-3 text-right text-slate-900 bg-slate-200/90 border-l-2 border-r border-slate-400">${formatarMoeda(t.tot_ncc - t.tot_ncd)}</td>`;
      
      const lg = (t.tot_cc - t.tot_cd) + (t.tot_ncc - t.tot_ncd);
      html += `<td class="py-2 px-4 text-right text-emerald-950 font-black bg-emerald-200 text-[11px] shadow-sm">${formatarMoeda(lg)}</td>`;
      
      html += `</tr>`;
      return html;
    }

    processarDadosBanco();
  </script>
<!-- Script de Bloqueio por Inatividade (Ex: 15 minutos) -->
  <script>
    let tempoInatividade;
    const TEMPO_LIMITE = 15 * 60 * 1000; // 15 minutos em milissegundos

    function resetarTemporizador() {
      clearTimeout(tempoInatividade);
      tempoInatividade = setTimeout(fazerLogoutPorInatividade, TEMPO_LIMITE);
    }

    function fazerLogoutPorInatividade() {
      // Remove a credencial salva
      localStorage.removeItem('usuario_drogarema');
      
      // Alerta o usuário e redireciona para o login
      alert('Sessão expirada por inatividade. Faça login novamente.');
      window.location.href = 'login.html';
    }

    // Monitora eventos de movimento do mouse, cliques e digitação
    window.onload = resetarTemporizador;
    window.onmousemove = resetarTemporizador;
    window.onkeypress = resetarTemporizador;
    window.onclick = resetarTemporizador;
    window.onscroll = resetarTemporizador;
  </script>
