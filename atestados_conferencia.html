<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferência de atestados - Business</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="acesso.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F5F7] text-slate-800 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-[1100px] mx-auto space-y-4">

    <div class="cab-sis flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 py-3 border-b border-slate-200">
      <div>
        <h1 class="tit-sis text-xl font-bold text-slate-900">📎 Conferência de atestados</h1>
        <p id="subtitulo" class="text-xs text-slate-500">Documentos anexados nos abonos de falta. Confira se é realmente um atestado: a conferência fica no histórico e não altera o abono.</p>
      </div>
      <div class="text-right"><span id="lblUsuario" class="block text-[11px] font-bold text-slate-700">-</span><span id="lblPerfil" class="block text-[10px] text-slate-400 font-mono">-</span></div>
    </div>

    <div id="aviso" class="hidden bg-rose-50 border border-rose-300 text-rose-800 rounded-xl p-4 text-sm font-bold"></div>

    <div id="conteudo" class="hidden space-y-3">
      <div id="boxPend" class="hidden bg-amber-50 border border-amber-300 text-amber-900 rounded-xl p-3 text-sm font-bold"></div>
      <div class="bg-white border border-slate-200 rounded-xl p-3 flex flex-wrap items-end gap-2 text-xs">
        <div><label class="lbl">Situação</label><select id="fStatus" onchange="render()" class="inp !py-1.5">
          <option value="PEND">Aguardando conferência</option><option value="VALIDO">Válidos</option><option value="INVALIDO">Não é atestado / ilegível</option><option value="">Todos</option></select></div>
        <div><label class="lbl">Loja / setor</label><select id="fLoja" onchange="render()" class="inp !py-1.5"><option value="">Todas</option></select></div>
        <div class="flex-1 min-w-[160px]"><label class="lbl">Busca</label><input id="fBusca" oninput="render()" class="inp !py-1.5" placeholder="nome do funcionário"></div>
        <div id="lblTotais" class="text-[11px] text-slate-500 ml-auto"></div>
      </div>
      <div id="lista" class="space-y-2"></div>
    </div>
  </div>

  <style>
    .lbl { display: block; font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 3px; }
    .inp { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 12px; }
  </style>

  <script>
    const _supabase = window.supabase.createClient('https://jmetpmdnaxwabeccimgg.supabase.co', 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k');
    const $ = id => document.getElementById(id);
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    const dbr = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '-';
    const dataHora = v => v ? new Date(v).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
    let perfil = null, docs = [];
    const podeConferir = () => ['SUPERVISOR', 'GESTOR'].includes(perfil);
    const SIT = {
      PEND:     { txt: '⏳ Aguardando conferência', cls: 'bg-amber-100 text-amber-800' },
      VALIDO:   { txt: '✅ Atestado válido', cls: 'bg-emerald-100 text-emerald-800' },
      INVALIDO: { txt: '✕ Não é atestado / ilegível', cls: 'bg-rose-100 text-rose-800' }
    };
    const sitDe = d => d.conferencia_status || 'PEND';

    async function inicializar() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) { location.href = 'login.html'; return; }
      const { data: u } = await rpcRetentar(_supabase, 'fn_meu_usuario');
      perfil = u ? u.perfil : null;
      $('lblUsuario').innerText = (user.email || '').toLowerCase(); $('lblPerfil').innerText = perfil || 'SEM PERFIL';
      if (!['SUPERVISOR', 'RH', 'GESTOR'].includes(perfil)) { $('aviso').innerText = perfil ? 'Seu perfil não tem acesso a esta tela.' : 'Não foi possível conferir o seu acesso agora (internet lenta ou instável). Recarregue a página; se continuar, avise o administrador.'; $('aviso').classList.remove('hidden'); return; }
      if (!podeConferir()) $('subtitulo').innerText = 'Acompanhamento da conferência dos atestados feita pelo supervisor (somente consulta).';
      $('conteudo').classList.remove('hidden');
      await carregar();
    }

    async function carregar() {
      const { data, error } = await _supabase.from('vw_atestados_conferencia').select('*').order('enviado_em', { ascending: false });
      if (error) { $('aviso').innerText = 'Não foi possível carregar. Recarregue a página; se continuar, avise o administrador. Detalhe: ' + traduzirErro(error.message); $('aviso').classList.remove('hidden'); return; }
      docs = data || [];
      const lojas = [...new Map(docs.filter(d => d.loja_id).map(d => [d.loja_id, d.nome_loja])).entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1])));
      const atual = $('fLoja').value;
      $('fLoja').innerHTML = '<option value="">Todas</option>' + lojas.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
      $('fLoja').value = atual;
      render();
    }

    function render() {
      const st = $('fStatus').value, loja = $('fLoja').value, termo = norm($('fBusca').value.trim());
      const lista = docs.filter(d => (!st || sitDe(d) === st) && (!loja || d.loja_id === loja) && (!termo || termo.split(/\s+/).every(t => norm(d.nome_registro).includes(t))));
      const pend = docs.filter(d => sitDe(d) === 'PEND').length, inval = docs.filter(d => sitDe(d) === 'INVALIDO').length;
      $('boxPend').classList.toggle('hidden', !pend);
      $('boxPend').innerText = `📎 ${pend} atestado(s) aguardando conferência` + (podeConferir() ? ': abra o documento e confirme se é realmente um atestado.' : ' do supervisor.');
      $('lblTotais').innerText = `${lista.length} documento(s) · ${pend} pendente(s) · ${inval} inválido(s)`;
      $('lista').innerHTML = lista.length ? lista.map(card).join('') : '<div class="bg-white border border-slate-200 rounded-xl p-8 text-center text-slate-400 text-sm">Nenhum documento.</div>';
    }

    function card(d) {
      const s = SIT[sitDe(d)];
      const auto = d.analise_auto ? `<div class="text-[11px] ${/não encontrei|não foi possível/.test(d.analise_auto) ? 'text-amber-700 font-bold' : 'text-slate-500'}">🔎 leitura automática: ${esc(d.analise_auto)}</div>` : '';
      const origem = d.abono_data ? `abono da falta de <b>${dbr(d.abono_data)}</b> (${esc(String(d.abono_tipo || '').toLowerCase())}) por ${esc(d.abonado_por || '')}`
        : d.solicitacao_id ? 'atestado de falta coberta por freelance' : `documento de ${dbr(d.data_referencia)}`;
      const hist = (d.conferencia_historico || []).map(h => `<div>• ${dataHora(h.em)} · <b>${h.status === 'VALIDO' ? '✅ válido' : '✕ não é atestado / ilegível'}</b>${h.obs ? ' · ' + esc(h.obs) : ''} <span class="text-slate-400">${esc(h.por || '')}</span></div>`).join('');
      const acoes = podeConferir() ? `
        <button onclick="conferir('${d.id}', true)" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-bold cursor-pointer">✓ É atestado válido</button>
        <button onclick="conferir('${d.id}', false)" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg text-[11px] font-bold cursor-pointer">✕ Não é atestado / ilegível</button>` : '';
      return `<div class="bg-white border ${sitDe(d) === 'PEND' ? 'border-amber-300' : sitDe(d) === 'INVALIDO' ? 'border-rose-300' : 'border-slate-200'} rounded-xl p-4 shadow-sm">
        <div class="flex flex-col md:flex-row justify-between gap-3">
          <div class="space-y-1 text-xs min-w-0">
            <div class="flex flex-wrap items-center gap-2"><span class="bg-slate-800 text-white px-2 py-0.5 rounded text-[10px] font-bold">${esc(d.nome_loja || 'sem loja')}</span>
              <span class="${s.cls} px-2 py-0.5 rounded text-[10px] font-bold">${s.txt}</span></div>
            <div class="text-base font-black text-slate-900">${esc(d.nome_registro)}</div>
            <div class="text-[11px]">${origem}</div>
            <div class="text-[10px] text-slate-500">📎 anexado em ${dataHora(d.enviado_em)} por ${esc(d.enviado_por || '')}${d.conferido_em ? ` · conferido em <b>${dataHora(d.conferido_em)}</b> por ${esc(d.conferido_por)}` : ''}</div>
            ${auto}
            ${d.conferencia_obs ? `<div class="text-[11px] ${d.conferencia_status === 'INVALIDO' ? 'text-rose-700 font-bold' : 'text-slate-700'}">Conferência: ${esc(d.conferencia_obs)}</div>` : ''}
            ${hist ? `<details class="text-[10px] text-slate-500"><summary class="cursor-pointer">histórico (${(d.conferencia_historico || []).length})</summary>${hist}</details>` : ''}
          </div>
          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <button onclick="abrir('${esc(d.arquivo_path)}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-[11px] font-bold cursor-pointer">👁 Abrir documento</button>
            ${acoes}
          </div>
        </div></div>`;
    }

    async function abrir(caminho) {
      const { data, error } = await _supabase.storage.from('documentos').createSignedUrl(caminho, 120);
      if (error) return alert('Não foi possível abrir: ' + error.message);
      window.open(data.signedUrl, '_blank');
    }

    async function conferir(id, valido) {
      const d = docs.find(x => x.id === id);
      let obs = null;
      if (valido) {
        if (!confirm(`Confirmar que o documento de ${d.nome_registro} é um ATESTADO VÁLIDO?`)) return;
        obs = await pedirTexto('Observação (opcional):', '') ?? null; if (obs === null) return;
      } else {
        obs = await pedirTexto('O que há de errado? (ex.: não é atestado, ilegível, data não confere)'); if (!obs) return;
      }
      const { error } = await _supabase.rpc('fn_atestado_conferir', { p_id: id, p_valido: valido, p_obs: obs.trim() || null });
      if (error) return alert(error.message);
      await carregar();
    }

    inicializar();
  </script>
</body>
</html>
