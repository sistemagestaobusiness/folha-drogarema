<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conciliação bancária - Business</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fin_estilo.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="acesso.js"></script>
  <style>
    .filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .filtros label { display: flex; flex-direction: column; gap: 4px; }
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
    .kpis .v { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; margin-top: 4px; }
    .abas { display: flex; gap: 4px; border-bottom: 1px solid var(--borda); padding: 0 12px; flex-wrap: wrap; }
    .abas button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--sub); padding: 10px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
    .abas button.on { color: var(--txt); border-bottom-color: var(--ouro); }
    .abas .q { font-size: 11px; background: var(--cinza-bg); color: var(--cinza-tx); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
    .abas .q.crit { background: var(--verm-bg); color: var(--verm-tx); }
    .t td { vertical-align: top; }
    .t td .mini { font-size: 11.5px; color: var(--sub); }
    .painel { background: #FAFBFC; border-top: 1px solid var(--linha); padding: 10px 16px 12px; }
    .painel .t td { background: #fff; }
    .acoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .btn.p { min-height: 28px; font-size: 12px; padding: 0 9px; }
    .ok { color: var(--verde-tx); }
    @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div class="cab">
    <div>
      <div class="sub">Saídas do extrato × baixas do contas a pagar do Alpha7 · só consulta: toda correção é feita no Alpha7 e entra na próxima carga</div>
      <h1>Conciliação bancária</h1>
    </div>
    <div class="filtros">
      <label class="desc">De <input id="fIni" type="date" class="inp"></label>
      <label class="desc">Até <input id="fFim" type="date" class="inp"></label>
      <label class="desc">Conta <select id="fConta" class="inp" style="min-width: 240px"></select></label>
      <button class="btn e" onclick="carregar()">Atualizar</button>
    </div>
  </div>
  <div id="aviso" class="alerta verm"></div>

  <div class="kpis" id="kpis"></div>

  <section class="card" style="overflow: hidden">
    <div class="abas" id="abas"></div>
    <div class="rola" id="lista"></div>
  </section>

  <script>
    const _supabase = supabase.createClient('https://jmetpmdnaxwabeccimgg.supabase.co', 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k');
    const $ = id => document.getElementById(id);
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const brl = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const dbr = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '-';
    const isoDe = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const somaDia = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDe(d); };
    const difDias = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
    const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
    const r2 = v => Math.round(Number(v || 0) * 100) / 100;
    const ROT = { RETIRADA: 'retirada da baixa (conta e valor)', EXATO: 'mesmo dia e valor', AGRUPADO: 'várias NFs num pagamento', DATA: 'data da baixa diferente', CONTA: 'conta diferente na baixa', };
    let grupo = { raizes: [], nomes: [] }, creditos = [], contas = [], saidas = [], titulos = [], pendentes = [], conc = [], res = null, aba = 'pend', aberto = null, email = '';

    function aviso(t) { $('aviso').innerHTML = t ? `<span class="ponto"></span><span>${t}</span>` : ''; $('aviso').style.display = t ? 'flex' : 'none'; }
    async function tudo(q) { let out = [], de = 0; for (;;) { const { data, error } = await q().range(de, de + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) return out; de += 1000; } }

    // chaves estáveis (as tabelas são trocadas a cada carga, os ids mudam)
    const chaveTit = t => [t.credor, t.documento, t.parcela, t.vencimento, r2(t.valor).toFixed(2)].map(x => x ?? '').join('|');

    async function inicio() {
      const { data: { user } } = await _supabase.auth.getUser(); email = (user && user.email || '').toLowerCase();
      const hoje = isoDe(new Date()); $('fIni').value = hoje.slice(0, 8) + '01'; $('fFim').value = somaDia(hoje, -1) < $('fIni').value ? hoje : somaDia(hoje, -1);
      const { data, error } = await _supabase.from('fin_contas').select('*').order('ordem');
      if (error) return aviso('Não foi possível carregar as contas: ' + esc(error.message));
      contas = data;
      $('fConta').innerHTML = '<option value="">Todas as contas da Drogarema</option><option value="*">Todas, inclusive outras empresas</option>'
        + contas.map(c => `<option value="${esc(c.conta)}">${esc(c.nome || c.conta)}${c.empresa ? ' · ' + esc(c.empresa) : ''}${c.ativa === false ? ' (cancelada)' : ''}</option>`).join('');
      carregar();
    }

    async function carregar() {
      aviso(''); $('lista').innerHTML = '<div class="desc" style="padding: 14px 16px">Carregando…</div>';
      const ini = $('fIni').value, fim = $('fFim').value;
      if (!ini || !fim || fim < ini) { aviso('Informe o período (a data final não pode ser antes da inicial).'); $('lista').innerHTML = ''; return; }
      if (difDias(fim, ini) > 92) { aviso('Período máximo de 3 meses por consulta.'); $('lista').innerHTML = ''; return; }
      try {
        const [exTodo, cfgD, tp, tpend, foraL] = await Promise.all([
          tudo(() => _supabase.from('fin_extrato').select('id, data, conta, valor, descricao, documento, movimentacao').gte('data', somaDia(ini, -2)).lte('data', somaDia(fim, 2)).order('data').order('id')),
          _supabase.from('fin_config').select('valor').eq('chave', 'conc_grupo').maybeSingle(),
          tudo(() => _supabase.from('fin_cp').select('*').eq('status', 'Paga').gte('pagamento', somaDia(ini, -7)).lte('pagamento', somaDia(fim, 7)).order('pagamento').order('id')),
          tudo(() => _supabase.from('fin_cp').select('*').eq('status', 'Pendente').gte('venc_util', somaDia(ini, -20)).lte('venc_util', somaDia(fim, 10)).order('venc_util').order('id')),
          tudo(() => _supabase.from('fin_categorias').select('plano').eq('fora_do_fluxo', true).order('plano'))]);
        const fora = new Set(foraL.map(c => c.plano));   // ex.: notas fiscais de despesa externas: não sai dinheiro
        // tipos de movimentação do Alpha7 que não têm título (transferência entre contas e empresas do grupo, aplicação)
        // empresas do grupo: raiz do CNPJ (8 dígitos) e nomes (Drogarema, Monarca, Chilon, Pegasus…) · fin_config 'conc_grupo'
        const cg = (cfgD && cfgD.data && cfgD.data.valor) || {};
        grupo = { raizes: (cg.raizes || ['12003055']).map(x => String(x).replace(/\D/g, '')).filter(x => x.length === 8),
                  nomes: (cg.nomes || ['DROGAREMA']).map(norm).filter(Boolean) };
        creditos = exTodo.filter(e => e.valor > 0).map(e => ({ ...e, v: r2(e.valor) }));
        const ex = exTodo.filter(e => e.valor < 0 && e.data >= ini && e.data <= fim);
        // ordinal para débitos repetidos (mesmo dia, conta, valor, documento e histórico)
        const cont = {};
        saidas = ex.map(e => { const base = [e.data, e.conta, r2(-e.valor).toFixed(2), e.documento || '', String(e.descricao || '').slice(0, 40)].join('|');
          cont[base] = (cont[base] || 0) + 1; return { ...e, v: r2(-e.valor), chave: base + '#' + cont[base] }; });
        titulos = tp.filter(t => !fora.has(t.plano)).map(t => ({ ...t, v: r2(t.valor), conta: String(t.conta_pagadora || '').toUpperCase(), chave: chaveTit(t) }));
        pendentes = tpend.filter(t => !fora.has(t.plano)).map(t => ({ ...t, v: r2(t.valor), chave: chaveTit(t) }));
        conc = []; aberto = null;
        conciliar(ini, fim); desenhar();
      } catch (e) { aviso('Não foi possível carregar: ' + esc(e.message || e)); $('lista').innerHTML = ''; }
    }

    function conciliar(ini, fim) {
      const f = $('fConta').value, fluxo = new Set(contas.filter(c => c.no_fluxo).map(c => c.conta));
      const naConta = c => f === '*' ? true : f ? c === f : fluxo.has(c);
      const usadoT = new Set(), usadoE = new Set(), pares = [];
      const porChaveT = {}; titulos.forEach(t => (porChaveT[t.chave] = porChaveT[t.chave] || []).push(t));
      const pegaT = ch => (porChaveT[ch] || []).find(t => !usadoT.has(t.id));
      const S = saidas;   // conciliação é feita com todas as contas; o filtro só muda o que aparece
      // 0. vínculos manuais e justificativas
      const just = [];
      conc.forEach(c => {
        const es = (c.extrato_chaves || []).map(k => S.find(e => e.chave === k && !usadoE.has(e.id))).filter(Boolean);
        if (c.tipo === 'SEM_TITULO') { es.forEach(e => { usadoE.add(e.id); just.push({ e, c }); }); return; }
        const ts = (c.cp_chaves || []).map(pegaT).filter(Boolean);
        if (!es.length) return;
        es.forEach(e => usadoE.add(e.id)); ts.forEach(t => usadoT.add(t.id));
        pares.push({ es, ts, tipo: 'MANUAL', c });
      });
      // 0b. retiradas da baixa (22/10/2026): o Alpha7 diz quanto saiu de cada conta em cada pagamento ("Retiradas Pagamento").
      //     Cada retirada (conta + dia + valor) casa com um débito ou com a soma de débitos da conta no dia (ex.: folha da loja em vários débitos).
      const porPag = {}; titulos.forEach(t => { if (t.codigo_pagamento && Array.isArray(t.retiradas) && t.retiradas.length) (porPag[t.codigo_pagamento + '|' + t.pagamento] = porPag[t.codigo_pagamento + '|' + t.pagamento] || []).push(t); });
      Object.values(porPag).forEach(ts => {
        const livres = ts.filter(t => !usadoT.has(t.id)); if (!livres.length) return;
        const ret = livres[0].retiradas, dia = livres[0].pagamento, es = [];
        ret.forEach(r => { const conta = String(r.conta || '').toUpperCase(), v = r2(r.valor);
          const cand = S.filter(e => !usadoE.has(e.id) && !es.includes(e) && e.conta === conta && e.data === dia);
          const um = cand.find(e => Math.abs(e.v - v) < 0.01);
          const achou = um ? [um] : cand.length > 1 && cand.length <= 14 ? subconjunto(cand, v) : null;
          if (achou) es.push(...achou); });
        if (es.length) { es.forEach(e => usadoE.add(e.id)); livres.forEach(t => usadoT.add(t.id)); pares.push({ es, ts: livres, tipo: 'RETIRADA' }); }
      });
      // índices
      const idx = {}; titulos.forEach(t => { const k = t.conta + '|' + t.pagamento + '|' + t.v.toFixed(2); (idx[k] = idx[k] || []).push(t); });
      // 1. mesmo dia, conta e valor
      S.forEach(e => { if (usadoE.has(e.id)) return; const t = (idx[e.conta + '|' + e.data + '|' + e.v.toFixed(2)] || []).find(x => !usadoT.has(x.id));
        if (t) { usadoE.add(e.id); usadoT.add(t.id); pares.push({ es: [e], ts: [t], tipo: 'EXATO' }); } });
      // 2. várias NFs num pagamento: mesmo dia, conta e fornecedor
      S.forEach(e => { if (usadoE.has(e.id)) return;
        const grupos = {}; titulos.forEach(t => { if (!usadoT.has(t.id) && t.conta === e.conta && t.pagamento === e.data) (grupos[t.credor] = grupos[t.credor] || []).push(t); });
        for (const cr in grupos) { const l = grupos[cr]; let achou = null;
          if (l.length > 1 && Math.abs(l.reduce((a, t) => a + t.v, 0) - e.v) < 0.02) achou = l;
          else if (l.length > 1 && l.length <= 12) achou = subconjunto(l, e.v);
          if (achou) { usadoE.add(e.id); achou.forEach(t => usadoT.add(t.id)); pares.push({ es: [e], ts: achou, tipo: 'AGRUPADO' }); break; } } });
      // 3. mesma conta e valor, baixa até 3 dias antes ou depois
      S.forEach(e => { if (usadoE.has(e.id)) return;
        const t = titulos.filter(x => !usadoT.has(x.id) && x.conta === e.conta && Math.abs(x.v - e.v) < 0.01 && Math.abs(difDias(x.pagamento, e.data)) <= 3)
          .sort((a, b) => Math.abs(difDias(a.pagamento, e.data)) - Math.abs(difDias(b.pagamento, e.data)))[0];
        if (t) { usadoE.add(e.id); usadoT.add(t.id); pares.push({ es: [e], ts: [t], tipo: 'DATA' }); } });
      // 4. mesmo dia e valor, conta diferente na baixa
      S.forEach(e => { if (usadoE.has(e.id)) return;
        const t = titulos.find(x => !usadoT.has(x.id) && x.pagamento === e.data && Math.abs(x.v - e.v) < 0.01);
        if (t) { usadoE.add(e.id); usadoT.add(t.id); pares.push({ es: [e], ts: [t], tipo: 'CONTA' }); } });
      // sem título por natureza: classificado no Alpha7 (Tipo Movimentação) ou transferência casada com um crédito de outra conta própria
      const contasProprias = new Set(contas.map(c => c.conta)), usadoC = new Set(), natureza = [];
      S.forEach(e => { if (usadoE.has(e.id)) return;
        const d = norm(e.descricao), mov = norm(e.movimentacao);
        if (/SALARIO|FOLHA/.test(d) || /SALARIO/.test(mov)) return;            // folha sempre precisa de título
        // 1. aplicação / resgate
        if (mov === 'APLICACAO' || /\bAPLIC/.test(d)) { usadoE.add(e.id); natureza.push({ e, motivo: 'aplicação financeira' }); return; }
        // 2. transferência casada: crédito do mesmo valor em outra conta do grupo (mesmo dia ou no seguinte)
        const cr = creditos.find(c => !usadoC.has(c.id) && c.conta !== e.conta && contasProprias.has(c.conta) && Math.abs(c.v - e.v) < 0.01 && difDias(c.data, e.data) >= 0 && difDias(c.data, e.data) <= 1);
        // o histórico traz o nome de quem recebeu e não é do grupo (ex.: "PIX ENVIADO ULTRAFARMA"): não é transferência interna
        const dest = (d.match(/PIX ENVIADO\s+(?:\d+\s+)?([A-Z][A-Z ]{3,})/) || [])[1];
        const destFora = dest && !grupo.nomes.some(n => dest.includes(n));
        if (cr && !destFora) { usadoC.add(cr.id); usadoE.add(e.id); natureza.push({ e, motivo: 'transferência para ' + ((contas.find(c => c.conta === cr.conta) || {}).nome || cr.conta) + ' (crédito no extrato)', cr }); return; }
        // 3. destino do grupo no histórico do extrato: CNPJ ou nome de empresa do grupo
        const txtD = String(e.descricao || '') + ' ' + String(e.documento || ''), dd = norm(txtD);   // o PIX traz CNPJ e nome no documento
        const raiz = grupo.raizes.find(r => new RegExp('(^|\\D)' + r).test(txtD.replace(/[.\/-]/g, '')));
        const nome = grupo.nomes.find(n => new RegExp('(^|[^A-Z])' + n + '([^A-Z]|$)').test(dd));
        if (raiz || nome) { usadoE.add(e.id); natureza.push({ e, motivo: 'transferência para empresa do grupo (' + (nome || 'CNPJ ' + raiz) + ' no histórico)' }); return; }
        // classificado como transferência no Alpha7, mas o destino não é do grupo: continua exigindo título
        if (/TRANSFERENCIA ENTRE CONTAS/.test(mov)) e.avisoTransf = true; });
      // encontro de contas (22/10/2026): títulos EM ABERTO da empresa com vencimento no dia × débitos do extrato sem título nesse dia.
      // Se uma parte dos títulos soma o mesmo que uma parte dos débitos, o pagamento saiu do banco e falta só a baixa no Alpha7.
      // 1ª volta: só contas da própria empresa · 2ª volta: inclui débito de folha de outra conta (ex.: parte da loja 3 paga pela conta da loja 1)
      const encontro = [], usadoP = new Set(), empresaDe = k => (contas.find(c => c.conta === k) || {}).empresa || '';
      const gruposP = {}; pendentes.forEach(p => { const k = String(p.unidade || '') + '|' + p.venc_util; (gruposP[k] = gruposP[k] || []).push(p); });
      const somasTit = l => { const m = new Map(), n = Math.min(l.length, 10);
        for (let b = 1; b < (1 << n); b++) { let v = 0; const ts = []; for (let i = 0; i < n; i++) if (b & (1 << i)) { v += l[i].v; ts.push(l[i]); } const k = r2(v).toFixed(2); if (!m.has(k)) m.set(k, ts); } return m; };
      const tentar = (k, cand) => {
        const ls = gruposP[k].filter(p => !usadoP.has(p.id)); if (!ls.length || !cand.length) return;
        const totG = ls.reduce((a, p) => a + p.v, 0), mapa = somasTit(ls.sort((a, b) => b.v - a.v)), c = cand.filter(e => e.v <= totG + 0.01).sort((a, b) => b.v - a.v).slice(0, 16);
        let melhor = null;
        for (let b = 1; b < (1 << c.length); b++) { let v = 0; for (let i = 0; i < c.length; i++) if (b & (1 << i)) v += c[i].v;
          const ts = mapa.get(r2(v).toFixed(2)); if (ts && (!melhor || v > melhor.v)) melhor = { v, b, ts }; }
        if (!melhor) return;
        const es = c.filter((_, i) => melhor.b & (1 << i));
        es.forEach(e => usadoE.add(e.id)); melhor.ts.forEach(t => usadoP.add(t.id));
        encontro.push({ es, ts: melhor.ts, unidade: k.split('|')[0], data: k.split('|')[1] });
      };
      const chavesP = Object.keys(gruposP).filter(k => k.split('|')[1] >= ini && k.split('|')[1] <= fim);
      const livresDia = (dia, filtro) => S.filter(e => !usadoE.has(e.id) && e.data === dia && filtro(e));
      chavesP.forEach(k => { const [u, dia] = k.split('|'); tentar(k, livresDia(dia, e => empresaDe(e.conta) === u)); });
      chavesP.forEach(k => { const [u, dia] = k.split('|'); tentar(k, livresDia(dia, e => empresaDe(e.conta) === u || /SALARIO|FOLHA/.test(norm(e.descricao)) || /SALARIO/.test(norm(e.movimentacao)))); });
      // pendências
      const semTit = S.filter(e => !usadoE.has(e.id)).map(e => ({ e,
        sugestao: pendentes.filter(p => Math.abs(p.v - e.v) < 0.01 && Math.abs(difDias(p.venc_util, e.data)) <= 15)
          .sort((a, b) => Math.abs(difDias(a.venc_util, e.data)) - Math.abs(difDias(b.venc_util, e.data)))[0] || null }));
      const semSaida = titulos.filter(t => !usadoT.has(t.id) && t.pagamento >= ini && t.pagamento <= fim && !/CAIXA|DINHEIRO|ESPECIE/.test(norm(t.conta)));
      const vis = x => naConta(x.e ? x.e.conta : x.es ? x.es[0].conta : x.conta);
      res = { pares: pares.filter(vis), semTit: semTit.filter(vis), encontro: encontro.filter(x => naConta(x.es[0].conta)), just: just.filter(vis), natureza: natureza.filter(vis),
              semSaida: semSaida.filter(t => f === '*' || !t.conta || (f ? t.conta === f : fluxo.has(t.conta) || !contas.some(c => c.conta === t.conta))),
              total: S.filter(e => naConta(e.conta)) };
    }
    function subconjunto(l, alvo) {
      for (let n = l.length - 1; n >= 2; n--) { const r = comb(l, n, alvo); if (r) return r; }
      return null;
    }
    function comb(l, n, alvo, ini = 0, acc = [], soma = 0) {
      if (acc.length === n) return Math.abs(soma - alvo) < 0.02 ? [...acc] : null;
      for (let i = ini; i <= l.length - (n - acc.length); i++) { acc.push(l[i]); const r = comb(l, n, alvo, i + 1, acc, soma + l[i].v); acc.pop(); if (r) return r; }
      return null;
    }

    function desenhar() {
      const R = res, tot = R.total.reduce((a, e) => a + e.v, 0);
      const vConc = R.pares.reduce((a, p) => a + p.es.reduce((b, e) => b + e.v, 0), 0), vJust = R.natureza.reduce((a, j) => a + j.e.v, 0);
      const vSem = R.semTit.reduce((a, x) => a + x.e.v, 0), nSug = R.semTit.filter(x => x.sugestao).length;
      const vEnc = R.encontro.reduce((a, x) => a + x.es.reduce((b, e) => b + e.v, 0), 0), nEnc = R.encontro.reduce((a, x) => a + x.ts.length, 0);
      const pc = tot ? (vConc + vJust) / tot * 100 : 0;   // "falta baixar" não conta como conciliado: o título ainda está em aberto
      $('kpis').innerHTML = `
        <div class="card p"><div class="desc">Saídas no extrato</div><div class="v">${brl(tot)}</div><div class="desc">${R.total.length} débito(s)</div></div>
        <div class="card p"><div class="desc">Conciliado</div><div class="v ok">${pc.toFixed(1).replace('.', ',')}%</div><div class="desc">${brl(vConc + vJust)} · ${R.pares.length + R.natureza.length} débito(s)</div></div>
        <div class="card p"><div class="desc">Saídas sem título baixado</div><div class="v" style="color: var(--verm)">${brl(vSem)}</div><div class="desc">${R.semTit.length} débito(s)</div></div>
        <div class="card p"><div class="desc">Falta baixar no Alpha7</div><div class="v" style="color: ${nEnc + nSug ? '#B54708' : 'inherit'}">${brl(vEnc + R.semTit.filter(x => x.sugestao).reduce((a, x) => a + x.e.v, 0))}</div><div class="desc">${nEnc + nSug} título(s) em aberto já pagos pelo extrato</div></div>
        <div class="card p"><div class="desc">Títulos pagos sem saída no extrato</div><div class="v">${brl(R.semSaida.reduce((a, t) => a + t.v, 0))}</div><div class="desc">${R.semSaida.length} título(s)</div></div>`;
      const ab = [['pend', 'Saídas sem título', R.semTit.length, true], ['baixar', 'Falta baixar no Alpha7', R.encontro.length + nSug, true], ['semsaida', 'Títulos sem saída', R.semSaida.length, false],
                  ['conc', 'Conciliados', R.pares.length, false], ['nat', 'Sem título por natureza', R.natureza.length, false]];
      $('abas').innerHTML = ab.map(([k, n, q, crit]) => `<button class="${aba === k ? 'on' : ''}" onclick="aba='${k}'; aberto=null; desenhar()">${n}<span class="q ${crit && q ? 'crit' : ''}">${q}</span></button>`).join('');
      $('lista').innerHTML = aba === 'baixar' ? listaBaixar() : aba === 'pend' ? listaPend() : aba === 'semsaida' ? listaSemSaida() : aba === 'conc' ? listaConc() : listaNat();
    }
    const nomeConta = k => { const c = contas.find(x => x.conta === k); return esc(c ? (c.nome || c.conta) + (c.empresa ? ' · ' + c.empresa : '') : k || '(sem conta na baixa)'); };

    function listaPend() {
      const L = res.semTit; if (!L.length) return '<div class="desc" style="padding: 14px 16px">Nenhuma saída sem título neste filtro. ✓</div>';
      return `<table class="t" style="min-width: 980px"><thead><tr><th>Dia</th><th>Conta</th><th>Histórico do extrato</th><th class="n">Valor</th><th>O que fazer no Alpha7</th></tr></thead><tbody>` + L.map((x, i) => {
        const e = x.e, folha = /SAL[AÁ]RIO|FOLHA|FOPAG|PAGTO? FUNC|REMUNERA/i.test(e.descricao || '');
        const sit = x.sugestao ? `<span class="pill p-aten">título em aberto no Alpha7</span><div class="mini">${esc(x.sugestao.credor)} · doc ${esc(x.sugestao.documento || '-')} · venc. ${dbr(x.sugestao.venc_util)} · dar baixa no Alpha7 e subir o arquivo</div>`
          : folha ? `<span class="pill p-crit">folha sem título</span><div class="mini">lançar o título da folha e dar baixa nesta conta e data</div>`
          : e.avisoTransf ? '<span class="pill p-crit">transferência para fora do grupo</span><div class="mini">classificado como "Transferência entre Contas" no Alpha7, mas o destino não é empresa do grupo: se for pagamento, lançar o título e dar baixa</div>'
          : '<span class="pill p-crit">sem título baixado</span><div class="mini">lançar ou localizar o título e dar baixa nesta conta, data e valor</div>';
        let h = `<tr><td>${dbr(e.data)}</td><td>${nomeConta(e.conta)}</td><td>${esc(e.descricao || '')}${e.documento ? `<div class="mini">doc ${esc(e.documento)}</div>` : ''}</td><td class="n">${brl(e.v)}</td><td>${sit}</td></tr>`;
        return h; }).join('') + '</tbody></table>';
    }
    function listaBaixar() {
      const sug = res.semTit.filter(x => x.sugestao);
      if (!res.encontro.length && !sug.length) return '<div class="desc" style="padding: 14px 16px">Nenhum título em aberto com pagamento já no extrato. ✓</div>';
      return `<div class="desc" style="padding: 10px 16px 0">O dinheiro já saiu da conta (extrato) e o título continua <b>em aberto</b> no Alpha7: dar baixa nos títulos abaixo, na conta e na data do débito, e importar o arquivo de novo.</div>
        <table class="t" style="min-width: 980px"><thead><tr><th>Dia</th><th>Empresa</th><th>Título(s) em aberto no Alpha7</th><th class="n">Títulos</th><th>Débito(s) no extrato</th><th class="n">Extrato</th></tr></thead><tbody>`
        + res.encontro.map(x => `<tr><td>${dbr(x.data)}</td><td>${esc(x.unidade)}</td>
            <td>${x.ts.map(t => `<div>${esc(t.descricao || t.credor)} · <span class="mono">${brl(t.v)}</span></div>`).join('')}</td><td class="n">${brl(x.ts.reduce((a, t) => a + t.v, 0))}</td>
            <td>${x.es.map(e => `<div>${nomeConta(e.conta)} · ${esc(e.descricao || '')} · <span class="mono">${brl(e.v)}</span></div>`).join('')}</td><td class="n">${brl(x.es.reduce((a, e) => a + e.v, 0))}</td></tr>`).join('')
        + sug.map(x => `<tr><td>${dbr(x.e.data)}</td><td>${esc(x.sugestao.unidade || '')}</td><td><div>${esc(x.sugestao.descricao || x.sugestao.credor)} · venc. ${dbr(x.sugestao.venc_util)}</div></td><td class="n">${brl(x.sugestao.v)}</td>
            <td><div>${nomeConta(x.e.conta)} · ${esc(x.e.descricao || '')}</div></td><td class="n">${brl(x.e.v)}</td></tr>`).join('') + '</tbody></table>';
    }
    function listaSemSaida() {
      const L = res.semSaida; if (!L.length) return '<div class="desc" style="padding: 14px 16px">Todos os títulos pagos no mês têm saída no extrato. ✓</div>';
      return `<div class="desc" style="padding: 10px 16px 0">Título baixado no Alpha7 sem débito correspondente nas contas: corrigir no Alpha7 a data ou a conta da baixa (ou conferir se foi pago em dinheiro ou por conta que não está no sistema).</div>
        <table class="t" style="min-width: 900px"><thead><tr><th>Baixa</th><th>Fornecedor</th><th>Documento</th><th>Conta da baixa</th><th>Unidade</th><th class="n">Valor</th></tr></thead><tbody>`
        + L.map(t => `<tr><td>${dbr(t.pagamento)}</td><td>${esc(t.credor)}</td><td>${esc(t.documento || '-')}${t.parcela ? ' · ' + esc(t.parcela) : ''}</td><td>${nomeConta(t.conta)}</td><td>${esc(t.unidade || '')}</td><td class="n">${brl(t.v)}</td></tr>`).join('') + '</tbody></table>';
    }
    function listaConc() {
      const L = res.pares; if (!L.length) return '<div class="desc" style="padding: 14px 16px">Nada conciliado neste filtro.</div>';
      return `<table class="t" style="min-width: 980px"><thead><tr><th>Dia</th><th>Conta</th><th>Histórico do extrato</th><th class="n">Débito</th><th>Título(s) no Alpha7</th><th>Como</th></tr></thead><tbody>`
        + L.map(p => { const e = p.es[0];
          return `<tr><td>${dbr(e.data)}</td><td>${nomeConta(e.conta)}</td><td>${esc(e.descricao || '')}</td><td class="n">${brl(p.es.reduce((a, x) => a + x.v, 0))}</td>
            <td>${p.ts.map(t => `<div>${esc(t.credor)} · ${esc(t.documento || '-')} · <span class="mono">${brl(t.v)}</span>${t.pagamento !== e.data ? ` · baixa ${dbr(t.pagamento)}` : ''}</div>`).join('') || '<span class="desc">-</span>'}
              ${p.c && p.c.obs ? `<div class="mini">obs.: ${esc(p.c.obs)}</div>` : ''}</td>
            <td><span class="pill ${p.tipo === 'EXATO' || p.tipo === 'AGRUPADO' || p.tipo === 'RETIRADA' ? 'p-ok' : p.tipo === 'MANUAL' ? 'p-info' : 'p-aten'}">${ROT[p.tipo]}</span>${p.c ? `<div class="mini">${esc(p.c.por || '')}</div>` : ''}</td>
</tr>`; }).join('') + '</tbody></table>';
    }
    function listaNat() {
      const L = res.natureza; if (!L.length) return '<div class="desc" style="padding: 14px 16px">Nenhuma saída sem título por natureza neste filtro.</div>';
      return `<div class="desc" style="padding: 10px 16px 0">Saídas em que não perdemos dinheiro, por isso não têm título: transferência entre contas e empresas do grupo (Drogarema, Monarca, Chilon, Pegasus…) e aplicação. Entram aqui quando há um crédito do mesmo valor em outra conta do grupo, quando o histórico do extrato traz o CNPJ ou o nome de uma empresa do grupo, ou quando é aplicação. A classificação \"Transferência entre Contas\" do Alpha7, sozinha, não basta.</div>
        <table class="t" style="min-width: 900px"><thead><tr><th>Dia</th><th>Conta</th><th>Histórico do extrato</th><th class="n">Valor</th><th>Por quê</th></tr></thead><tbody>`
        + L.map(j => `<tr><td>${dbr(j.e.data)}</td><td>${nomeConta(j.e.conta)}</td><td>${esc(j.e.descricao || '')}</td><td class="n">${brl(j.e.v)}</td><td>${esc(j.motivo)}</td></tr>`).join('') + '</tbody></table>';
    }
    $('fConta').addEventListener('change', () => { if (res) { conciliar($('fIni').value, $('fFim').value); desenhar(); } });
    inicio();
  </script>
</body>
</html>
