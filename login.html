<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Drogarema</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <!-- Redireciona se já estiver autenticado -->
  <script>
    if (localStorage.getItem('usuario_drogarema')) {
      window.location.href = 'index.html';
    }
  </script>

  <div class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white tracking-wide">SISTEMA DROGAREMA</h1>
      <p id="subtituloTopo" class="text-xs text-slate-400 mt-1">Acesso Restrito ao Módulo de Folha / Gestão</p>
    </div>

    <!-- MODO 1: FORMULÁRIO DE LOGIN NORMAL -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">E-MAIL</label>
        <input type="email" id="email" required placeholder="seuemail@exemplo.com"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">SENHA</label>
        <input type="password" id="senha" required placeholder="••••••••"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <!-- SEGUNDA CAMADA: PIN DE SEGURANÇA ADICIONADO -->
      <div>
        <label class="block text-xs font-semibold text-cyan-400 mb-1">PIN DE SEGURANÇA (2FA)</label>
        <input type="password" id="pinSeguranca" required placeholder="••••"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <button type="submit" id="btnEntrar"
        class="w-full bg-cyan-600 hover:bg-cyan-500 disabled:bg-slate-700 text-white font-bold py-2.5 rounded transition text-sm mt-2 flex justify-center items-center cursor-pointer">
        <span>ENTRAR NO SISTEMA</span>
      </button>
    </form>

    <!-- MODO 2: FORMULÁRIO DE RECUPERAÇÃO DE SENHA -->
    <form id="recuperarForm" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">E-MAIL CADASTRADO</label>
        <input type="email" id="emailRecuperar" required placeholder="seuemail@exemplo.com"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>
      <p class="text-[11px] text-slate-400">Enviaremos um link de recuperação para o seu e-mail.</p>

      <button type="submit" id="btnRecuperar"
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded transition text-sm mt-2 flex justify-center items-center cursor-pointer">
        <span>ENVIAR LINK DE RECUPERAÇÃO</span>
      </button>
    </form>

    <!-- MODO 3: FORMULÁRIO DE TROCA DE SENHA (PRIMEIRO ACESSO) -->
    <form id="primeiroAcessoForm" class="space-y-3 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">E-MAIL</label>
        <input type="email" id="emailPrimeiro" required placeholder="seuemail@exemplo.com"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">SENHA TEMPORÁRIA (ATUAL)</label>
        <input type="password" id="senhaTemp" required placeholder="••••••••"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">NOVA SENHA PESSOAL</label>
        <input type="password" id="novaSenha" required placeholder="Mínimo 6 caracteres"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>

      <button type="submit" id="btnTrocar"
        class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded transition text-sm mt-2 flex justify-center items-center cursor-pointer">
        <span>SALVAR NOVA SENHA</span>
      </button>
    </form>

    <!-- Links de Navegação entre os Modos -->
    <div class="mt-5 pt-4 border-t border-slate-700 flex flex-col sm:flex-row justify-between items-center text-xs gap-2">
      <button onclick="alternarModo('login')" id="linkLogin" class="text-cyan-400 hover:underline hidden cursor-pointer">← Voltar ao Login</button>
      <button onclick="alternarModo('recuperar')" id="linkRecuperar" class="text-slate-400 hover:text-cyan-400 cursor-pointer">Esqueceu a senha?</button>
      <button onclick="alternarModo('primeiroAcesso')" id="linkPrimeiro" class="text-slate-400 hover:text-amber-400 cursor-pointer">🔑 Primeiro Acesso / Trocar Senha</button>
    </div>

    <div id="mensagem" class="mt-4 text-center text-xs hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jmetpmdnaxwabeccimgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k';

    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const formLogin = document.getElementById('loginForm');
    const formRecuperar = document.getElementById('recuperarForm');
    const formPrimeiro = document.getElementById('primeiroAcessoForm');
    
    const msg = document.getElementById('mensagem');
    const subtitulo = document.getElementById('subtituloTopo');

    const linkLogin = document.getElementById('linkLogin');
    const linkRecuperar = document.getElementById('linkRecuperar');
    const linkPrimeiro = document.getElementById('linkPrimeiro');

    function alternarModo(modo) {
      msg.classList.add('hidden');
      formLogin.classList.add('hidden');
      formRecuperar.classList.add('hidden');
      formPrimeiro.classList.add('hidden');
      linkLogin.classList.add('hidden');
      linkRecuperar.classList.remove('hidden');
      linkPrimeiro.classList.remove('hidden');

      if (modo === 'login') {
        formLogin.classList.remove('hidden');
        linkLogin.classList.add('hidden');
        subtitulo.innerText = 'Acesso Restrito ao Módulo de Folha / Gestão';
      } else if (modo === 'recuperar') {
        formRecuperar.classList.remove('hidden');
        linkRecuperar.classList.add('hidden');
        linkLogin.classList.remove('hidden');
        subtitulo.innerText = 'Recuperação de Senha por E-mail';
      } else if (modo === 'primeiroAcesso') {
        formPrimeiro.classList.remove('hidden');
        linkPrimeiro.classList.add('hidden');
        linkLogin.classList.remove('hidden');
        subtitulo.innerText = 'Redefinição de Senha no Primeiro Acesso';
      }
    }

    // 1. Ação de Login Normal (Com Validação de E-mail, Senha e PIN)
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnEntrar');
      btn.disabled = true;
      btn.innerText = 'AUTENTICANDO...';
      msg.classList.remove('hidden');
      msg.className = 'mt-4 text-center text-xs text-amber-400 font-semibold';
      msg.innerText = 'Verificando credenciais...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('senha').value;
      const pinDigitado = document.getElementById('pinSeguranca').value.trim();

      // DEFINA AQUI O SEU PIN MESTRE DE SEGURANÇA (Você pode alterar para o número que preferir)
      const PIN_MESTRE_CONFIGURADO = "9876"; 

      if (pinDigitado !== PIN_MESTRE_CONFIGURADO) {
        msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
        msg.innerText = 'PIN de segurança secundário incorreto!';
        btn.disabled = false;
        btn.innerText = 'ENTRAR NO SISTEMA';
        return;
      }

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
          msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
          msg.innerText = error.message.includes('Invalid login credentials') ? 'E-mail ou senha incorretos.' : 'Erro ao entrar: ' + error.message;
          btn.disabled = false;
          btn.innerText = 'ENTRAR NO SISTEMA';
        } else {
          msg.className = 'mt-4 text-center text-xs text-emerald-400 font-semibold';
          msg.innerText = 'Sucesso! Redirecionando...';
          localStorage.setItem('usuario_drogarema', JSON.stringify(data.user));
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        }
      } catch (err) {
        msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
        msg.innerText = 'Falha no sistema: ' + err.message;
        btn.disabled = false;
        btn.innerText = 'ENTRAR NO SISTEMA';
      }
    });

    // 2. Ação de Recuperar Senha por E-mail
    formRecuperar.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRecuperar');
      btn.disabled = true;
      btn.innerText = 'ENVIANDO...';
      msg.classList.remove('hidden');
      msg.className = 'mt-4 text-center text-xs text-amber-400 font-semibold';
      msg.innerText = 'Solicitando recuperação...';

      const email = document.getElementById('emailRecuperar').value.trim();

      try {
        const { error } = await _supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.href,
        });

        if (error) {
          msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
          msg.innerText = 'Erro: ' + error.message;
        } else {
          msg.className = 'mt-4 text-center text-xs text-emerald-400 font-semibold';
          msg.innerText = 'Link enviado! Verifique sua caixa de entrada.';
        }
      } catch (err) {
        msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
        msg.innerText = 'Erro: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = 'ENVIAR LINK DE RECUPERAÇÃO';
      }
    });

    // 3. Ação de Trocar Senha no Primeiro Acesso
    formPrimeiro.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnTrocar');
      btn.disabled = true;
      btn.innerText = 'ALTERANDO...';
      msg.classList.remove('hidden');
      msg.className = 'mt-4 text-center text-xs text-amber-400 font-semibold';
      msg.innerText = 'Validando senha temporária...';

      const email = document.getElementById('emailPrimeiro').value.trim();
      const senhaTemp = document.getElementById('senhaTemp').value;
      const novaSenha = document.getElementById('novaSenha').value;

      if (novaSenha.length < 6) {
        msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
        msg.innerText = 'A nova senha deve ter pelo menos 6 caracteres.';
        btn.disabled = false;
        btn.innerText = 'SALVAR NOVA SENHA';
        return;
      }

      try {
        const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({ email, password: senhaTemp });

        if (authError) {
          msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
          msg.innerText = 'E-mail ou senha temporária incorretos.';
          btn.disabled = false;
          btn.innerText = 'SALVAR NOVA SENHA';
          return;
        }

        const { error: updateError } = await _supabase.auth.updateUser({ password: novaSenha });

        if (updateError) {
          msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
          msg.innerText = 'Erro ao atualizar senha: ' + updateError.message;
          btn.disabled = false;
          btn.innerText = 'SALVAR NOVA SENHA';
        } else {
          msg.className = 'mt-4 text-center text-xs text-emerald-400 font-semibold';
          msg.innerText = 'Senha alterada com sucesso! Entrando no sistema...';
          
          localStorage.setItem('usuario_drogarema', JSON.stringify(authData.user));
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        }
      } catch (err) {
        msg.className = 'mt-4 text-center text-xs text-rose-500 font-semibold';
        msg.innerText = 'Erro: ' + err.message;
        btn.disabled = false;
        btn.innerText = 'SALVAR NOVA SENHA';
      }
    });
  </script>

  <!-- Script de Bloqueio por Inatividade (Ex: 15 minutos) -->
  <script>
    let tempoInatividade;
    const TEMPO_LIMITE = 15 * 60 * 1000; // 15 minutos em milissegundos

    function resetarTemporizador() {
      clearTimeout(tempoInatividade);
      tempoInatividade = setTimeout(fazerLogoutPorInatividade, TEMPO_LIMITE);
    }

    function fazerLogoutPorInatividade() {
      localStorage.removeItem('usuario_drogarema');
      alert('Sessão expirada por inatividade. Faça login novamente.');
      window.location.href = 'login.html';
    }

    window.onload = resetarTemporizador;
    window.onmousemove = resetarTemporizador;
    window.onkeypress = resetarTemporizador;
    window.onclick = resetarTemporizador;
    window.onscroll = resetarTemporizador;
  </script>
</body>
</html>
