<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação de Freelance - Líder</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6 font-sans">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <div class="sticky top-0 z-50 bg-slate-100/95 backdrop-blur-sm py-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-xs">
      <div>
        <h1 class="text-xl font-bold text-slate-900 tracking-wide">SOLICITAÇÃO DE FREELANCE</h1>
        <p class="text-xs text-slate-500">Módulo do Líder - Agendamento de Plantões e Coberturas</p>
      </div>
      <div>
        <a href="index.html" class="px-3 py-1.5 bg-white hover:bg-slate-50 text-slate-700 rounded-lg font-bold text-xs transition border border-slate-300 shadow-2xs">← PAINEL PRINCIPAL</a>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- COLUNA ESQUERDA: Formulário -->
      <div class="lg:col-span-4 bg-white border border-slate-200 rounded-xl p-6 space-y-4 shadow-sm h-fit">
        <h2 class="font-bold text-indigo-700 text-sm border-b border-slate-100 pb-2">NOVA SOLICITAÇÃO</h2>

        <form id="formFreelance" onsubmit="salvarSolicitacao(event)" class="space-y-4">
          
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Colaborador / Freelancer *</label>
            <select id="selectFuncionario" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-800 text-xs focus:outline-none focus:border-indigo-600 font-bold uppercase">
              <option value="">-- CARREGANDO... --</option>
            </select>
          </div>

          <!-- Múltiplas Datas -->
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
            <label class="block text-xs font-bold text-slate-600 uppercase">Datas do Serviço *</label>
            <div class="flex gap-2">
              <input type="date" id="inputDataTemp" class="w-full bg-white border border-slate-300 rounded p-2 text-slate-800 text-sm focus:outline-none focus:border-indigo-600 font-mono">
              <button type="button" onclick="adicionarData()" class="bg-indigo-600 text-white px-3 rounded font-bold hover:bg-indigo-700 transition">+</button>
            </div>
            <div id="listaDatas" class="flex flex-wrap gap-2 pt-2 empty:hidden"></div>
            <p id="erroDatas" class="text-[10px] text-rose-500 hidden">Adicione pelo menos uma data.</p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Hora Início *</label>
              <input type="time" id="inputHoraInicio" required onchange="calcularHoras()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 text-sm focus:outline-none focus:border-indigo-600 font-mono text-center">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Hora Fim *</label>
              <input type="time" id="inputHoraFim" required onchange="calcularHoras()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 text-sm focus:outline-none focus:border-indigo-600 font-mono text-center">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 items-end">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Função *</label>
              <select id="selectFuncao" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 text-xs focus:outline-none focus:border-indigo-600 font-bold uppercase">
                <option value="FARMACEUTICO">FARMACÊUTICO</option>
                <option value="BALCONISTA">BALCONISTA</option>
                <option value="CAIXA">CAIXA</option>
              </select>
            </div>
            <div class="relative">
              <label class="block text-[10px] font-bold text-slate-600 uppercase absolute -top-5 right-0 flex items-center gap-1 cursor-pointer">
                <input type="checkbox" id="checkDiaria" onchange="toggleDiaria()" class="accent-indigo-600 cursor-pointer"> Diária (8h)
              </label>
              <input type="number" id="inputHoras" required step="0.5" readonly placeholder="Auto" class="w-full bg-slate-200 border border-slate-300 rounded-lg p-2 text-slate-800 text-sm font-mono text-center cursor-not-allowed">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Forma de Pagamento (Acordo) *</label>
            <select id="selectPagamento" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-800 text-xs focus:outline-none focus:border-indigo-600 font-bold uppercase">
              <option value="SEMANAL">SEMANAL (Semana corrente)</option>
              <option value="QUINZENAL">QUINZENAL (A cada 15 dias)</option>
              <option value="FOLHA">FECHAMENTO DA FOLHA (Mensal)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Observações da Loja</label>
            <textarea id="inputObs" rows="2" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-800 text-xs focus:outline-none focus:border-indigo-600"></textarea>
          </div>

          <div class="pt-2">
            <button type="submit" id="btnSalvar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition text-xs shadow-sm cursor-pointer uppercase tracking-wider">
              ENVIAR PARA APROVAÇÃO (RH)
            </button>
          </div>
        </form>
      </div>

      <!-- COLUNA DIREITA: Histórico -->
      <div class="lg:col-span-8 bg-white border border-slate-200 rounded-xl p-6 space-y-4 shadow-sm">
        <div class="flex justify-between items-center border-b border-slate-200 pb-3">
          <h2 class="font-bold text-slate-900 text-sm">MINHAS SOLICITAÇÕES</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-slate-500 bg-slate-50">
                <th class="p-3">DATA</th>
                <th class="p-3">COLABORADOR</th>
                <th class="p-3">HORÁRIO</th>
                <th class="p-3 text-center">HORAS</th>
                <th class="p-3">STATUS</th>
              </tr>
            </thead>
            <tbody id="tabelaSolicitacoes" class="divide-y divide-slate-100">
              <!-- Renderizado via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jmetpmdnaxwabeccimgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let datasSelecionadas = [];

    async function inicializar() {
      await carregarFuncionarios();
      await carregarHistorico();
    }

    async function carregarFuncionarios() {
      const { data, error } = await _supabase.from('funcionarios').select('id, nome_registro, cargo').eq('status', 'ATIVO').order('nome_registro');
      const select = document.getElementById('selectFuncionario');
      if (!error && data) {
        select.innerHTML = '<option value="">-- SELECIONE O COLABORADOR --</option>' + 
          data.map(f => `<option value="${f.id}">${f.nome_registro} ${String(f.cargo).includes('FREELANCE') ? ' ⚡[EXTERNO]' : ''}</option>`).join('');
      }
    }

    function formatarDataBR(dataIso) {
      const partes = dataIso.split('-');
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function adicionarData() {
      const input = document.getElementById('inputDataTemp');
      const erro = document.getElementById('erroDatas');
      if (!input.value) return;
      
      if (!datasSelecionadas.includes(input.value)) {
        datasSelecionadas.push(input.value);
        datasSelecionadas.sort();
        renderizarDatas();
        erro.classList.add('hidden');
      }
      input.value = '';
    }

    function removerData(dataIso) {
      datasSelecionadas = datasSelecionadas.filter(d => d !== dataIso);
      renderizarDatas();
    }

    function renderizarDatas() {
      const div = document.getElementById('listaDatas');
      div.innerHTML = datasSelecionadas.map(d => `
        <span class="bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-1 rounded flex items-center gap-1">
          ${formatarDataBR(d)} <button type="button" onclick="removerData('${d}')" class="text-indigo-500 hover:text-indigo-900">✕</button>
        </span>
      `).join('');
    }

    function toggleDiaria() {
      const isDiaria = document.getElementById('checkDiaria').checked;
      const inputHoras = document.getElementById('inputHoras');
      if (isDiaria) {
        inputHoras.value = '8';
      } else {
        calcularHoras();
      }
    }

    function calcularHoras() {
      if (document.getElementById('checkDiaria').checked) return;

      const inicio = document.getElementById('inputHoraInicio').value;
      const fim = document.getElementById('inputHoraFim').value;
      const inputHoras = document.getElementById('inputHoras');

      if (inicio && fim) {
        let [hIni, mIni] = inicio.split(':').map(Number);
        let [hFim, mFim] = fim.split(':').map(Number);
        
        let minutosTotal = (hFim * 60 + mFim) - (hIni * 60 + mIni);
        if (minutosTotal < 0) minutosTotal += 24 * 60; // Caso passe da meia noite
        
        inputHoras.value = (minutosTotal / 60).toFixed(1);
      } else {
        inputHoras.value = '';
      }
    }

    async function carregarHistorico() {
      const { data, error } = await _supabase
        .from('freelance_solicitacoes')
        .select(`*, funcionarios(nome_registro)`)
        .order('data_servico', { ascending: false })
        .limit(30);

      const tbody = document.getElementById('tabelaSolicitacoes');
      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Nenhuma solicitação encontrada.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(req => {
        let statusBadge = req.status === 'APROVADA' ? 'bg-emerald-100 text-emerald-700' : 
                          req.status === 'REJEITADA' ? 'bg-rose-100 text-rose-700' : 
                          'bg-amber-100 text-amber-700';
        return `
          <tr class="hover:bg-slate-50 border-b border-slate-50 last:border-0">
            <td class="p-3 font-mono font-bold text-slate-700">${formatarDataBR(req.data_servico)}</td>
            <td class="p-3 text-slate-800 font-bold">${req.funcionarios?.nome_registro || 'N/A'}<br><span class="text-[10px] text-slate-400 font-normal">${req.cargo_exercido}</span></td>
            <td class="p-3 font-mono text-slate-600 text-xs text-center">${req.hora_inicio.substring(0,5)} as ${req.hora_fim.substring(0,5)}</td>
            <td class="p-3 font-mono text-indigo-700 font-bold text-center">${req.horas_trabalhadas}h</td>
            <td class="p-3 text-center"><span class="${statusBadge} px-2 py-0.5 rounded text-[10px] font-bold">${req.status}</span></td>
          </tr>
        `;
      }).join('');
    }

    async function salvarSolicitacao(e) {
      e.preventDefault();
      
      if (datasSelecionadas.length === 0) {
        document.getElementById('erroDatas').classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('btnSalvar');
      btn.innerText = 'ENVIANDO...';
      btn.disabled = true;

      const baseData = {
        funcionario_id: document.getElementById('selectFuncionario').value,
        hora_inicio: document.getElementById('inputHoraInicio').value,
        hora_fim: document.getElementById('inputHoraFim').value,
        cargo_exercido: document.getElementById('selectFuncao').value,
        horas_trabalhadas: parseFloat(document.getElementById('inputHoras').value),
        forma_pagamento: document.getElementById('selectPagamento').value,
        observacao_lider: document.getElementById('inputObs').value,
        loja_solicitante: 'LOJA TESTE', // Futuramente virá da sessão do usuário
        status: 'PENDENTE'
      };

      // Cria um array de inserções (uma linha para cada data)
      const payload = datasSelecionadas.map(data_servico => ({ ...baseData, data_servico }));

      const { error } = await _supabase.from('freelance_solicitacoes').insert(payload);

      if (error) {
        alert('Erro ao enviar solicitação: ' + error.message);
      } else {
        document.getElementById('formFreelance').reset();
        datasSelecionadas = [];
        renderizarDatas();
        await carregarHistorico();
        alert('Solicitação(ões) enviada(s) com sucesso para o RH!');
      }

      btn.innerText = 'ENVIAR PARA APROVAÇÃO (RH)';
      btn.disabled = false;
    }

    inicializar();
  </script>
</body>
</html>
