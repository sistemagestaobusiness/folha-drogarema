<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folha de Pagamento - Sistema Drogarema</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6">

  <script>
    if (!localStorage.getItem('usuario_drogarema')) {
      alert('Acesso negado! Faça login primeiro.');
      window.location.href = 'login.html';
    }
  </script>

  <div class="max-w-7xl mx-auto mb-6 flex justify-between items-center border-b border-slate-700 pb-4">
    <div>
      <h1 class="text-2xl font-bold text-white">LANÇAMENTO DE FOLHA DE PAGAMENTO</h1>
      <p class="text-sm text-slate-400">Registre proventos e descontos mensais por colaborador</p>
    </div>
    <div class="space-x-2">
      <a href="funcionarios.html" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded font-semibold text-xs transition inline-block">
        ← FUNCIONÁRIOS
      </a>
      <button onclick="sair()" class="px-3 py-2 bg-rose-700 hover:bg-rose-600 text-white rounded font-semibold text-xs transition">
        SAIR
      </button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-lg h-fit">
      <h2 id="tituloForm" class="text-lg font-bold text-cyan-400 mb-4 border-b border-slate-700 pb-2">+ NOVO LANÇAMENTO</h2>
      <form id="folhaForm" class="space-y-4">
        <input type="hidden" id="folha_id">

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">FUNCIONÁRIO *</label>
          <select id="colaborador_id" required onchange="atualizarSalarioBase()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
            <option value="">Carregando funcionários...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">COMPETÊNCIA (MM/AAAA) *</label>
          <input type="text" id="competencia" required placeholder="EX: 08/2026"
            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">SALÁRIO BASE (R$)</label>
          <input type="text" id="salario_base_display" disabled placeholder="0,00"
            class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-400 text-sm font-mono cursor-not-allowed">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">HORAS EXTRAS (R$)</label>
            <input type="number" step="0.01" id="horas_extras" value="0.00" oninput="calcularLiquido()"
              class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">DESCONTOS (R$)</label>
            <input type="number" step="0.01" id="descontos" value="0.00" oninput="calcularLiquido()"
              class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div class="p-3 bg-slate-900 border border-slate-700 rounded">
          <span class="block text-xs font-semibold text-slate-400">SALÁRIO LÍQUIDO ESTIMADO:</span>
          <span id="salario_liquido_display" class="text-lg font-bold text-emerald-400 font-mono">R$ 0,00</span>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" id="btnSalvar" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded transition text-xs">
            ✓ SALVAR LANÇAMENTO
          </button>
          <button type="button" id="btnCancelar" onclick="limparFormulario()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-2 px-3 rounded transition text-xs">
            CANCELAR
          </button>
        </div>
      </form>
    </div>

    <div class="lg:col-span-2 bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-lg">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 class="text-lg font-bold text-cyan-400">HISTÓRICO DE FOLHAS</h2>
        <span id="totalRegistros" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-mono">0 registro(s)</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-900 text-slate-300 border-b border-slate-700">
              <th class="p-3">COMPETÊNCIA</th>
              <th class="p-3">FUNCIONÁRIO</th>
              <th class="p-3">H. EXTRAS</th>
              <th class="p-3">DESCONTOS</th>
              <th class="p-3">LÍQUIDO</th>
              <th class="p-3 text-right">AÇÕES</th>
            </tr>
          </thead>
          <tbody id="tabelaFolha" class="divide-y divide-slate-700">
            <tr>
              <td colSpan="6" class="p-4 text-center text-slate-400">Carregando lançamentos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jmetpmdnaxwabeccimgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hAUmVXDFrzRg5R1xGx_CoQ_bgct2D6k';

    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let listaFuncionarios = [];

    async function carregarFuncionariosSelect() {
      const { data, error } = await _supabase
        .from('funcionarios')
        .select('id, nome_registro, salario_base')
        .eq('status', 'ATIVO')
        .order('nome_registro', { ascending: true });

      const select = document.getElementById('colaborador_id');
      
      if (error || !data || data.length === 0) {
        select.innerHTML = `<option value="">Nenhum funcionário ativo encontrado</option>`;
        return;
      }

      listaFuncionarios = data;
      select.innerHTML = `<option value="">Selecione um Funcionário</option>` + 
        data.map(c => `<option value="${c.id}">${c.nome_registro}</option>`).join('');
    }

    function atualizarSalarioBase() {
      const id = document.getElementById('colaborador_id').value;
      const col = listaFuncionarios.find(c => c.id === id);
      const inputBase = document.getElementById('salario_base_display');
      
      if (col) {
        const salario = parseFloat(col.salario_base || 0);
        inputBase.value = salario.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      } else {
        inputBase.value = '0,00';
      }
      calcularLiquido();
    }

    function calcularLiquido() {
      const id = document.getElementById('colaborador_id').value;
      const col = listaFuncionarios.find(c => c.id === id);
      const base = col ? parseFloat(col.salario_base || 0) : 0;
      
      const he = parseFloat(document.getElementById('horas_extras').value) || 0;
      const desc = parseFloat(document.getElementById('descontos').value) || 0;
      
      const liquido = base + he - desc;
      document.getElementById('salario_liquido_display').innerText = 'R$ ' + liquido.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return liquido;
    }

    async function carregarFolha() {
      const { data, error } = await _supabase
        .from('folha_pagamento')
        .select('*, funcionarios(nome_registro)')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('tabelaFolha');
      const totalSpan = document.getElementById('totalRegistros');
      
      if (error) {
        tbody.innerHTML = `<tr><td colSpan="6" class="p-4 text-center text-rose-400">Erro: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colSpan="6" class="p-4 text-center text-slate-400">Nenhum lançamento registrado.</td></tr>`;
        totalSpan.innerText = '0 registro(s)';
        return;
      }

      totalSpan.innerText = `${data.length} registro(s)`;

      tbody.innerHTML = data.map(f => `
        <tr class="hover:bg-slate-700/50 transition">
          <td class="p-3 font-mono text-cyan-300 font-semibold">${f.competencia || '-'}</td>
          <td class="p-3 font-semibold text-white">${f.funcionarios ? f.funcionarios.nome_registro : 'N/A'}</td>
          <td class="p-3 text-slate-300 font-mono">R$ ${parseFloat(f.horas_extras || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
          <td class="p-3 text-rose-400 font-mono">R$ ${parseFloat(f.descontos || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
          <td class="p-3 text-emerald-400 font-mono font-bold">R$ ${parseFloat(f.salario_liquido || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
          <td class="p-3 text-right space-x-1 whitespace-nowrap">
            <button onclick="editarFolha('${f.id}')" class="px-2 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded font-semibold text-[10px] transition">
              EDITAR
            </button>
            <button onclick="excluirFolha('${f.id}')" class="px-2 py-1 bg-rose-700 hover:bg-rose-600 text-white rounded font-semibold text-[10px] transition">
              EXCLUIR
            </button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('folhaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('folha_id').value;

      const payload = {
        colaborador_id: document.getElementById('colaborador_id').value,
        competencia: document.getElementById('competencia').value.trim(),
        horas_extras: parseFloat(document.getElementById('horas_extras').value) || 0,
        descontos: parseFloat(document.getElementById('descontos').value) || 0,
        salario_liquido: calcularLiquido()
      };

      if (id) {
        const { error } = await _supabase.from('folha_pagamento').update(payload).eq('id', id);
        if (error) alert('Erro ao atualizar: ' + error.message);
        else alert('Lançamento atualizado com sucesso!');
      } else {
        const { error } = await _supabase.from('folha_pagamento').insert([payload]);
        if (error) alert('Erro ao salvar: ' + error.message);
        else alert('Lançamento salvo com sucesso!');
      }

      limparFormulario();
      carregarFolha();
    });

    async function editarFolha(id) {
      const { data, error } = await _supabase.from('folha_pagamento').select('*').eq('id', id).single();
      if (error) {
        alert('Erro ao buscar dados do lançamento: ' + error.message);
        return;
      }

      document.getElementById('folha_id').value = data.id;
      document.getElementById('colaborador_id').value = data.colaborador_id || '';
      document.getElementById('competencia').value = data.competencia || '';
      document.getElementById('horas_extras').value = data.horas_extras || 0;
      document.getElementById('descontos').value = data.descontos || 0;

      atualizarSalarioBase();

      document.getElementById('tituloForm').innerText = 'EDITAR LANÇAMENTO';
      document.getElementById('btnSalvar').innerText = '✓ ATUALIZAR LANÇAMENTO';
      document.getElementById('btnCancelar').classList.remove('hidden');
    }

    async function excluirFolha(id) {
      if (!confirm('Tem certeza que deseja excluir este lançamento de folha?')) return;

      const { error } = await _supabase.from('folha_pagamento').delete().eq('id', id);
      if (error) {
        alert('Erro ao excluir lançamento: ' + error.message);
      } else {
        alert('Lançamento excluído com sucesso!');
        carregarFolha();
      }
    }

    function limparFormulario() {
      document.getElementById('folha_id').value = '';
      document.getElementById('folhaForm').reset();
      document.getElementById('horas_extras').value = '0.00';
      document.getElementById('descontos').value = '0.00';
      document.getElementById('tituloForm').innerText = '+ NOVO LANÇAMENTO';
      document.getElementById('btnSalvar').innerText = '✓ SALVAR LANÇAMENTO';
      document.getElementById('btnCancelar').classList.add('hidden');
      atualizarSalarioBase();
    }

    function sair() {
      localStorage.removeItem('usuario_drogarema');
      window.location.href = 'login.html';
    }

    carregarFuncionariosSelect();
    carregarFolha();
  </script>
<!-- Script de Bloqueio por Inatividade (Ex: 15 minutos) -->
  <script>
    let tempoInatividade;
    const TEMPO_LIMITE = 15 * 60 * 1000; // 15 minutos em milissegundos

    function resetarTemporizador() {
      clearTimeout(tempoInatividade);
      tempoInatividade = setTimeout(fazerLogoutPorInatividade, TEMPO_LIMITE);
    }

    function fazerLogoutPorInatividade() {
      // Remove a credencial salva
      localStorage.removeItem('usuario_drogarema');
      
      // Alerta o usuário e redireciona para o login
      alert('Sessão expirada por inatividade. Faça login novamente.');
      window.location.href = 'login.html';
    }

    // Monitora eventos de movimento do mouse, cliques e digitação
    window.onload = resetarTemporizador;
    window.onmousemove = resetarTemporizador;
    window.onkeypress = resetarTemporizador;
    window.onclick = resetarTemporizador;
    window.onscroll = resetarTemporizador;
  </script>
</body>
</html>
